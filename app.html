<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilancio familiare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233f6f5f'/><rect x='7' y='17' width='4' height='9' rx='1.5' fill='%23fbfaf8'/><rect x='14' y='11' width='4' height='15' rx='1.5' fill='%23fbfaf8'/><rect x='21' y='6' width='4' height='20' rx='1.5' fill='%23fbfaf8'/></svg>">
<style>
:root{--bg:#fbfaf8;--card:#fff;--ink:#1c1a17;--dim:#6b6560;--line:#e6e1da;
--accent:#3f6f5f;--warn:#b5654a;--soft:#f2efe9}
@media (prefers-color-scheme:dark){:root{
--bg:#16161a;--card:#1e1e24;--ink:#eceaf0;--dim:#9c96a3;--line:#31313a;
--accent:#6fae99;--warn:#d98a6a;--soft:#26262e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.55 "Iowan Old Style",Georgia,serif}
/* Tre zone che non si mescolano mai: la SPALLA dice dove sono e cosa posso
   fare ai dati, la BARRA quale periodo sto guardando e cosa ne esce, il resto
   sono le prove. Prima navigazione, filtri e azioni stavano tutti nella stessa
   rotaia, e "cambia scheda" somigliava a "ricarica tutto". */
.telaio{display:grid;grid-template-columns:214px minmax(0,1fr);
align-items:start}
.spalla{position:sticky;top:0;height:100vh;overflow-y:auto;
background:var(--card);border-right:1px solid var(--line);
padding:16px 12px 12px;display:flex;flex-direction:column;gap:4px}
.spalla header{display:block;margin:0 0 14px;padding:0 8px}
.spalla .grow{flex:1;min-height:14px}
/* Le sezioni: una colonna, non una fila di linguette. */
#tablist{display:flex;flex-direction:column;gap:1px}
#tablist button{width:100%;text-align:left;border:1px solid transparent;
background:none;border-radius:7px;padding:7px 10px;color:var(--dim);
display:flex;align-items:center;gap:8px}
#tablist button:hover{background:var(--soft);color:var(--ink)}
#tablist button.on{background:var(--soft);color:var(--ink);font-weight:600}
#tablist .conta{margin-left:auto;font:600 11px ui-monospace,monospace;
background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);
border-radius:20px;padding:1px 7px}
/* Le azioni sui dati, staccate dalla navigazione da un filetto e da un
   titolo: navigare non e' ricaricare. */
.acts{display:flex;flex-direction:column;gap:5px;
border-top:1px solid var(--line);padding-top:12px}
.acts h3{margin:0 0 3px;font:600 10px/1 ui-sans-serif,system-ui,sans-serif;
letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.acts button{width:100%;text-align:left}
.acts .status{display:block;line-height:1.5;margin-top:10px}
.lato{min-width:0;padding:12px 14px 60px}
h1{font-size:21px;margin:0;letter-spacing:-.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);
margin:0 0 12px;font-family:ui-sans-serif,system-ui,sans-serif}
.ui{font-family:ui-sans-serif,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.grow{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
display:inline-block;margin-right:6px}
.dot.busy{background:#d99442;animation:pulse 1s infinite}
.dot.err{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.status{font:12px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
button,select,input{font:13px ui-sans-serif,system-ui,sans-serif;color:var(--ink);
background:var(--card);border:1px solid var(--line);border-radius:7px;
padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--dim)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.link{border:1px solid transparent;background:var(--soft);
color:var(--dim);padding:3px 9px;border-radius:6px;font-size:12px}
button.link:hover{color:var(--ink);border-color:var(--line)}
nav{display:flex;gap:4px;align-items:flex-end;
border-bottom:1px solid var(--line);margin:0 0 16px}
#tablist{display:flex;gap:4px}
nav #tablist button{border:none;background:none;border-radius:0;padding:9px 14px;
border-bottom:2px solid transparent;color:var(--dim)}
nav #tablist button.on{color:var(--ink);border-bottom-color:var(--accent);
font-weight:600}
nav>button{margin-bottom:7px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:10px 12px;margin-bottom:14px}
.bar label{font:11px ui-sans-serif,system-ui,sans-serif;color:var(--dim);
text-transform:uppercase;letter-spacing:.08em}
/* La barra: a sinistra il periodo e i filtri, a destra i numeri che ne
   discendono. Stanno insieme perche' sono la stessa frase: "in questo
   periodo, questi numeri". */
/* Il riquadro della scelta: il periodo sopra, i filtri di dettaglio sotto. */
.barra{background:var(--card);border:1px solid var(--line);border-radius:10px;
margin-bottom:10px}
#filters{border-top:1px solid var(--line) !important}
/* Il riquadro del recap: gli stessi numeri di prima, in un riquadro suo.
   Erano nella stessa cornice dei filtri e sembravano un filtro anche loro. */
.kpibar{display:flex;align-items:stretch;flex-wrap:wrap;
background:var(--card);border:1px solid var(--line);border-radius:10px;
margin-bottom:12px}
.barra .bar{border:none;background:none;margin:0;padding:8px 12px;
row-gap:6px}
/* I campi si stringono: a larghezza piena i filtri occupavano tre righe e la
   barra diventava un muro alto quanto un riquadro. */
.barra .bar select{max-width:132px}
.barra .bar input[type=date]{max-width:132px}
.barra .bar input[type=search]{max-width:180px}
.barra .bar label{opacity:.75}
.kpibar{display:flex;align-items:stretch}
.kpibar .kpi{border:none;border-left:1px solid var(--line);border-radius:0;
padding:11px 20px;flex:1 1 168px;text-align:right;background:none}
.kpibar .kpi:first-child{border-left:none}
.kpibar .kpi b{font-size:21px;font-variant-numeric:tabular-nums}
.kpibar .kpi span{display:block;margin-bottom:2px}


/* La tabella si allunga fino a raggiungere la pila accanto -- le due colonne
   sono alte uguali per costruzione -- e scorre dentro al suo riquadro solo se
   supererebbe lo schermo. E' il motivo per cui questa disposizione e' stata
   scelta: prima la dashboard era alta due schermate e mezzo. */
.pannello>.card{max-height:calc(100vh - 40px)}
/* Il pannello: a sinistra il riquadro che porta il peso, a destra la pila
   degli strumenti. Le due colonne sono alte uguali PER COSTRUZIONE, e' la
   griglia a legarle: prima si sperava che i contenuti si somigliassero, e
   fra due tabelle affiancate restavano 400px di vuoto. */
.pannello{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(316px,1fr);
gap:14px;align-items:stretch}
.pannello>.card{margin:0;display:flex;flex-direction:column;min-height:0}
.pannello .pila{display:flex;flex-direction:column;gap:14px;min-width:0}
.pannello .pila>.card{margin:0;padding:11px 15px}
.pannello .pila .head{margin-bottom:8px}
/* Il grafico in colonna stretta non ha bisogno di essere alto: qui serve la
   forma della curva, non leggerci sopra i valori. */
.pannello .pila svg{max-height:118px}
.pannello .pila .note{margin:6px 0 0;font-size:12px}
@media (max-width:1150px){.pannello{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:12px ui-sans-serif,system-ui,sans-serif;background:var(--soft);
border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:18px 20px;margin-bottom:14px}
/* I riquadri della dashboard su griglia: due grafici affiancati e tre tabelle
   in fila invece di una colonna sola alta come un palazzo. Ogni riquadro
   dichiara quante colonne occupa in SPAN, dentro app.html. */
.grid{display:grid;grid-template-columns:repeat(12, minmax(0, 1fr));
gap:14px;align-items:start}
.grid>.card{margin-bottom:0;grid-column:span 12}
.grid>.sp5{grid-column:span 5}
.grid>.sp6{grid-column:span 6}
.grid>.sp7{grid-column:span 7}
/* Stretto: prima si sfilano i due grafici, che hanno bisogno di larghezza,
   poi tutto torna in colonna. Le soglie sono in pixel CSS, che su Windows al
   125% sono gia' un quinto in meno di quelli veri: una soglia a 1500 sfilava
   i grafici su uno schermo da 1720, cioe' proprio dove serviva affiancarli. */
@media (max-width:1250px){.grid>.sp5,.grid>.sp7{grid-column:span 12}}
@media (max-width:1050px){.grid>.sp5,.grid>.sp6,.grid>.sp7{grid-column:span 12}}
.card>.head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;
margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:15px 17px}
.kpi b{display:block;font-size:23px;letter-spacing:-.02em;font-weight:600;
font-family:ui-sans-serif,system-ui,sans-serif}
.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;
color:var(--dim);font-family:ui-sans-serif,system-ui,sans-serif}
.kpi.good b{color:var(--accent)}.kpi.bad b{color:var(--warn)}
/* Il confronto col periodo prima: senza un metro un numero non e' ne'
   buono ne' cattivo, e non ci si decide niente. */
.delta{display:block;margin-top:5px;font-style:normal;font-size:11px;
font-family:ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.delta.meglio{color:var(--accent)}
.delta.peggio{color:var(--warn)}
.delta.pari{color:var(--dim)}
/* Le leve: cosa si puo' fare per abbassare ogni natura, e in quanto tempo.
   La leva e' il motivo per cui la natura esiste. */
.leve{display:flex;flex-direction:column}
.leva{display:grid;grid-template-columns:11px 1fr auto;gap:10px;
align-items:center;padding:4px 0;border-top:1px solid var(--line);
font:12px/1.35 ui-sans-serif,system-ui,sans-serif;cursor:default}
.leva:first-child{border-top:none}
.leva.hit{cursor:pointer}
.leva.hit:hover{background:var(--soft)}
.leva i{width:11px;height:11px;border-radius:2px}
.leva b{font-weight:600;display:block}
.leva span{color:var(--dim);display:block;font-size:11px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leva>div{min-width:0}
.leva u{text-decoration:none;font:600 14px ui-monospace,monospace;
font-variant-numeric:tabular-nums;white-space:nowrap}

/* Le tre viste della tabella unica: lo stesso denaro, guardato da un altro
   lato. Non sono tre riquadri, e' un riquadro con tre lati. */
.viste{display:inline-flex;gap:2px;background:var(--soft);border-radius:8px;
padding:2px;margin-bottom:10px}
.viste button{border:none;background:none;border-radius:6px;padding:4px 11px;
color:var(--dim);font-size:12px}
.viste button.on{background:var(--card);color:var(--ink);font-weight:600;
box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* La tabella di "Dove vanno i soldi". La quota e' un filetto sotto al nome:
   a piena altezza, dietro al testo, sembrava una riga selezionata invece di
   una misura. */
.tab-dove{flex:1;min-height:0;overflow:auto}
.tab-dove td{white-space:nowrap;font-variant-numeric:tabular-nums}
.tab-dove td:first-child{white-space:normal}
.tab-dove th.num,.tab-dove td:not(:first-child){text-align:right}
.tab-dove tr.sub td{font-size:12px;color:var(--dim)}
.tab-dove tr.sub td:first-child{padding-left:20px}
.tab-dove .q{position:relative}
.tab-dove .q i{position:absolute;left:0;bottom:3px;height:2px;border-radius:2px;
background:color-mix(in srgb,var(--accent) 55%,transparent);width:var(--w)}
.dove{color:var(--dim);font-size:11.5px;
font-family:ui-sans-serif,system-ui,sans-serif}

/* Il confronto d'anno ridotto alle voci che si sono mosse. */
.scarti{display:flex;flex-direction:column}
.scarti div{display:flex;justify-content:space-between;align-items:baseline;
gap:12px;padding:5px 0;border-top:1px solid var(--line);
font:13px ui-sans-serif,system-ui,sans-serif}
.scarti div:first-child{border-top:none}
.scarti em{font-style:normal;font-variant-numeric:tabular-nums}

/* L'avviso: una riga, non un riquadro alto centododici pixel per una frase. */
.avviso{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
font:13px ui-sans-serif,system-ui,sans-serif}
.avviso b{color:var(--warn)}
.avviso span{color:var(--dim);font-size:12px;flex:1}
.verdetto-partita{font-size:26px;margin:0 0 14px;letter-spacing:-.01em}
.verdetto-partita b{font-variant-numeric:tabular-nums}
text.lbl{font:12px ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
text.val{font:11px ui-monospace,monospace;fill:var(--dim)}
text.axis{font:10px ui-sans-serif,system-ui,sans-serif;fill:var(--dim)}
line.grid{stroke:var(--line);stroke-width:1}
rect.fascia{fill:#ffffff0f}
/* La riga verticale sotto al mouse: dice che il tooltip legge tutta la
   colonna del mese, non il singolo punto piu' vicino. */
line.guida{stroke:var(--dim);stroke-width:1;stroke-dasharray:4 4;opacity:.75}
svg .hit{cursor:pointer}
svg .hit:hover rect{opacity:.75}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(84px,168px) 1fr auto;
gap:10px;align-items:center;
font:12px ui-sans-serif,system-ui,sans-serif}
.bar-row.hit{cursor:pointer}
.bar-row.hit:hover i{opacity:.72}
.bar-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{display:block;height:16px;min-width:0}
.bar-track i{display:block;height:100%;border-radius:3px;min-width:2px}
.bar-val{font:11px ui-monospace,monospace;color:var(--dim);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;
font:12px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;
margin-right:5px;vertical-align:-1px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:13px ui-sans-serif,system-ui,sans-serif}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
color:var(--dim);border-bottom:1px solid var(--line);padding:7px 12px 7px 0;
font-weight:600;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
.note{font-size:13px;color:var(--dim);border-left:2px solid var(--line);
padding-left:14px;margin:12px 0}
.err{color:var(--warn);font:13px ui-sans-serif,system-ui,sans-serif;
border-left:2px solid var(--warn);padding-left:14px;margin:12px 0;
white-space:pre-wrap}
.compose{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:6px}
.compose div{display:flex;align-items:center;gap:6px;font:13px ui-sans-serif,
system-ui,sans-serif}
.compose .grow{flex:1}
.hide{display:none}
/* Il valore sotto al mouse. Segue il puntatore e non lo intercetta mai,
   altrimenti si rincorrerebbero. */
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--card);
border:1px solid var(--line);border-radius:8px;padding:8px 11px;
font:12px/1.6 ui-sans-serif,system-ui,sans-serif;color:var(--ink);
box-shadow:0 6px 20px rgba(0,0,0,.22);white-space:pre-line}
/* I riquadri di dialogo sono nostri, non del browser: quelli di sistema
   ignorano il tema, non si possono spiegare meglio di una riga di testo, e
   bloccano la pagina in un modo che nemmeno si puo' provare. <dialog> nativo
   perche' porta gia' fuoco, Esc e sfondo senza una libreria. */
#modale{border:1px solid var(--line);border-radius:12px;background:var(--card);
color:var(--ink);padding:0;max-width:520px;width:calc(100% - 40px);
box-shadow:0 18px 50px rgba(0,0,0,.28)}
#modale::backdrop{background:rgba(0,0,0,.45)}
#modale form{padding:22px 24px 18px;margin:0}
#modale p{margin:0 0 16px;white-space:pre-wrap;line-height:1.5;
font:14px/1.55 ui-sans-serif,system-ui,sans-serif}
#modale input{width:100%;margin-bottom:16px}
.modale-azioni{display:flex;gap:8px;justify-content:flex-end}
.mini{font:11px ui-monospace,monospace;color:var(--dim)}
.wide{min-width:260px}
.quick{display:flex;gap:5px;flex-wrap:wrap;width:100%;align-items:center;
padding-bottom:9px;margin-bottom:3px;border-bottom:1px solid var(--line)}
.rail .quick{padding-bottom:0;margin-bottom:0;border-bottom:none}
.rail .quick .anchor{margin-left:0;width:100%}
/* I pulsanti del metro sono fratelli di quelli del periodo, ma piu'
   sottovoce: scelgono come leggere i dati, non quali dati. */
.quick.confronto{border-bottom:none;padding-bottom:0;margin-bottom:0}
.quick.confronto button{font-size:11px;padding:3px 9px}
#f-confronto-eti{margin-top:6px}
.quick button{padding:4px 11px;border-radius:20px;font-size:12px}
.quick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.quick .anchor{font-size:11px;color:var(--dim);margin-left:auto}
input[data-rule-pattern]{min-width:340px;font-family:ui-monospace,monospace;font-size:12px}
/* Il log vive in un pannello a destra: la pagina si stringe invece di
   finirgli sotto, cosi' si legge la dashboard mentre il modello lavora. */
#log{position:fixed;top:0;right:0;bottom:0;width:440px;background:var(--card);
border-left:1px solid var(--line);display:none;flex-direction:column;z-index:20}
body.log-on #log{display:flex}
body.log-on .wrap{margin-right:440px}
#log .top{display:flex;align-items:center;gap:8px;padding:10px 12px;
border-bottom:1px solid var(--line);font:12px ui-sans-serif,system-ui,sans-serif}
#log .top b{font-size:11px;text-transform:uppercase;letter-spacing:.11em;
color:var(--dim);font-weight:600}
#log pre{margin:0;padding:10px 12px;overflow:auto;flex:1;white-space:pre-wrap;
word-break:break-word;font:11px/1.5 ui-monospace,SFMono-Regular,monospace;
color:var(--dim)}
#log .llm{color:var(--ink)}
#log .ok{color:var(--accent)}
#log .ko{color:var(--warn)}
#log .think{opacity:.65;font-style:italic}
@media (max-width:1100px){
  #log{width:100%;border-left:none}
  body.log-on .wrap{margin-right:0;display:none}
  /* Sotto questa larghezza la spalla non ci sta di fianco: torna una fascia
     in cima, con sezioni e azioni in orizzontale. Se restasse alta 100vh
     mangerebbe tutto lo schermo. */
  .telaio{display:block}
  .spalla{position:static;height:auto;overflow:visible;flex-direction:row;
    flex-wrap:wrap;align-items:center;gap:10px;
    border-right:none;border-bottom:1px solid var(--line)}
  .spalla header{margin:0}
  .spalla .grow{display:none}
  #tablist{flex-direction:row;flex-wrap:wrap}
  #tablist button{width:auto}
  .acts{flex-direction:row;flex-wrap:wrap;border-top:none;padding-top:0;
    align-items:center}
  .acts h3{display:none}
  .acts button{width:auto}
  .acts .status{margin-top:0}
  .lato{padding:12px 14px 60px}
}

/* --------------------------------------------------------------------------
   Rifinitura: le cose che si notano solo quando mancano.
   -------------------------------------------------------------------------- */

/* CIFRE ALLINEATE. In un'app di soldi i numeri cambiano di continuo, e con un
   font proporzionale le colonne ballano a ogni aggiornamento. Le cifre
   tabulari hanno tutte la stessa larghezza, quindi le colonne stanno ferme. */
.kpi b,.bar-val,td.num,.mini,#tip{font-variant-numeric:tabular-nums}

/* L'ANELLO DI FUOCO. Senza, chi naviga da tastiera non sa dove si trova: il
   contorno di sistema su fondo scuro e' quasi invisibile. */
button:focus-visible,select:focus-visible,input:focus-visible,
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;
border-radius:7px}

/* MOVIMENTO. Un cambio di stato istantaneo si legge come uno sfarfallio: due
   decimi di secondo bastano a farlo sembrare una risposta. */
button,select,input,.chip,.bar-track i,nav #tablist button{
transition:background-color .16s ease,border-color .16s ease,color .16s ease,
opacity .16s ease}
tbody tr{transition:background-color .12s ease}

/* PRESSIONE. Il pulsante si abbassa di un pelo: e' il segnale che il clic e'
   arrivato, prima ancora che succeda qualcosa. */
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.chip:active{transform:translateY(1px)}

/* Le righe di spiegazione non devono lasciare una parola sola in fondo. */
.note,#tip,.err{text-wrap:pretty}

/* Chi ha chiesto meno animazioni la deve avere. Il pulsare del pallino
   "elaboro" e' l'unica animazione continua, ed e' proprio quella che da'
   fastidio. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;
  animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="telaio">
  <!-- LA SPALLA. Sopra: dove sono. Sotto: cosa posso fare ai dati. In mezzo

<script>
"use strict";

// --------------------------------------------------------------------------
// stato
// --------------------------------------------------------------------------
let S = null;                     // ultimo payload dal server
let TAB = "dashboard";
let VERSION = -1;
const F = {from:"", to:"", account:"", nature:"", category:"", sub:"",
           text:"", confronto:"", vista:"", lettura:""};

// Le categorie hanno due livelli. Dentro al motore viaggiano unite
// ("Casa > Casalinghi"), qui arrivano gia' divise in Categoria e
// Sottocategoria; questa ricompone il nome intero, che resta la chiave con cui
// si parla col server.
const SEP = " > ";
const whole = t => t.Sottocategoria ? t.Categoria + SEP + t.Sottocategoria
                                    : (t.Categoria || "");

const TABS = [
  ["dashboard", "Dashboard"],
  ["revisione", "Da rivedere"],
  ["transazioni", "Transazioni"],
  ["partita", "Con Michela"],
  ["categorie", "Categorie"],
  ["regole", "Regole e merchant"],
  ["componi", "Componi"],
];

// Ogni natura col suo colore, la LEVA con cui si aggredisce e il tempo che
// ci vuole. La leva e' il motivo per cui la natura esiste: senza, il grafico
// mostra sette barre e lascia il lettore a indovinare cosa farne.
const NATURA = {
  "Discrezionali":  {colore:"#d99442", leva:"basta decidere di non farlo",
                     quando:"subito"},
  "Ricorrenti":     {colore:"#4a7fb5", leva:"disdette e cambio fornitore",
                     quando:"qualche mese"},
  "Quotidiane":     {colore:"#3f9e8c", leva:"dove fai la spesa, e quanto spesso",
                     quando:"settimane"},
  "Vincolate":      {colore:"#7c6a9c", leva:"surroga del mutuo, cambio polizza",
                     quando:"una volta l'anno"},
  "Straordinarie":  {colore:"#b5654a", leva:"non si comprime: va messa da parte",
                     quando:"—"},
  "Da chiarire":    {colore:"#8a8a8a", leva:"prima bisogna sapere cosa sono",
                     quando:"—"},
  "Da classificare":{colore:"#8a8a8a", leva:"da etichettare", quando:"—"},
  "Non spesa":      {colore:"#6b6560", leva:"", quando:""},
  "Entrate":        {colore:"#3f9e8c", leva:"", quando:""},
};
const NATURE_COLOR = Object.fromEntries(
  Object.entries(NATURA).map(([n, v]) => [n, v.colore]));

// --------------------------------------------------------------------------
// utilita'
// --------------------------------------------------------------------------
// Raggruppamento fatto a mano invece di toLocaleString: cosi' il formato non
// dipende dalla lingua del browser ne' dalla presenza dei dati ICU.
const euro = v => (v<0?"-":"")
  + String(Math.abs(Math.round(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ".")
  + " €";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el = id => document.getElementById(id);
const month = t => (t.Data||"").slice(0,7);
const uniq = a => [...new Set(a)].filter(Boolean).sort();

// --------------------------------------------------------------------------
// filtri rapidi
// --------------------------------------------------------------------------
const pad = n => String(n).padStart(2, "0");

// Intervallo di un mese, spostato di `delta` mesi. Date in UTC per non farsi
// spostare il primo del mese dal fuso orario.
function monthRange(year, monthNumber, delta){
  const start = new Date(Date.UTC(year, monthNumber - 1 + delta, 1));
  const y = start.getUTCFullYear(), m = start.getUTCMonth() + 1;
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(last)}`];
}

// I periodi del calendario si contano dal calendario. Ancorarli all'ultima
// transazione rendeva "Mese in corso" una bugia: mostrava gennaio essendo
// agosto. Se il periodo e' vuoto la risposta giusta e' "non hai dati per
// agosto", non un mese diverso da quello chiesto.
function today(){
  const d = new Date();
  return {y:d.getFullYear(), m:d.getMonth()+1,
          iso:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
}

// L'ultimo mese che ha davvero movimenti. Ha un pulsante suo, con un nome che
// dice quello che fa.
function lastDataMonth(){
  const dates = (S ? S.transactions : []).map(t => t.Data).filter(Boolean);
  if(!dates.length) return null;
  const last = dates.reduce((a,b) => a > b ? a : b);
  return {y:+last.slice(0,4), m:+last.slice(5,7), iso:last};
}

const QUICK = [
  ["Mese in corso", () => { const a = today(); return monthRange(a.y, a.m, 0); }],
  ["Mese scorso",   () => { const a = today(); return monthRange(a.y, a.m, -1); }],
  ["Ultimi 3 mesi", () => { const a = today();
                            return [monthRange(a.y, a.m, -2)[0],
                                    monthRange(a.y, a.m, 0)[1]]; }],
  ["Anno in corso", () => { const a = today();
                            return [`${a.y}-01-01`, `${a.y}-12-31`]; }],
  ["Anno scorso",   () => { const a = today();
                            return [`${a.y-1}-01-01`, `${a.y-1}-12-31`]; }],
  ["Ultimo mese con dati", () => { const a = lastDataMonth();
                                   return a ? monthRange(a.y, a.m, 0)
                                            : ["", ""]; }],
];

// I pulsanti del metro. Spariscono senza un periodo scelto, insieme al
// confronto stesso: senza periodo non c'e' niente da paragonare.
function renderConfronti(){
  const opzioni = confronti();
  const scelto = confrontoScelto();
  const vuoto = !opzioni.length;
  el("f-confronto").classList.toggle("hide", vuoto);
  el("f-confronto-eti").classList.toggle("hide", vuoto);
  el("f-confronto").innerHTML = opzioni.map(o =>
    `<button data-confronto="${esc(o.chiave)}"`
    + ` class="${scelto && scelto.chiave === o.chiave ? "on" : ""}">`
    + `${esc(o.etichetta)}</button>`).join("");
}

function renderQuick(){
  const ultimo = lastDataMonth();
  const adesso = today();
  const vecchi = ultimo && ultimo.iso.slice(0,7) !== adesso.iso.slice(0,7);
  el("f-quick").innerHTML = QUICK.map(([label, range], i) => {
    const [from, to] = range();
    const on = !!from && F.from === from && F.to === to;
    return `<button data-quick="${i}"${from ? "" : " disabled"} `
         + `class="${on ? "on" : ""}">${esc(label)}</button>`;
  }).join("")
    + (vecchi ? `<span class="anchor">oggi ${esc(adesso.iso)} · ultimo `
                + `movimento ${esc(ultimo.iso)}</span>` : "");
}


// Mesi contenuti nel periodo CHIESTO, estremi inclusi.
function monthsBetween(from, to){
  if(!from || !to) return 0;
  const a = +from.slice(0,4)*12 + +from.slice(5,7);
  const b = +to.slice(0,4)*12 + +to.slice(5,7);
  return b >= a ? b - a + 1 : 0;
}

const mesi = n => n === 1 ? "1 mese" : `${n} mesi`;

// Il periodo chiesto e quello effettivamente coperto dai dati sono due cose
// diverse, e vanno dette separatamente: "anno in corso" che mostra un solo
// mese sembra un filtro rotto, invece e' un anno appena cominciato. Serve
// anche a leggere le medie: "uscite/mese" sotto "anno in corso" e' la media
// dei mesi che hai, non di dodici.
function coverage(rows, months){
  if(!months.length){
    // Vuoto non e' un errore: e' l'informazione che per quel periodo non hai
    // ancora caricato niente. Dire dove sono gli ultimi dati evita di dover
    // andare a cercarli a mano.
    const ultimo = lastDataMonth();
    return "  ·  nessuna transazione nel periodo scelto"
      + (ultimo ? `. L'ultimo movimento che hai e' del ${ultimo.iso}: `
                  + `usa "Ultimo mese con dati", oppure copia nella cartella `
                  + `gli export piu' recenti.` : "");
  }
  const span = `da ${months[0]} a ${months[months.length-1]}`;
  const asked = monthsBetween(F.from, F.to);
  if(asked > months.length){
    return `  ·  ${rows.length} righe  ·  periodo chiesto ${mesi(asked)} `
      + `(${F.from} – ${F.to}), dati presenti per ${mesi(months.length)}: `
      + `${span}. Le medie mensili usano ${mesi(months.length)}, `
      + `non ${mesi(asked)}.`;
  }
  return `  ·  ${rows.length} righe su ${mesi(months.length)}, ${span}`;
}


// --------------------------------------------------------------------------
// riquadri di dialogo
// --------------------------------------------------------------------------
// Sostituiscono alert, confirm e prompt del browser. Tornano una promessa, e
// per questo ogni chiamata va attesa: e' l'unica differenza rispetto a prima.
function modale(opzioni){
  return new Promise(risolvi => {
    const dlg = el("modale"), campo = el("modale-campo"), no = el("modale-no");
    const scelta = el("modale-scelta"), nota = el("modale-nota");
    el("modale-testo").textContent = opzioni.testo;
    const chiede = opzioni.valore !== undefined;
    const sceglie = !!opzioni.scelte;
    campo.classList.toggle("hide", !chiede || sceglie);
    campo.value = chiede && !sceglie ? opzioni.valore : "";
    // Un menu invece di un campo libero quando le risposte sono un insieme
    // chiuso: cosi' non si puo' inventare una categoria che non esiste.
    scelta.classList.toggle("hide", !sceglie);
    if(sceglie){
      scelta.innerHTML = opzioni.scelte.map(s =>
        `<option ${s === opzioni.valore ? "selected" : ""}>${esc(s)}</option>`).join("");
    }
    // Una riga che si aggiorna mentre scegli: dice cosa succederebbe.
    nota.classList.toggle("hide", !opzioni.aggiorna);
    if(opzioni.aggiorna){
      const ridisegna = () => { nota.textContent = opzioni.aggiorna(scelta.value); };
      scelta.onchange = ridisegna;
      ridisegna();
    }
    no.classList.toggle("hide", !opzioni.annullabile);
    el("modale-si").textContent = opzioni.ok || "OK";
    // La risposta si prende dai tre modi in cui si puo' rispondere, non
    // dall'evento "close": su alcuni browser quell'evento non arriva, e la
    // promessa resterebbe appesa per sempre con la pagina bloccata dietro.
    // Sono proprieta' e non addEventListener, cosi' una chiamata sostituisce
    // la precedente invece di accumularsi.
    const chiudi = detto => {
      dlg.close();
      const dato = sceglie ? scelta.value : campo.value;
      risolvi(chiede ? (detto ? dato : null) : detto);
    };
    dlg.querySelector("form").onsubmit = ev => {   // OK, o Invio nel campo
      ev.preventDefault();
      chiudi(true);
    };
    no.onclick = () => chiudi(false);
    // Esc, per due strade: "cancel" e' quella prevista, ma su alcuni browser
    // non arriva, e allora la pagina resterebbe bloccata dietro a un riquadro
    // che non si chiude. Il tasto lo si ascolta anche direttamente.
    dlg.oncancel = ev => { ev.preventDefault(); chiudi(false); };
    dlg.onkeydown = ev => {
      if(ev.key === "Escape"){ ev.preventDefault(); chiudi(false); }
    };
    dlg.showModal();
    if(sceglie) scelta.focus();
    else if(chiede){ campo.focus(); campo.select(); }
  });
}
// Il valore sotto al mouse. Un solo ascolto sul documento invece di uno per
// fascia: le fasce si rifanno a ogni ridisegno del grafico, e agganciarle una
// per una vorrebbe dire riagganciarle ogni volta.
function seguiIlMouse(ev){
  const tip = el("tip");
  const banda = ev.target.closest && ev.target.closest("[data-tip]");
  // La guida si nasconde SEMPRE prima: uscendo dal grafico deve sparire, e
  // passando da un mese all'altro non deve restarne una accesa dietro.
  document.querySelectorAll("line.guida").forEach(g => g.classList.add("hide"));
  if(!banda){ tip.classList.add("hide"); return; }
  const guida = banda.ownerSVGElement
    && banda.ownerSVGElement.querySelector("line.guida");
  if(guida && banda.dataset.x){
    guida.setAttribute("x1", banda.dataset.x);
    guida.setAttribute("x2", banda.dataset.x);
    guida.classList.remove("hide");
  }
  tip.textContent = banda.dataset.tip;
  tip.classList.remove("hide");
  // Sopra e a destra del puntatore, ma senza uscire dalla finestra.
  const l = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY - h - 12;
  if(x + l > innerWidth - 8) x = ev.clientX - l - 14;
  if(y < 8) y = ev.clientY + 20;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = y + "px";
}
document.addEventListener("mousemove", seguiIlMouse);

const avvisa  = testo => modale({testo});
const chiedi  = testo => modale({testo, annullabile:true});
const domanda = (testo, valore) => modale({testo, valore: valore || "",
                                           annullabile:true});

function post(route, body){
  return fetch(route, {method:"POST", headers:{"Content-Type":"application/json"},
                       body:JSON.stringify(body)})
    .then(r => r.json())
    .then(r => { if(r.errore) avvisa(r.errore); return r; });
}

// Solo le uscite vere: i giroconti non impoveriscono, includerli falsa tutto.
// Un saldo e' lo stesso genere di cosa: e' un rimborso fra le due persone, non
// una spesa ne' un'entrata, e questo vale in entrambe le letture. E' l'unico
// caso in cui marcare una riga sposta un numero anche nella lettura tutto.
const spending = rows => rows.filter(t => t.Natura !== "Non spesa" && t.Quota !== "saldo");
// Il reddito vero e' quello di natura "Entrate": stipendio e affitti. Tutto
// il resto col segno positivo e' un rimborso o uno storno, e non e' guadagno:
// scala dalla spesa a cui appartiene, dove riduce quella voce.
//
// Dividere per segno diceva che guadagni 155.067 quando ne guadagni 143.671 e
// 11.396 ti tornano indietro. Il risparmio non cambia di un centesimo: le due
// funzioni continuano a spartirsi le stesse righe.
const inflow  = rows => spending(rows).filter(t => t.Natura === "Entrate");
const outflow = rows => spending(rows).filter(t => t.Natura !== "Entrate");
// Le righe che nessun livello deterministico ha saputo classificare: sono le
// uniche su cui l'LLM abbia qualcosa da dire, quindi sono la misura che dice
// se vale la pena aspettare i minuti che ci mette.
const uncategorized = rows => rows.filter(t => !t.Categoria);
// La somma passa dal moltiplicatore: e' l'unico punto da cui passano tutti i
// riquadri, quindi cambiarlo qui li cambia tutti insieme e nessuno puo'
// dimenticarsene.
const sum = rows => rows.reduce((s,t) => s + t.Importo * quotaDi(t), 0);
// Non tutte le somme rispondono a "quanto e' mio". Questa risponde a "quanti
// soldi muovono queste righe", punto: quanto passa una regola non dipende da
// chi ne deve una fetta all'altro, e non deve muoversi col cambio di lettura.
const sommaPiena = rows => rows.reduce((s,t) => s + t.Importo, 0);
const monthsOf = rows => Math.max(uniq(rows.map(month)).length, 1);

// I mesi CONTATI COME SONO DAVVERO: l'ultimo vale per la parte trascorsa.
//
// monthsOf() conta i mesi distinti, quindi un agosto fermo al 25 pesa come un
// mese intero e tutte le medie "al mese" scendono. Sul mutuo faceva 733 euro
// invece dei 786 veri, e per capire perche' bisognava aprire il consolidato.
// E' lo stesso errore che gli indicatori avevano gia' imparato a evitare col
// ritaglio: qui arriva anche alle tabelle.
//
// Solo l'ULTIMO mese si ritaglia. Un mese vuoto in mezzo e' un mese in cui non
// hai speso, e vale uno: toglierlo alzerebbe la media di un dato che non c'e'.
function mesiEffettivi(rows){
  const mesi = uniq(rows.map(month)).sort();
  if(!mesi.length) return 1;
  const ultimo = mesi[mesi.length - 1];
  const fino = rows.map(t => t.Data || "").filter(d => d.slice(0, 7) === ultimo)
    .reduce((a, b) => a > b ? a : b, "");
  if(!fino) return mesi.length;
  const giorniDelMese = new Date(Date.UTC(+ultimo.slice(0, 4),
                                          +ultimo.slice(5, 7), 0)).getUTCDate();
  const trascorsi = +fino.slice(8, 10);
  return mesi.length - 1 + trascorsi / giorniDelMese;
}

// Il denominatore di OGNI "al mese": barra degli indicatori e tabelle sotto
// devono dividere per lo stesso numero, altrimenti raccontano due storie
// sulle stesse righe (la barra diceva "1 mese", la tabella "0.806" - 24% di
// scarto, tutto a favore di un falso miglioramento). Un solo punto di
// passaggio e chi lo cambia lo cambia per tutti insieme.
const mesiPeriodo = rows => mesiEffettivi(spending(rows));

// Il periodo si puo' escludere. Serve all'andamento, che vive sullo storico:
// ritagliato al mese scelto si riduceva a un punto solo, cioe' a niente. Gli
// altri filtri restano, perche' quelli dicono DI COSA si sta parlando.
function filtered(conPeriodo){
  if(!S) return [];
  const periodo = conPeriodo !== false;
  return S.transactions.filter(t => {
    if(periodo && F.from && (t.Data||"") < F.from) return false;
    if(periodo && F.to && (t.Data||"") > F.to) return false;
    if(F.account && t.Conto !== F.account) return false;
    if(F.nature && t.Natura !== F.nature) return false;
    if(F.category && t.Categoria !== F.category) return false;
    if(F.sub && t.Sottocategoria !== F.sub) return false;
    if(F.text){
      const hay = ((t.Descrizione||"")+" "+(t.Merchant||"")).toLowerCase();
      if(!hay.includes(F.text.toLowerCase())) return false;
    }
    return true;
  });
}

// Stessa regola di sum: ogni chiamante raggruppa spese o entrate per dire
// "quanto ho speso in questa categoria/natura", quindi passa dal
// moltiplicatore. Se un domani un chiamante volesse i soldi mossi e basta,
// gli serve una funzione a parte come sommaPiena, non un flag qui dentro.
function groupSum(rows, key){
  const map = new Map();
  for(const t of rows){
    const k = t[key] || "Senza categoria";
    const cur = map.get(k) || {total:0, n:0};
    cur.total += (t.Importo || 0) * quotaDi(t); cur.n++;
    map.set(k, cur);
  }
  return [...map.entries()].map(([name,v]) => ({name, ...v}))
                           .sort((a,b) => a.total - b.total);
}

// --------------------------------------------------------------------------
// grafici (stessa logica di dashboard.py, ma reagiscono ai filtri)
// --------------------------------------------------------------------------
// Barre in HTML, non in SVG. Un SVG con viewBox fisso scala TUTTO quando il
// riquadro si stringe, testo compreso: dentro una colonna da 440px le
// etichette scendevano a sette pixel. Qui l'etichetta e l'importo restano
// alla loro dimensione e si adatta solo la barra, che e' l'unica cosa che
// deve adattarsi.
function barChart(items, opts){
  opts = opts || {};
  if(!items.length) return '<p class="note">nessun dato</p>';
  const top = Math.max(...items.map(i => Math.abs(i.value))) || 1;
  return '<div class="bars">' + items.map(it => {
    const w = Math.abs(it.value) / top * 100;
    const click = opts.drill ? ` class="bar-row hit" data-drill="${esc(opts.drill)}"`
                             + ` data-value="${esc(it.name)}"` : ' class="bar-row"';
    return `<div${click}>`
      + `<span class="bar-lbl" title="${esc(String(it.name))}">`
      + `${esc(String(it.name))}</span>`
      + `<span class="bar-track"><i style="width:${w.toFixed(1)}%;`
      + `background:${esc(it.color||"#4a7fb5")}"></i></span>`
      + `<span class="bar-val">${euro(it.value)}</span></div>`;
  }).join("") + "</div>";
}

// "2026-08" -> "agosto 2026". Sull'asse ci sta solo "26-08", ma nel
// tooltip, che si legge, il mese per esteso costa niente.
const NOMI_MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno",
  "luglio","agosto","settembre","ottobre","novembre","dicembre"];
function meseLeggibile(etichetta){
  const m = /^(\d{4})-(\d{2})$/.exec(String(etichetta || ""));
  return m ? `${NOMI_MESI[+m[2]-1]} ${m[1]}` : String(etichetta || "");
}

function lineChart(labels, series, dentro){
  if(!labels.length) return '<p class="note">nessun dato</p>';
  const W = 760, H = 230, LEFT = 56, BASE = H - 26;
  const flat = series.flatMap(s => s.values).concat([0]);
  const top = Math.max(...flat) || 1, bottom = Math.min(...flat);
  const span = (top - bottom) || 1;
  // Con un punto solo si centra: lasciarlo a sinistra con mezzo riquadro
  // vuoto sembra un grafico troncato invece di un mese solo.
  const px = (i,v) => [labels.length === 1 ? (LEFT + W - 12)/2
                         : LEFT + i*(W-LEFT-12)/Math.max(labels.length-1,1),
                       12 + (top-v)/span*(BASE-12)];
  const passo = (W-LEFT-12)/Math.max(labels.length-1,1);
  let out = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  // La fascia del periodo scelto. La linea resta intera: si vede dove cade il
  // periodo di cui parlano gli indicatori, e insieme da dove viene.
  if(dentro && dentro.length && dentro.length < labels.length){
    const a = labels.indexOf(dentro[0]);
    const b = labels.indexOf(dentro[dentro.length-1]);
    if(a >= 0 && b >= a){
      const x1 = px(a, top)[0] - passo/2, x2 = px(b, top)[0] + passo/2;
      out += `<rect class="fascia" x="${Math.max(x1, LEFT).toFixed(1)}" y="6"`
          + ` width="${(Math.min(x2, W-12) - Math.max(x1, LEFT)).toFixed(1)}"`
          + ` height="${(BASE-6).toFixed(0)}"/>`;
    }
  }
  [0,0.5,1].forEach(f => {
    const y = 12 + f*(BASE-12), v = top - f*span;
    out += `<line x1="${LEFT}" y1="${y.toFixed(0)}" x2="${W-12}" y2="${y.toFixed(0)}" class="grid"/>`
        + `<text x="0" y="${(y+4).toFixed(0)}" class="axis">${(v/1000).toFixed(1)}k</text>`;
  });
  // Con pochi punti si segnano anche i pallini. Serve soprattutto quando il
  // punto e' UNO: una polilinea di un punto solo non disegna niente, e il
  // riquadro sembrava vuoto pur avendo i dati sotto.
  const pallini = labels.length <= 12;
  for(const s of series){
    const pts = s.values.map((v,i) => px(i,v).map(n => n.toFixed(1)).join(",")).join(" ");
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}"`
        + ` stroke-width="2.5" stroke-linejoin="round"/>`;
    if(pallini) out += s.values.map((v,i) => {
      const [x,y] = px(i,v);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"`
        + ` fill="${s.color}"/>`;
    }).join("");
  }
  out += `<line class="guida hide" x1="0" y1="10" x2="0" y2="${BASE}"/>`;
  // Una fascia invisibile per mese: e' lei a rispondere al mouse. Larga
  // quanto il passo, cosi' basta AVVICINARSI al punto invece di centrarlo, e
  // funziona anche a cinquantasei mesi dove i pallini non ci sono.
  labels.forEach((etichetta,i) => {
    const [x] = px(i, top);
    const testo = [meseLeggibile(etichetta)].concat(series.map(s =>
      `${s.name}: ${euro(s.values[i])}`)).join("\n");
    out += `<rect x="${(x-passo/2).toFixed(1)}" y="0" width="${passo.toFixed(1)}"`
        + ` height="${H}" fill="transparent" data-tip="${esc(testo)}"`
        + ` data-x="${x.toFixed(1)}"/>`;
  });
  const step = Math.max(1, Math.floor(labels.length/12));
  for(let i=0;i<labels.length;i+=step){
    const [x] = px(i, top);
    out += `<text x="${x.toFixed(0)}" y="${H-6}" class="axis" text-anchor="middle">`
        + `${esc(labels[i].slice(2))}</text>`;
  }
  return out + "</svg>";
}

const legend = series => '<div class="legend">' + series.map(s =>
  `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("") + "</div>";

function tableHTML(headers, rows, right){
  right = right || [];
  return '<div class="scroll"><table><thead><tr>'
    + headers.map(h => `<th>${esc(h)}</th>`).join("")
    + "</tr></thead><tbody>"
    + rows.map(r => "<tr>" + r.map((c,i) =>
        `<td${right.includes(i)?' class="num"':""}>${c}</td>`).join("") + "</tr>").join("")
    + "</tbody></table></div>";
}

// --------------------------------------------------------------------------
// riquadri della dashboard
// --------------------------------------------------------------------------
const CARDS = {};

// Gli indicatori vivono nella barra, accanto ai pulsanti del periodo:
// "in questo periodo, questi numeri" e' una frase sola, e spezzarla in un
// riquadro sotto ai filtri la faceva leggere due volte. Torna solo le celle;
// e' render() a metterle in #kpibar.
function indicatori(rows){
  const out = outflow(rows), inc = inflow(rows), m = mesiPeriodo(rows);
  const spent = sum(out), earned = sum(inc), saved = earned + spent;
  const ordinary = sum(out.filter(t => t.Natura !== "Straordinarie"));

  // Risparmio e tasso hanno senso solo sul bilancio intero. Su un
  // sottoinsieme di sole uscite darebbero "tasso di risparmio -760%": un
  // numero che sembra una conclusione e non vuol dire niente. Quando un
  // filtro esclude le entrate si mostra il peso di quella fetta.
  const partial = !!(F.nature || F.category || F.text);
  if(partial){
    const whole = sum(outflow(S.transactions));
    return kpi("uscite / mese", spesa(spent/m))
      + kpi("totale nel periodo", spesa(spent))
      + kpi("quota sulle uscite",
            whole ? Math.round(spent/whole*100) + "%" : "—")
      + kpi("transazioni", String(out.length))
      // m e' passato a mesiEffettivi (frazionario) col resto della barra:
      // senza arrotondare qui si rivedeva a schermo lo stesso raw float
      // gia' trovato in CARDS.dove ("14/55.806451612903224 mesi").
      + kpi("mesi coperti", String(Math.round(m)));
  }

  const rate = earned ? saved/earned : 0;

  // Gli stessi numeri sul periodo precedente, per dare un metro.
  const p = finestraConfronto();
  const prima = p ? S.transactions.filter(t =>
    dentroFinestra(p, t.Data || "")) : [];
  // Stesso metro dei due lati: la finestra di confronto e' gia' ritagliata
  // al giorno in cui si fermano i dati, quindi anche il suo ultimo mese e'
  // parziale e va contato per la parte trascorsa.
  const mp = mesiEffettivi(spending(prima)) || 1;
  const spesoP = sum(outflow(prima)), presoP = sum(inflow(prima));
  const ordinarioP = sum(outflow(prima).filter(t => t.Natura !== "Straordinarie"));
  const tassoP = presoP ? (presoP + spesoP)/presoP : 0;

  return kpi("entrate / mese", euro(earned/m), "",
          confronta(earned/m, presoP/mp, false, p && p.etichetta))
    + kpi("uscite / mese", spesa(spent/m), "",
          confronta(-spent/m, -spesoP/mp, true, p && p.etichetta))
    + kpi("risparmio / mese", euro(saved/m), saved>0?"good":"bad",
          confronta(saved/m, (presoP+spesoP)/mp, false, p && p.etichetta))
    + kpi("tasso di risparmio", Math.round(rate*100) + "%", "",
          confronta(rate, tassoP, false, p && p.etichetta))
    + kpi("spesa ordinaria / mese", spesa(ordinary/m), "",
          confronta(-ordinary/m, -ordinarioP/mp, true, p && p.etichetta));
}
const kpi = (label, value, cls, confronto) =>
  `<div class="kpi ${cls||""}"><span>${esc(label)}</span><b>${esc(value)}</b>`
  + (confronto ? `<i class="delta ${confronto.verso}">${esc(confronto.testo)}</i>` : "")
  + "</div>";

// --------------------------------------------------------------------------
// il metro del confronto
// --------------------------------------------------------------------------
// Un numero senza paragone non decide niente, ma il paragone sbagliato decide
// male. Il periodo precedente non e' sempre il metro giusto, e soprattutto va
// RITAGLIATO: agosto con i dati fino al 25 confrontato con luglio intero
// diceva "-80% di entrate", che non e' un crollo, e' un mese a meta'.

const MESI_BREVI = ["","gen","feb","mar","apr","mag","giu","lug","ago","set",
                    "ott","nov","dic"];

// Che forma ha il periodo scelto: un mese di calendario, un anno, o altro.
function formaDelPeriodo(){
  if(!F.from || !F.to) return null;
  const y = +F.from.slice(0,4), m = +F.from.slice(5,7);
  const [ma, mb] = monthRange(y, m, 0);
  if(F.from === ma && F.to === mb) return {tipo:"mese", y, m};
  if(F.from === `${y}-01-01` && F.to === `${y}-12-31`) return {tipo:"anno", y};
  return {tipo:"intervallo"};
}

// Le opzioni di confronto disponibili, che dipendono dalla forma del periodo.
// Senza un periodo scelto non ce n'e' nessuna: il riquadro mostra la media su
// tutto lo storico, e prima di tutto lo storico non c'e' niente.
function confronti(){
  const f = formaDelPeriodo();
  if(!f) return [];
  if(f.tipo === "mese") return [
    {chiave:"precedente", etichetta:"mese prima"},
    {chiave:"annoPrima",  etichetta:`${MESI_BREVI[f.m]} ${f.y-1}`},
    {chiave:"media12",    etichetta:"media 12 mesi"},
  ];
  if(f.tipo === "anno") return [
    {chiave:"annoPrima", etichetta:`${f.y-1}`},
    {chiave:"media3",    etichetta:"media 3 anni"},
  ];
  return [{chiave:"precedente", etichetta:"periodo prima"}];
}

// Quale opzione e' attiva. Cambiando periodo le opzioni cambiano, e una
// scelta non piu' valida ricade sulla prima invece di restare appesa.
function confrontoScelto(){
  const opzioni = confronti();
  if(!opzioni.length) return null;
  return opzioni.find(o => o.chiave === F.confronto) || opzioni[0];
}

// Le date si costruiscono in UTC perche' isoData() le rilegge con
// toISOString(), che e' UTC: mescolando i due fusi si perde un giorno
// intero, e il ritaglio diceva "1-24" dove i dati arrivano al 25.
const giorno = s => new Date(s + "T00:00:00Z");
const isoData = d => d.toISOString().slice(0, 10);
const piuGiorni = (s, n) => isoData(new Date(giorno(s).getTime() + n*86400000));

// Fin dove arrivano i DATI dentro al periodo scelto. Non la fine del periodo:
// agosto finisce il 31, ma i movimenti si fermano al 25.
//
// Il confine e' l'ultimo movimento IN ASSOLUTO, non l'ultimo dentro al
// periodo: se in dicembre 2025 l'ultima spesa e' del 28, l'anno e' comunque
// finito e non va ritagliato. Ritagliare li' vorrebbe dire chiamare "parziale"
// un periodo chiuso solo perche' gli ultimi giorni sono stati tranquilli.
function ultimoGiornoUtile(){
  const tutte = S.transactions.map(t => t.Data || "").filter(Boolean);
  if(!tutte.length) return F.to;
  const ultimo = tutte.reduce((a, b) => a > b ? a : b);
  return ultimo < F.to ? ultimo : F.to;
}

function giorniConDati(){
  const fino = ultimoGiornoUtile();
  if(fino < F.from) return 0;
  return Math.round((giorno(fino) - giorno(F.from)) / 86400000) + 1;
}

// La finestra con cui confrontare, gia' ritagliata, e come si chiama.
function finestraConfronto(){
  const scelto = confrontoScelto();
  if(!scelto) return null;
  const f = formaDelPeriodo();
  const durata = giorniConDati();
  if(!durata) return null;

  // Il ritaglio: la finestra si ferma allo stesso punto del calendario a cui
  // si fermano i dati. Per un mese o un anno il punto sono lo stesso mese e lo
  // stesso giorno del mese, non un numero di giorni: contando i giorni, il
  // 2025 intero (365) misurato sul 2024 bisestile (366) finiva il 30 dicembre
  // e si dichiarava parziale. Per un intervallo qualsiasi, dove non c'e' un
  // calendario a cui agganciarsi, i giorni restano l'unica misura.
  const fino = ultimoGiornoUtile();
  const ritaglia = (inizio, fineIntera) => {
    let fine;
    if(f && f.tipo !== "intervallo"){
      const salto = (+fino.slice(0,4)*12 + +fino.slice(5,7))
                  - (+F.from.slice(0,4)*12 + +F.from.slice(5,7));
      const [primo, ultimo] = monthRange(+inizio.slice(0,4),
                                         +inizio.slice(5,7), salto);
      const stessoGiorno = primo.slice(0, 8) + fino.slice(8, 10);
      fine = stessoGiorno < ultimo ? stessoGiorno : ultimo;  // febbraio non ha il 30
    } else {
      fine = piuGiorni(inizio, durata - 1);
    }
    return {da: inizio, a: fine < fineIntera ? fine : fineIntera,
            parziale: fine < fineIntera};
  };

  if(scelto.chiave === "precedente"){
    const fineIntera = piuGiorni(F.from, -1);
    const inizio = f && f.tipo === "mese"
      ? monthRange(f.y, f.m, -1)[0]                 // il mese prima, intero
      : piuGiorni(fineIntera, -(Math.round(
          (giorno(F.to) - giorno(F.from)) / 86400000)));
    const w = ritaglia(inizio, fineIntera);
    return {...w, etichetta: nomeFinestra(w, f, "precedente", scelto)};
  }
  if(scelto.chiave === "annoPrima"){
    const inizio = f.tipo === "mese" ? monthRange(f.y-1, f.m, 0)[0]
                                     : `${f.y-1}-01-01`;
    const fineIntera = f.tipo === "mese" ? monthRange(f.y-1, f.m, 0)[1]
                                         : `${f.y-1}-12-31`;
    const w = ritaglia(inizio, fineIntera);
    return {...w, etichetta: nomeFinestra(w, f, "annoPrima", scelto)};
  }
  // Anche le medie si ritagliano, ma in un altro modo: la finestra resta
  // lunga, e di OGNI mese (o di ogni anno) si tiene solo la parte gia'
  // trascorsa. Accorciarla non servirebbe: 25 giorni di agosto misurati su
  // dodici mesi interi dicevano "-81% di entrate", ma nessuno dei dodici mesi
  // e' il colpevole, lo sono i sei giorni che ad agosto mancano.
  const quanti = scelto.chiave === "media12" ? 12 : 36;
  // I mesi si contano con monthRange, non a mano: sottraendo mesi da una data
  // veniva fuori una finestra di undici mesi chiamata "media 12 mesi".
  const fine = piuGiorni(F.from, -1);
  const inizio = monthRange(+fine.slice(0,4), +fine.slice(5,7), -(quanti-1))[0];
  if(fino >= F.to)
    return {da: inizio, a: fine, parziale: false, etichetta: scelto.etichetta};
  // Il taglio confronta la CODA della data: per un mese il giorno ("25"), per
  // un anno il mese e il giorno ("08-25").
  const taglio = f.tipo === "mese" ? {da: 8, fino: fino.slice(8)}
                                   : {da: 5, fino: fino.slice(5)};
  return {da: inizio, a: fine, parziale: true, taglio,
          etichetta: nomeFinestra({parziale: true, a: fino}, f, scelto.chiave,
                                  scelto)};
}

// Le righe dentro a una finestra, taglio compreso.
function dentroFinestra(p, data){
  if(data < p.da || data > p.a) return false;
  return !p.taglio || data.slice(p.taglio.da) <= p.taglio.fino;
}

// Come si chiama la finestra, col ritaglio dichiarato: un numero di cui non si
// sa la provenienza non serve a niente.
function nomeFinestra(w, f, chiave, scelto){
  if(!w.parziale) return scelto.etichetta;
  const meseFine = +w.a.slice(5,7);
  if(f && f.tipo === "anno")
    return `${scelto.etichetta} (gen\u2013${MESI_BREVI[meseFine]})`;
  return `${scelto.etichetta} (1\u2013${+w.a.slice(8,10)})`;
}

function confronta(ora, prima, spesaMeglioSeScende, metro){
  if(!prima || Math.abs(prima) < 0.01) return null;
  const scarto = (ora - prima) / Math.abs(prima);
  if(Math.abs(scarto) < 0.005)
    return {verso:"pari", testo:`come ${metro}`};
  const meglio = spesaMeglioSeScende ? ora < prima : ora > prima;
  const segno = scarto > 0 ? "+" : "";
  return {verso: meglio ? "meglio" : "peggio",
          testo: `${segno}${Math.round(scarto*100)}% contro ${metro}`};
}

// --------------------------------------------------------------------------
// dove vanno i soldi: un riquadro solo, tre modi di guardarlo
// --------------------------------------------------------------------------
// Prima erano cinque: per natura, per merchant ricorrente, per categoria, per
// categoria anno su anno, per merchant. Le stesse righe misurate in modi
// diversi, senza niente che dicesse quale leggere per prima -- "Costi
// ricorrenti" e "Dove finiscono i soldi" condividevano meta' delle voci con
// numeri diversi, e "Voci per costo annuo" e "Aree anno su anno" avevano le
// righe identiche. Adesso la domanda e' una e la risposta pure; a cambiare e'
// solo da quale lato la si guarda.

const VISTE = [["area", "area"], ["negozio", "negozio"],
               ["ricorrenti", "solo i ricorrenti"]];

// Una spesa si scrive senza il meno: la colonna dice gia' che sono uscite, e
// il segno su ogni riga non aggiunge niente da leggere. Resta dove un valore
// puo' davvero essere positivo -- risparmio, rimborsi, differenze.
const spesa = v => euro(Math.abs(v));

// Quanto di una riga e' tuo. Nella lettura predefinita tutto: e' il costo
// pieno, ed e' quello che l'app ha sempre mostrato. Nella seconda lettura
// dipende da chi ha pagato e da quanto ne deve l'altro.
//
//   ho pagato io + meta' a lei    -> meta' e' mia
//   ho pagato io + tutto a lei    -> niente e' mio, l'ho solo anticipato
//   ha pagato lei + meta' a me    -> meta' e' mia
//   ha pagato lei + tutto a me    -> e' tutta mia
//   un saldo                      -> non e' una spesa, non pesa
function quotaDi(t){
  if(F.lettura !== "mia") return 1;
  const quota = t.Quota || "";
  if(!quota) return 1;
  if(quota === "saldo") return 0;
  const mia = t["Pagato da"] === "io"
    ? (quota === "tutto" ? 0 : 0.5)
    : (quota === "tutto" ? 1 : 0.5);
  return mia;
}

// Il confronto fra due periodi, a parole. Il segno da solo mentiva: in
// "differenza -3.996" il meno voleva dire "hai speso di PIU'", l'opposto di
// quello che chiunque legge, tanto che serviva una nota a pie' di pagina per
// spiegarlo. E una percentuale come -943% non e' informazione: quando lo
// scarto e' fuori scala si dice da dove a dove.
function scarto(prima, dopo){
  const a = Math.abs(prima), b = Math.abs(dopo);
  if(a < 1 && b < 1) return null;
  const d = b - a;
  if(Math.abs(d) < 1) return {testo:"uguale", verso:"pari"};
  const verso = d > 0 ? "peggio" : "meglio";
  if(a < 1) return {testo:`nuova: ${spesa(b)}`, verso};
  if(Math.abs(d / a) > 2)
    return {testo:`da ${spesa(a)} a ${spesa(b)}`, verso};
  return {testo:`${spesa(d)} in ${d > 0 ? "piu'" : "meno"}`, verso};
}

// Gli stessi mesi dei due anni. L'anno in corso e' quasi sempre incompleto:
// confrontarlo intero contro un anno pieno direbbe "hai speso il 97% in
// meno", che e' falso -- mancano undici mesi.
function anniAConfronto(out){
  const anni = uniq(out.map(t => (t.Data||"").slice(0,4))).sort().slice(-2);
  if(anni.length < 2) return null;
  const ultimo = out.filter(t => (t.Data||"").startsWith(anni[1]))
    .reduce((m,t) => Math.max(m, +(t.Data||"").slice(5,7) || 0), 0);
  const dentro = (t, y) => (t.Data||"").startsWith(y)
    && +(t.Data||"").slice(5,7) <= ultimo;
  return {anni, ultimo, dentro, parziale: ultimo < 12};
}

CARDS.dove = rows => {
  const vista = VISTE.some(v => v[0] === F.vista) ? F.vista : "area";
  const m = mesiPeriodo(rows);
  const out = outflow(rows);
  const conf = anniAConfronto(out);
  const totale = Math.abs(sum(out)) || 1;

  const scelta = '<div class="viste">' + VISTE.map(([k, eti]) =>
    `<button data-vista="${k}" class="${k === vista ? "on" : ""}">`
    + `${esc(eti)}</button>`).join("") + "</div>";

  // Ogni riga sa dire il suo scarto d'anno: e' la colonna che prima viveva
  // in un riquadro tutto suo con le stesse identiche voci.
  const scartoDi = filtro => {
    if(!conf) return null;
    const a = sum(out.filter(t => filtro(t) && conf.dentro(t, conf.anni[0])));
    const b = sum(out.filter(t => filtro(t) && conf.dentro(t, conf.anni[1])));
    return scarto(a, b);
  };

  const riga = (nome, tot, n, opzioni) => {
    const o = opzioni || {};
    const s = o.scarto;
    const quota = Math.round(Math.abs(tot) / totale * 100);
    return `<tr class="${o.sub ? "sub" : "area"}">`
      + `<td class="q" style="--w:${Math.min(quota, 100)}%"><i></i>`
      + `<button class="link" data-drill="${o.drill}" `
      + `data-value="${esc(nome)}">${esc(nome)}</button>`
      + (o.nota ? ` <span class="dove">${esc(o.nota)}</span>` : "")
      + `</td>`
      + `<td>${spesa(tot/m)}</td><td>${spesa(tot/m*12)}</td>`
      + `<td class="dove">${quota}%</td>`
      + `<td class="${s ? "delta " + s.verso : "dove"}">`
      + `${s ? esc(s.testo) : "—"}</td>`
      + `<td class="dove">${n}</td></tr>`;
  };

  let corpo = "", intestazioni;
  if(vista === "area"){
    intestazioni = ["voce", "al mese", "all'anno", "quota",
                    conf ? `su ${conf.anni[0]}` : "su un anno fa", "tx"];
    // Due livelli in una tabella sola: l'area, e sotto le sue voci. Prima
    // "dentro Casa, cosa?" era un altro riquadro; qui e' la riga seguente.
    const aree = groupSum(out, "Categoria");
    for(const a of aree.slice(0, 12)){
      corpo += riga(a.name, a.total, a.n, {
        drill:"category", scarto:scartoDi(t => (t.Categoria||"") === a.name)});
      const figlie = groupSum(out.filter(t => (t.Categoria||"") === a.name),
                              "Sottocategoria")
        .filter(g => g.name && g.name !== "Senza categoria").slice(0, 5);
      for(const f of figlie)
        corpo += riga(f.name, f.total, f.n, {sub:true, drill:"sub",
          scarto: scartoDi(t => (t.Categoria||"") === a.name
                              && (t.Sottocategoria||"") === f.name)});
    }
  } else {
    intestazioni = ["negozio", "al mese", "all'anno", "quota",
                    conf ? `su ${conf.anni[0]}` : "su un anno fa", "tx"];
    const mappa = new Map();
    for(const r of out){
      const k = r.Merchant; if(!k) continue;
      const cur = mappa.get(k) || {total:0, n:0, mesi:new Set()};
      // Stessa vista per negozio della tabella per area sopra: quanto ho
      // speso li', non quanto e' passato di li'. Stesso moltiplicatore.
      cur.total += r.Importo * quotaDi(r); cur.n++; cur.mesi.add(month(r));
      mappa.set(k, cur);
    }
    let elenco = [...mappa.entries()]
      .map(([name, v]) => ({name, ...v, mesi:v.mesi.size}));
    if(vista === "ricorrenti"){
      // Presenti in almeno sei mesi distinti: e' la lista da cui si parte per
      // disdette e cambi fornitore, non un negozio visto una volta sola.
      elenco = elenco.filter(v => v.mesi >= 6)
        .sort((a,b) => a.total/a.mesi - b.total/b.mesi);
    } else {
      elenco.sort((a,b) => a.total - b.total);
    }
    for(const v of elenco.slice(0, 22))
      corpo += riga(v.name, v.total, v.n, {
        // m e' frazionario (l'ultimo mese si ritaglia ai giorni trascorsi):
        // senza arrotondare si leggeva "14/55.806451612903224 mesi" a schermo.
        drill:"text", nota: vista === "ricorrenti"
          ? `${v.mesi}/${Math.round(m)} mesi` : "",
        scarto: scartoDi(r => r.Merchant === v.name)});
    if(!elenco.length)
      corpo = `<tr><td colspan="6" class="dove">nessuna voce nel periodo `
            + `scelto</td></tr>`;
  }

  return scelta + '<div class="scroll tab-dove"><table><thead><tr>'
    + intestazioni.map((h, i) =>
        `<th class="${i ? "num" : ""}">${esc(h)}</th>`).join("")
    + "</tr></thead><tbody>" + corpo + "</tbody></table></div>";
};

// Le leve: cosa si puo' fare per abbassare ogni natura, e in quanto tempo.
// La leva e' il motivo per cui la natura esiste; senza, restano sei parole e
// il lettore indovina cosa farne.
CARDS.leve = rows => {
  const m = mesiPeriodo(rows);
  const items = groupSum(outflow(rows), "Natura")
    .filter(g => Math.abs(g.total/m) >= 1);
  return '<div class="leve">' + items.map(g => {
    const info = NATURA[g.name] || {};
    return `<div class="leva hit" data-drill="nature" data-value="${esc(g.name)}">`
      + `<i style="background:${NATURE_COLOR[g.name]||"#8a8a8a"}"></i>`
      // Nome e leva stanno in un figlio solo: erano due, e con tre colonne
      // il quarto figlio -- la cifra -- finiva su una riga tutta sua.
      + `<div><b>${esc(g.name)}</b>`
      // Leva e tempo sono la stessa frase: su tre righe la pila di destra
      // superava di quattrocento pixel la tabella accanto.
      + `<span>${esc(info.leva || "")}`
      + (info.quando && info.quando !== "—"
         ? ` &middot; ${esc(info.quando)}` : "") + `</span></div>`
      + `<u>${spesa(g.total/m)}</u></div>`;
  }).join("") + "</div>";
};

// Il confronto d'anno, ridotto alle voci che si sono davvero mosse. La
// tabella intera non serve piu': ogni riga di "Dove vanno i soldi" porta gia'
// il suo scarto. Qui restano solo i primi cinque, che sono la notizia.
CARDS.anno = rows => {
  const out = outflow(rows);
  const conf = anniAConfronto(out);
  if(!conf) return '<p class="note">serve piu\' di un anno di dati</p>';
  const MESI = ["","gen","feb","mar","apr","mag","giu","lug","ago","set","ott",
                "nov","dic"];
  const aree = uniq(out.map(t => t.Categoria || "Senza categoria"));
  const mosse = aree.map(n => {
    const filtro = t => (t.Categoria || "Senza categoria") === n;
    const a = sum(out.filter(t => filtro(t) && conf.dentro(t, conf.anni[0])));
    const b = sum(out.filter(t => filtro(t) && conf.dentro(t, conf.anni[1])));
    return {n, d: Math.abs(b) - Math.abs(a), s: scarto(a, b)};
  }).filter(r => r.s && r.s.verso !== "pari")
    .sort((x,y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 5);
  const totale = mosse.reduce((s,r) => s + r.d, 0);
  const finestra = conf.parziale ? `gen–${MESI[conf.ultimo]}` : "anno intero";
  return `<p class="note">${esc(finestra)}, ${esc(conf.anni[1])} contro `
    + `${esc(conf.anni[0])}: <b class="${totale > 0 ? "peggio" : "meglio"}">`
    + `${spesa(totale)} in ${totale > 0 ? "piu'" : "meno"}</b>.</p>`
    + '<div class="scarti">' + mosse.map(r =>
      `<div><button class="link" data-drill="category" `
      + `data-value="${esc(r.n)}">${esc(r.n)}</button>`
      + `<em class="delta ${r.s.verso}">${esc(r.s.testo)}</em></div>`).join("")
    + "</div>";
};

// L'andamento ignora il periodo e guarda tutto lo storico: e' l'unico
// riquadro che risponde a "come siamo arrivati fin qui", e la risposta non sta
// dentro al mese scelto. Il periodo si vede come fascia.
CARDS.andamento = () => {
  const rows = filtered(false);
  const out = outflow(rows), inc = inflow(rows);
  const labels = uniq(spending(rows).map(month));
  const dentro = F.from || F.to
    ? labels.filter(l => (!F.from || l >= F.from.slice(0,7))
                      && (!F.to || l <= F.to.slice(0,7)))
    : [];
  const by = (set, pred) => labels.map(l =>
    sum(set.filter(t => month(t)===l && (!pred || pred(t)))));
  const series = [
    {name:"entrate", values:by(inc), color:"#3f9e8c"},
    {name:"uscite", values:by(out).map(v => -v), color:"#b5654a"},
    {name:"uscite ordinarie",
     values:by(out, t => t.Natura!=="Straordinarie").map(v => -v), color:"#d99442"},
  ];
  return lineChart(labels, series, dentro) + legend(series)
    + (dentro.length
       ? '<p class="note">La linea copre tutto lo storico: il periodo scelto e' + "'"
         + ' la parte in chiaro. Un mese da solo non fa un andamento.</p>'
       : "");
};

CARDS.revisione = rows => {
  const todo = rows.filter(t => (t.Confidenza ?? 1) < 1);
  if(!todo.length)
    return '<p class="note">Niente da rivedere: ogni riga ha una categoria '
      + 'di cui il motore e\' sicuro.</p>';

    + '<span>nessuna regola le ha classificate</span>'
    + '<button class="link" data-tab="revisione">Apri &rarr;</button></div>';
};

const VIEWS = {};

// Il conto fra due persone. Positivo vuol dire che la controparte deve a te.
//
//   effetto = segno x quota x |importo|      segno = +1 se hai pagato tu
//
// Un "saldo" non e' una divisione: e' il rimborso stesso, e muove il conto per
// tutto l'importo nel verso opposto a chi lo manda.
function registro(rows, partita){
  const dal = (partita && partita.dal) || "";
  const dentro = rows.filter(t => t.Quota && (!dal || (t.Data||"") >= dal))
    .sort((a,b) => (a.Data||"").localeCompare(b.Data||""));
  let saldo = (partita && partita.saldo) || 0;
  const righe = dentro.map(t => {
    const segno = t["Pagato da"] === "io" ? 1 : -1;
    // Un "saldo" non e' una quota di spesa: e' il rimborso stesso. Chi lo
    // manda non conta (se arrivano 500 sul tuo conto lei ti deve 500 in
    // meno, li mandi tu o li giri lei), quindi qui non si guarda "Pagato
    // da" ne' quotaDi() (Task 5): quotaDi risponde "quanto e' mio" per il
    // cruscotto, il registro e' sempre in euro interi -- quel che deve la
    // controparte e' quel che deve, a prescindere da come si legge il
    // cruscotto.
    const effetto = t.Quota === "saldo"
      ? -t.Importo
      : segno * (t.Quota === "tutto" ? 1 : 0.5) * Math.abs(t.Importo);
    saldo = Math.round((saldo + effetto) * 100) / 100;
    return {...t, effetto, saldo};
  });
  return {righe, saldo, dal,
          controparte: (partita && partita.controparte) || "la controparte"};
}

// Il pannello: il PRIMO riquadro visibile prende la colonna larga a sinistra
// e ne porta il peso; gli altri si impilano a destra. Le due colonne sono alte

// prima, fra due tabelle affiancate, restavano quattrocento pixel di vuoto.

// Il conto e' un insieme chiuso: un menu evita di scriverlo con una grafia

function accountSelect(current, id){

// Il pattern per una regola sul negozio di questa riga.
//
// Le parole si uniscono con .* perche' il nome del negozio salta le parole
// vuote: "Zoom Progress" non compare da nessuna parte dentro "ZOOM IN
// PROGRESS SRL". E se il nome viene da merchant.csv puo' non somigliare
// affatto alla descrizione - "NordVPN" nasce da "Paypal Nordsec" - quindi
// quando non aggancia niente si ripiega sulle parole della descrizione.
const VUOTE = new Set(["del","della","di","da","il","la","le","lo","per","con",
  "pagamento","carta","contactless","mastercard","visa","addebito","srl","spa",
  "sas","snc","the","and"]);

function patternNegozio(merchant, descrizione){
  const fuggi = w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const unisci = parole => parole.map(fuggi).join(".*");
  // La prova e' contro QUESTA descrizione, non contro tutte: un pattern che
  // aggancia qualche altra riga ma non quella su cui hai premuto produce una
  // regola che sembra buona e non fa niente. Capitava con "Iper Rossetto",
  // che su una riga scritta solo "Rossetto" non combacia.
  const regge = p => {
    try { return p && new RegExp(p, "i").test(descrizione || ""); }
    catch (e) { return false; }
  };

  const daMerchant = unisci((merchant || "").trim().split(/\s+/).filter(Boolean));
  if(regge(daMerchant)) return daMerchant;

  const parole = String(descrizione || "").split(/[^\p{L}\p{N}]+/u)
    .filter(w => w.length > 2 && !VUOTE.has(w.toLowerCase()) && !/^\d+$/.test(w));
  const daDescrizione = unisci(parole.slice(0, 2));
  return regge(daDescrizione) ? daDescrizione : daMerchant;
}

function categorySelect(current, id){
  // Raggruppato per area: con 37 voci un elenco piatto e' illeggibile, e i
  // due livelli si vedono a colpo d'occhio.
  const aree = uniq(S.categories.map(c => c.categoria));
  const opts = aree.map(a => {
    const dentro = S.categories.filter(c => c.categoria === a);
    const voci = dentro.map(c =>
      `<option value="${esc(c.nome)}" ${c.nome===current?"selected":""}>`
      + `${esc(c.sottocategoria || c.categoria)}</option>`).join("");
    return `<optgroup label="${esc(a)}">${voci}</optgroup>`;
  }).join("");
  return `<select data-setcat="${esc(id)}"><option value=""></option>${opts}</select>`;
}

VIEWS.partita = rows => {

    + 'stesso: non e\' una spesa, e muove il conto per intero. Il periodo qui '
    + 'sopra non conta: il saldo e\' cumulativo da sempre, e filtrarlo per '

VIEWS.regole = () => {
