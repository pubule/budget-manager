<meta name="theme-color" content="#b5654a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilancio">
<style>
:root{--bg:#fbfaf8;--card:#fff;--ink:#1c1a17;--dim:#6b6560;--line:#e6e1da;
--accent:#3f6f5f;--warn:#b5654a;--soft:#f2efe9}
@media (prefers-color-scheme:dark){:root{
--bg:#16161a;--card:#1e1e24;--ink:#eceaf0;--dim:#9c96a3;--line:#31313a;
--accent:#6fae99;--warn:#d98a6a;--soft:#26262e}}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:10px;height:10px;background:transparent}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.55 "Iowan Old Style",Georgia,serif}
/* Tre zone che non si mescolano mai: la SPALLA dice dove sono e cosa posso
   fare ai dati, la BARRA quale periodo sto guardando e cosa ne esce, il resto
   sono le prove. Prima navigazione, filtri e azioni stavano tutti nella stessa
   rotaia, e "cambia scheda" somigliava a "ricarica tutto". */
.telaio{display:grid;grid-template-columns:214px minmax(0,1fr);
align-items:start}
.spalla{position:sticky;top:0;height:100vh;overflow-y:auto;
background:var(--card);border-right:1px solid var(--line);
padding:16px 12px 12px;display:flex;flex-direction:column;gap:4px}
.spalla header{display:block;margin:0 0 14px;padding:0 8px}
.spalla .grow{flex:1;min-height:14px}
/* Le sezioni: una colonna, non una fila di linguette. */
#tablist{display:flex;flex-direction:column;gap:1px}
#tablist button{width:100%;text-align:left;border:1px solid transparent;
background:none;border-radius:7px;padding:7px 10px;color:var(--dim);
display:flex;align-items:center;gap:8px}
#tablist button:hover{background:var(--soft);color:var(--ink)}
#tablist button.on{background:var(--soft);color:var(--ink);font-weight:600}
/* Le iconcine sono per la tab bar da smartphone (vedi sotto i 640px): qui
   in spalla il bottone ha gia' solo testo, e un <svg> senza width/height
   si disegna alla sua dimensione intrinseca (grande) invece che a icona. */
#tablist button svg{display:none}
#tablist .conta{margin-left:auto;font:600 11px ui-monospace,monospace;
background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);
border-radius:20px;padding:1px 7px}
/* "Altro" (le 3 schede di coda per la tab bar da smartphone): invisibile
   finche' il breakpoint sotto i 640px non lo riaccende. */
.tab-more{display:none}
.filter-chip,.sheet-close,.bl-backdrop,.bl-tx-wrap{display:none}
/* La checkbox che apre il pannello filtri da smartphone: sempre invisibile,
   sempre funzionante (un <label for> la aziona anche a display:none). */
.sheet-toggle{display:none}
/* Le azioni sui dati, staccate dalla navigazione da un filetto e da un
   titolo: navigare non e' ricaricare. */
.acts{display:flex;flex-direction:column;gap:5px;
border-top:1px solid var(--line);padding-top:12px}
.acts h3{margin:0 0 3px;font:600 10px/1 ui-sans-serif,system-ui,sans-serif;
letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.acts button{width:100%;text-align:left}
.acts .status{display:block;line-height:1.5;margin-top:10px}
.lato{min-width:0;padding:12px 14px 60px}
h1{font-size:21px;margin:0;letter-spacing:-.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);
margin:0 0 12px;font-family:ui-sans-serif,system-ui,sans-serif}
.ui{font-family:ui-sans-serif,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.grow{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
display:inline-block;margin-right:6px}
.dot.busy{background:#d99442;animation:pulse 1s infinite}
.dot.err{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
/* Il fade al cambio scheda (vedi d.tab in gestisciClick): stessa curva del
   bottom sheet dei filtri, .26s cubic-bezier(.2,.8,.2,1), cosi' i due
   movimenti dell'app si somigliano invece di avere ognuno la sua firma. */
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#view.view-enter{animation:viewIn .22s cubic-bezier(.2,.8,.2,1)}

/* L'overlay bloccante di creare/eliminare una transazione: sopra a tutto
   (anche sopra la tab bar fissa da smartphone, z-index 40-45), niente
   sotto riceve click finche' non sparisce. */
#overlay-azione{position:fixed;inset:0;z-index:200;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(1.5px)}
/* Un selettore per id (#overlay-azione) e' PIU' specifico di una classe
   (.hide): senza questa riga, .hide{display:none} perdeva sempre contro il
   display:flex qui sopra, e l'overlay restava visibile fin dal
   caricamento della pagina, comparisse o no la classe "hide" -- esattamente
   il bug segnalato ("vedo lo spinner e non sparisce mai"). #id.hide (id +
   classe) e' abbastanza specifico da vincere lui. */
#overlay-azione.hide{display:none}
#overlay-azione span{font:13px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
.spinner{width:32px;height:32px;border-radius:50%;
  border:3px solid color-mix(in srgb,var(--ink) 14%,transparent);
  border-top-color:var(--accent);animation:girare .7s linear infinite}
@keyframes girare{to{transform:rotate(360deg)}}
/* Barra indeterminata: leggere uno scontrino e' UNA chiamata bloccante a
   Ollama (stream:false), non arriva mai un "sei al 40%" vero da mostrare.
   Onesto mostrare che si muove, non fingere una percentuale che non
   abbiamo. */
.overlay-barra{width:220px;max-width:70vw;height:4px;border-radius:3px;
  background:var(--soft);overflow:hidden;position:relative}
.overlay-barra i{position:absolute;top:0;bottom:0;width:40%;
  border-radius:3px;background:var(--accent);animation:barraIndet 1.3s ease-in-out infinite}
@keyframes barraIndet{0%{left:-40%}100%{left:100%}}
.status{font:12px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
button,select,input{font:13px ui-sans-serif,system-ui,sans-serif;color:var(--ink);
background:var(--card);border:1px solid var(--line);border-radius:7px;
padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--dim)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.link{border:1px solid transparent;background:var(--soft);
color:var(--dim);padding:3px 9px;border-radius:6px;font-size:12px}
button.link:hover{color:var(--ink);border-color:var(--line)}
/* Un <label for=...> che apre un <input type=file> nascosto (vedi
   "scansiona scontrino" in Transazioni): niente JS per aprire la
   fotocamera, ma <label> non e' nel selettore button,select,input sopra --
   qui la stessa faccia di un bottone normale. */
label.btn-riga{display:inline-flex;align-items:center;gap:6px;
font:13px ui-sans-serif,system-ui,sans-serif;color:var(--ink);
background:var(--card);border:1px solid var(--line);border-radius:7px;
padding:6px 10px;cursor:pointer}
label.btn-riga:hover{border-color:var(--dim)}
/* .bl-field: nato per le card da smartphone (etichetta sopra, campo
   sotto), promosso qui fuori dal breakpoint mobile perche' la revisione
   dello scontrino (vedi #scontrino-revisione) lo riusa anche su desktop --
   stessa faccia dovunque, non una copia per ogni larghezza. */
.bl-field{display:flex;flex-direction:column;gap:4px}
.bl-field label{font:10.5px ui-sans-serif,sans-serif;color:var(--dim);
text-transform:uppercase;letter-spacing:.06em}
.bl-field input,.bl-field select{width:100%;min-height:40px}
/* Valore di sola lettura (le statistiche di "dove vanno i soldi" da
   smartphone: niente da modificare li', solo da leggere). */
.bl-field .val{border:1px solid var(--line);border-radius:8px;
padding:9px 10px;font:14px ui-sans-serif,sans-serif;background:var(--bg)}
.bl-field .val.delta{border-color:transparent;background:none;padding:0 2px}
nav{display:flex;gap:4px;align-items:flex-end;
border-bottom:1px solid var(--line);margin:0 0 16px}
#tablist{display:flex;gap:4px}
nav #tablist button{border:none;background:none;border-radius:0;padding:9px 14px;
border-bottom:2px solid transparent;color:var(--dim)}
nav #tablist button.on{color:var(--ink);border-bottom-color:var(--accent);
font-weight:600}
nav>button{margin-bottom:7px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:10px 12px;margin-bottom:14px}
.bar label{font:11px ui-sans-serif,system-ui,sans-serif;color:var(--dim);
text-transform:uppercase;letter-spacing:.08em}
/* La barra: a sinistra il periodo e i filtri, a destra i numeri che ne
   discendono. Stanno insieme perche' sono la stessa frase: "in questo
   periodo, questi numeri". */
/* Il riquadro della scelta: il periodo sopra, i filtri di dettaglio sotto. */
.barra{background:var(--card);border:1px solid var(--line);border-radius:10px;
margin-bottom:10px}
#filters{border-top:1px solid var(--line) !important}
/* Il riquadro del recap: gli stessi numeri di prima, in un riquadro suo.
   Erano nella stessa cornice dei filtri e sembravano un filtro anche loro. */
.kpibar{display:flex;align-items:stretch;flex-wrap:wrap;
background:var(--card);border:1px solid var(--line);border-radius:10px;
margin-bottom:12px}
.barra .bar{border:none;background:none;margin:0;padding:8px 12px;
row-gap:6px}
/* I campi si stringono: a larghezza piena i filtri occupavano tre righe e la
   barra diventava un muro alto quanto un riquadro. */
.barra .bar select{max-width:132px}
.barra .bar input[type=date]{max-width:132px}
.barra .bar input[type=search]{max-width:180px}
.barra .bar label{opacity:.75}
.kpibar{display:flex;align-items:stretch}
.kpibar .kpi{border:none;border-left:1px solid var(--line);border-radius:0;
padding:11px 20px;flex:1 1 168px;text-align:right;background:none}
.kpibar .kpi:first-child{border-left:none}
.kpibar .kpi b{font-size:21px;font-variant-numeric:tabular-nums}
.kpibar .kpi span{display:block;margin-bottom:2px}


/* La tabella si allunga fino a raggiungere la pila accanto -- le due colonne
   sono alte uguali per costruzione -- e scorre dentro al suo riquadro solo se
   supererebbe lo schermo. E' il motivo per cui questa disposizione e' stata
   scelta: prima la dashboard era alta due schermate e mezzo. */
.pannello>.card{max-height:calc(100vh - 40px)}
/* Il pannello: a sinistra il riquadro che porta il peso, a destra la pila
   degli strumenti. Le due colonne sono alte uguali PER COSTRUZIONE, e' la
   griglia a legarle: prima si sperava che i contenuti si somigliassero, e
   fra due tabelle affiancate restavano 400px di vuoto. */
.pannello{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(316px,1fr);
gap:14px;align-items:stretch}
.pannello>.card{margin:0;display:flex;flex-direction:column;min-height:0;min-width:0}
.pannello .pila{display:flex;flex-direction:column;gap:14px;min-width:0}
.pannello .pila>.card{margin:0;padding:11px 15px}
.pannello .pila .head{margin-bottom:8px}
.pannello .pila .note{margin:6px 0 0;font-size:12px}
@media (max-width:1150px){.pannello{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:12px ui-sans-serif,system-ui,sans-serif;background:var(--soft);
border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:18px 20px;margin-bottom:14px}
/* I riquadri della dashboard su griglia: due grafici affiancati e tre tabelle
   in fila invece di una colonna sola alta come un palazzo. Ogni riquadro
   dichiara quante colonne occupa in SPAN, dentro app.html. */
.grid{display:grid;grid-template-columns:repeat(12, minmax(0, 1fr));
gap:14px;align-items:start}
.grid>.card{margin-bottom:0;grid-column:span 12}
.grid>.sp5{grid-column:span 5}
.grid>.sp6{grid-column:span 6}
.grid>.sp7{grid-column:span 7}
/* Stretto: prima si sfilano i due grafici, che hanno bisogno di larghezza,
   poi tutto torna in colonna. Le soglie sono in pixel CSS, che su Windows al
   125% sono gia' un quinto in meno di quelli veri: una soglia a 1500 sfilava
   i grafici su uno schermo da 1720, cioe' proprio dove serviva affiancarli. */
@media (max-width:1250px){.grid>.sp5,.grid>.sp7{grid-column:span 12}}
@media (max-width:1050px){.grid>.sp5,.grid>.sp6,.grid>.sp7{grid-column:span 12}}
.card>.head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;
margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:15px 17px}
.kpi b{display:block;font-size:23px;letter-spacing:-.02em;font-weight:600;
font-family:ui-sans-serif,system-ui,sans-serif}
.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;
color:var(--dim);font-family:ui-sans-serif,system-ui,sans-serif}
.kpi.good b{color:var(--accent)}.kpi.bad b{color:var(--warn)}
/* Il confronto col periodo prima: senza un metro un numero non e' ne'
   buono ne' cattivo, e non ci si decide niente. */
.delta{display:block;margin-top:5px;font-style:normal;font-size:11px;
font-family:ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.delta.meglio{color:var(--accent)}
.delta.peggio{color:var(--warn)}
.importo-spesa{color:var(--warn)}
.importo-entrata{color:var(--accent)}
.delta.pari{color:var(--dim)}
/* Le leve: cosa si puo' fare per abbassare ogni natura, e in quanto tempo.
   La leva e' il motivo per cui la natura esiste. */
.leve{display:flex;flex-direction:column}
.leva{display:grid;grid-template-columns:11px 1fr auto;gap:10px;
align-items:center;padding:4px 0;border-top:1px solid var(--line);
font:12px/1.35 ui-sans-serif,system-ui,sans-serif;cursor:default}
.leva:first-child{border-top:none}
.leva.hit{cursor:pointer}
.leva.hit:hover{background:var(--soft)}
.leva i{width:11px;height:11px;border-radius:2px}
.leva b{font-weight:600;display:block}
.leva span{color:var(--dim);display:block;font-size:11px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leva>div{min-width:0}
.leva u{text-decoration:none;font:600 14px ui-monospace,monospace;
font-variant-numeric:tabular-nums;white-space:nowrap}

/* Le tre viste della tabella unica: lo stesso denaro, guardato da un altro
   lato. Non sono tre riquadri, e' un riquadro con tre lati. */
.viste{display:inline-flex;gap:2px;background:var(--soft);border-radius:8px;
padding:2px;margin-bottom:10px}
.viste button{border:none;background:none;border-radius:6px;padding:4px 11px;
color:var(--dim);font-size:12px}
.viste button.on{background:var(--card);color:var(--ink);font-weight:600;
box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* La barra multi-selezione: appare solo con qualcosa di spuntato, sopra la
   tabella che l'ha generata. */
.bulk{display:flex;align-items:center;gap:8px;background:var(--soft);
border-radius:8px;padding:6px 10px;margin-bottom:10px;flex-wrap:wrap}
.bulk select{font:12px ui-sans-serif,system-ui,sans-serif}

/* La tabella di "Dove vanno i soldi". La quota e' un filetto sotto al nome:
   a piena altezza, dietro al testo, sembrava una riga selezionata invece di
   una misura. */
.tab-dove{flex:1;min-height:0;overflow:auto}
.tab-dove td{white-space:nowrap;font-variant-numeric:tabular-nums}
.tab-dove td:first-child{white-space:normal}
.tab-dove th.num,.tab-dove td:not(:first-child){text-align:right}
.tab-dove tr.sub td{font-size:12px;color:var(--dim)}
.tab-dove tr.sub td:first-child{padding-left:20px}
.tab-dove .q{position:relative}
.tab-dove .q i{position:absolute;left:0;bottom:3px;height:2px;border-radius:2px;
background:color-mix(in srgb,var(--accent) 55%,transparent);width:var(--w)}
.dove{color:var(--dim);font-size:11.5px;
font-family:ui-sans-serif,system-ui,sans-serif}

/* Il confronto d'anno ridotto alle voci che si sono mosse. */
.scarti{display:flex;flex-direction:column}
.scarti div{display:flex;justify-content:space-between;align-items:baseline;
gap:12px;padding:5px 0;border-top:1px solid var(--line);
font:13px ui-sans-serif,system-ui,sans-serif}
.scarti div:first-child{border-top:none}
.scarti em{font-style:normal;font-variant-numeric:tabular-nums}

/* L'avviso: una riga, non un riquadro alto centododici pixel per una frase. */
.avviso{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
font:13px ui-sans-serif,system-ui,sans-serif}
.avviso b{color:var(--warn)}
.avviso span{color:var(--dim);font-size:12px;flex:1}
.verdetto-partita{font-size:26px;margin:0 0 14px;letter-spacing:-.01em}
.verdetto-partita b{font-variant-numeric:tabular-nums}
text.lbl{font:12px ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
text.val{font:11px ui-monospace,monospace;fill:var(--dim)}
text.axis{font:10px ui-sans-serif,system-ui,sans-serif;fill:var(--dim)}
line.grid{stroke:var(--line);stroke-width:1}
rect.fascia{fill:#ffffff0f}
/* La riga verticale sotto al mouse: dice che il tooltip legge tutta la
   colonna del mese, non il singolo punto piu' vicino. */
line.guida{stroke:var(--dim);stroke-width:1;stroke-dasharray:4 4;opacity:.75}
svg .hit{cursor:pointer}
svg .hit:hover rect{opacity:.75}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(84px,168px) 1fr auto;
gap:10px;align-items:center;
font:12px ui-sans-serif,system-ui,sans-serif}
.bar-row.hit{cursor:pointer}
.bar-row.hit:hover i{opacity:.72}
.bar-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{display:block;height:16px;min-width:0}
.bar-track i{display:block;height:100%;border-radius:3px;min-width:2px}
.bar-val{font:11px ui-monospace,monospace;color:var(--dim);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;
font:12px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;
margin-right:5px;vertical-align:-1px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:13px ui-sans-serif,system-ui,sans-serif}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
color:var(--dim);border-bottom:1px solid var(--line);padding:7px 12px 7px 0;
font-weight:600;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
.note{font-size:13px;color:var(--dim);border-left:2px solid var(--line);
padding-left:14px;margin:12px 0}
.err{color:var(--warn);font:13px ui-sans-serif,system-ui,sans-serif;
border-left:2px solid var(--warn);padding-left:14px;margin:12px 0;
white-space:pre-wrap}
.compose{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:6px}
.compose div{display:flex;align-items:center;gap:6px;font:13px ui-sans-serif,
system-ui,sans-serif}
.compose .grow{flex:1}
.hide{display:none}
/* Il valore sotto al mouse. Segue il puntatore e non lo intercetta mai,
   altrimenti si rincorrerebbero. */
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--card);
border:1px solid var(--line);border-radius:8px;padding:8px 11px;
font:12px/1.6 ui-sans-serif,system-ui,sans-serif;color:var(--ink);
box-shadow:0 6px 20px rgba(0,0,0,.22);white-space:pre-line}
/* I riquadri di dialogo sono nostri, non del browser: quelli di sistema
   ignorano il tema, non si possono spiegare meglio di una riga di testo, e
   bloccano la pagina in un modo che nemmeno si puo' provare. <dialog> nativo
   perche' porta gia' fuoco, Esc e sfondo senza una libreria. */
/* #scontrino-revisione condivide la faccia di #modale (stesso riquadro,
   stesso sfondo scuro dietro): dialog A PARTE (vedi dove e' dichiarata nel
   markup) ma non serve un secondo disegno da zero. */
#modale,#scontrino-revisione{border:1px solid var(--line);border-radius:12px;
background:var(--card);color:var(--ink);padding:0;max-width:520px;
width:calc(100% - 40px);box-shadow:0 18px 50px rgba(0,0,0,.28)}
#modale::backdrop,#scontrino-revisione::backdrop{background:rgba(0,0,0,.45)}
#modale form,#scontrino-revisione form{padding:22px 24px 18px;margin:0}
#modale p,#scontrino-revisione p{margin:0 0 16px;white-space:pre-wrap;line-height:1.5;
font:14px/1.55 ui-sans-serif,system-ui,sans-serif}
#modale input{width:100%;margin-bottom:16px}
#scontrino-revisione .bl-field{margin-bottom:14px}
/* "Annulla" e "OK" ciascuno largo quanto il proprio testo, non allineato
   all'altro: "Annulla" (7 lettere) e' sempre piu' largo di "OK" (2), un
   paio scoppiato invece che i due bottoni gemelli di un alert. flex:1 li
   fa dividere la riga in due meta' uguali, come un foglio di conferma
   iOS -- tocco piu' grande anche da smartphone, non solo piu' ordinato. */
.modale-azioni{display:flex;gap:8px}
.modale-azioni button{flex:1}
.mini{font:11px ui-monospace,monospace;color:var(--dim)}
.wide{min-width:260px}
.quick{display:flex;gap:5px;flex-wrap:wrap;width:100%;align-items:center;
padding-bottom:9px;margin-bottom:3px;border-bottom:1px solid var(--line)}
.rail .quick{padding-bottom:0;margin-bottom:0;border-bottom:none}
.rail .quick .anchor{margin-left:0;width:100%}
/* I pulsanti del metro sono fratelli di quelli del periodo, ma piu'
   sottovoce: scelgono come leggere i dati, non quali dati. */
.quick.confronto{border-bottom:none;padding-bottom:0;margin-bottom:0}
.quick.confronto button{font-size:11px;padding:3px 9px}
#f-confronto-eti{margin-top:6px}
.quick button{padding:4px 11px;border-radius:20px;font-size:12px}
.quick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.quick .anchor{font-size:11px;color:var(--dim);margin-left:auto}
input[data-rule-pattern]{min-width:340px;font-family:ui-monospace,monospace;font-size:12px}
/* Il log vive in un pannello a destra: la pagina si stringe invece di
   finirgli sotto, cosi' si legge la dashboard mentre il modello lavora. */
#log{position:fixed;top:0;right:0;bottom:0;width:440px;background:var(--card);
border-left:1px solid var(--line);display:none;flex-direction:column;z-index:20}
body.log-on #log{display:flex}
body.log-on .wrap{margin-right:440px}
#log .top{display:flex;align-items:center;gap:8px;padding:10px 12px;
border-bottom:1px solid var(--line);font:12px ui-sans-serif,system-ui,sans-serif}
#log .top b{font-size:11px;text-transform:uppercase;letter-spacing:.11em;
color:var(--dim);font-weight:600}
#log pre{margin:0;padding:10px 12px;overflow:auto;flex:1;white-space:pre-wrap;
word-break:break-word;font:11px/1.5 ui-monospace,SFMono-Regular,monospace;
color:var(--dim)}
#log .llm{color:var(--ink)}
#log .ok{color:var(--accent)}
#log .ko{color:var(--warn)}
#log .think{opacity:.65;font-style:italic}
@media (max-width:1100px){
  #log{width:100%;border-left:none}
  body.log-on .wrap{margin-right:0;display:none}
  /* Sotto questa larghezza la spalla non ci sta di fianco: torna una fascia
     in cima, con sezioni e azioni in orizzontale. Se restasse alta 100vh
     mangerebbe tutto lo schermo. */
  .telaio{display:block}
  .spalla{position:static;height:auto;overflow:visible;flex-direction:row;
    flex-wrap:wrap;align-items:center;gap:10px;
    border-right:none;border-bottom:1px solid var(--line)}
  .spalla header{margin:0}
  .spalla .grow{display:none}
  #tablist{flex-direction:row;flex-wrap:wrap}
  #tablist button{width:auto}
  .acts{flex-direction:row;flex-wrap:wrap;border-top:none;padding-top:0;
    align-items:center}
  .acts h3{display:none}
  .acts button{width:auto}
  .acts .status{margin-top:0}
  .lato{padding:12px 14px 60px}
}

/* ==========================================================================
   SMARTPHONE (sotto i 640px). Tre pezzi restylati (KPI, "dove vanno i
   soldi", barra filtri: stessa funzione JS di sempre, cambia solo il CSS) e
   tre pezzi con markup nuovo perche' la forma desktop non puo' esprimerli
   (tab bar in basso con "Altro", card di transazione al posto della riga di
   tabella, bottom sheet dei filtri). Il dettaglio del perche' e' nel piano.
   ========================================================================== */
@media (max-width:640px){
  :root{--tabbar-h:64px}

  /* --- tocco: bottoni e campi piu' grandi, senza cambiare quelli larghi --- */
  button,select,input{min-height:38px}
  .acts button,.bar button{min-height:34px}

  /* --- "+ transazione"/"scansiona scontrino" sotto al titolo, larghi
     quanto la riga: sopra i 640px restano accanto al conteggio, com'era.
     :has() prende di mira solo l'intestazione di Transazioni (l'unica con
     questi bottoni dentro) -- le altre schede con un .head non cambiano.
     .btn-riga e' la classe che condividono entrambi. --- */
  .card>.head:has(.btn-riga){flex-wrap:wrap}
  .card>.head .btn-riga{flex:1 1 100%;margin-top:2px;justify-content:center}

  /* --- KPI: 2x2 invece che una fila che va a capo da sola --- */
  .kpibar{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
  .kpibar .kpi{border-left:none;border-top:1px solid var(--line);text-align:left}
  .kpibar .kpi:nth-child(-n+2){border-top:none}

  /* --- "dove vanno i soldi": stessa tabella, via la colonna secondaria,
     righe piu' alte perche' molte hanno data-drill (si toccano). Il filetto
     sotto al nome (.tab-dove .q i) esiste gia' e resta cosi' com'e'. --- */
  .tab-dove th:nth-child(3),.tab-dove td:nth-child(3){display:none}
  .tab-dove td,.tab-dove th{padding-top:9px;padding-bottom:9px}

  /* --- "dove vanno i soldi", vista area: la lista di card lascia il posto
     a una torta a due livelli (categorie, poi le sottocategorie di quella
     scelta). Vive dentro lo stesso .bl-tx-wrap gia' nascosto sopra i 640px,
     niente regola di visibilita' in piu' da scrivere qui. --- */
  .dove-pie-svg{display:block;width:100%;max-width:240px;height:auto;
    margin:4px auto 14px}
  .dove-pie-head{display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap;
    justify-content:center;margin-bottom:10px;text-align:center}
  .dove-pie-head b{font-weight:600}
  .dove-pie-head .dove-pie-tot{color:var(--dim);font-size:13px}
  .dove-pie-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;
    text-align:left}
  /* Niente ellissi: un nome lungo va a capo dentro la sua colonna invece di
     tagliarsi. La riga si allunga (altezza automatica di riga della griglia,
     non un problema), le due colonne restano allineate uguali. */
  .dove-pie-legend span{white-space:normal;line-height:1.35}
  /* Con un numero dispari di voci l'ultima resta sola nella sua riga: senza
     questo le tocca comunque solo mezza colonna e tronca prima del dovuto,
     con una colonna vuota accanto che non serve a nessuno. nth-child(odd)
     su :last-child e' vero solo quando e' sola (in una griglia a 2 colonne,
     una posizione dispari apre sempre una riga nuova). */
  .dove-pie-legend span:last-child:nth-child(odd){grid-column:1/-1}
  .dove-pie-legend span.hit,.dove-pie-svg .hit{cursor:pointer}

  /* --- tab bar in basso: STESSI 7 bottoni di TABS, il loop in render()
     non cambia. Qui si scelgono solo i 4 primari + "Altro". ---

     position:fixed;bottom:0 (il primo tentativo) si sfasa da vera barra
     degli indirizzi che Safari/Chrome su telefono apre e chiude da soli:
     "fixed" e' ancorato al viewport LAYOUT, non a quello VISIBILE, e la
     tab bar finiva a lasciar intravedere righe della tabella sotto di se'.
     Qui invece .telaio e' un'unica colonna alta quanto lo schermo VERO
     (100dvh, il "d" segue la barra che si apre/chiude); .lato e' l'UNICA
     zona che scorre al suo interno; #tablist e' un fratello normale in
     fondo alla colonna, non piu' fixed -- e per essere fratello di .lato
     invece che figlio della spalla, lo sposta li' posizionaTablist() in
     JS (vedi sopra: CSS da solo non puo' spostare un elemento fra due
     genitori). */
  /* align-items:stretch: la regola base (.telaio{display:grid;...
     align-items:start}, riga 26) resta scritta anche qui sotto -- cambiare
     "display" non azzera le altre proprieta' gia' in cascata. Senza
     l'override esplicito, .spalla/.lato/#tablist restavano larghi quanto
     il loro contenuto invece che quanto lo schermo: e' il buco nero
     nell'angolo in basso a destra della tab bar. */
  .telaio{height:100dvh;display:flex;flex-direction:column;
    align-items:stretch;overflow:hidden}
  .spalla{flex:none}
  .lato{flex:1;min-height:0;overflow-y:auto;padding-bottom:16px}

  #tablist{flex:none;order:3;
    display:grid;grid-template-columns:repeat(5,1fr);gap:0;align-items:start;
    background:var(--card);border-top:1px solid var(--line);
    /* L'home indicator vive sotto l'ultimo pixel utile: senza
       padding-bottom qui, i bottoni finirebbero mezzi nascosti sotto di
       lui. L'altezza dei bottoni resta fissa (var(--tabbar-h)); lo spazio
       in piu' e' tutto padding, cosi' le icone non si schiacciano su. */
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0));
    padding:0 0 env(safe-area-inset-bottom,0)}
  #tablist button{width:auto;flex-direction:column;justify-content:center;
    align-items:center;gap:2px;height:var(--tabbar-h);border-radius:0;
    padding:6px 2px;font-size:10px;text-align:center}
  #tablist button svg{display:block;width:20px;height:20px}
  #tablist button .conta{position:absolute;transform:translate(11px,-13px);
    margin-left:0}
  /* Le 3 di coda vivono solo dentro "Altro": fuori si nascondono per id,
     senza toccare il loop che le genera. */
  #tablist>button[data-tab="categorie"],
  #tablist>button[data-tab="regole"],
  #tablist>button[data-tab="componi"]{display:none}
  .tab-more{display:flex;flex-direction:column;align-items:center;
    justify-content:center;position:relative;height:var(--tabbar-h)}
  .tab-more summary{list-style:none;display:flex;flex-direction:column;
    align-items:center;gap:2px;font-size:10px;color:var(--dim);
    cursor:pointer;padding:6px 2px}
  .tab-more summary::-webkit-details-marker{display:none}
  .tab-more summary svg{width:20px;height:20px}
  .tab-more[open] summary{color:var(--ink)}
  .tab-more-list{position:fixed;right:8px;
    bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0) + 8px);
    display:flex;flex-direction:column;gap:1px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:5px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.28);min-width:168px}
  .tab-more-list button{width:100%;text-align:left;min-height:40px;
    border:none;border-radius:8px}

  /* --- card di transazione al posto della riga di tabella --- */
  .desktop-rows{display:none}
  .bl-tx-wrap{display:block !important}
  .bl-txlist{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
  .bl-tx{background:var(--card);border:1px solid var(--line);
    border-radius:12px;overflow:hidden}
  .bl-tx[open]{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .bl-tx summary{list-style:none;cursor:pointer;padding:11px 12px;
    display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center}
  .bl-tx summary::-webkit-details-marker{display:none}
  .bl-tx .chk-mark{width:24px;height:24px;border-radius:7px;
    border:1.5px solid var(--line);display:flex;align-items:center;
    justify-content:center;flex:none;transition:background-color .15s,
    border-color .15s;position:relative}
  /* Il checkbox e' lo stesso di selectBox(t.ID) usato dalla tabella
     desktop (stesso data-select, stesso stato SELECTED): qui e' solo
     ridisegnato sopra, non duplicato come logica. */
  .bl-tx .chk-mark input[data-select]{position:absolute;inset:0;opacity:0;
    margin:0;cursor:pointer}
  .bl-tx .chk-mark:has(input[data-select]:checked){background:var(--accent);
    border-color:var(--accent)}
  .bl-tx .chk-mark:has(input[data-select]:checked) svg{opacity:1}
  .chk-mark svg{opacity:0;width:13px;height:13px;color:#fff;pointer-events:none}
  .bl-tx .who{min-width:0}
  .bl-tx .who .d{font:11px ui-monospace,monospace;color:var(--dim)}
  .bl-tx .who .m{font:600 14px "Iowan Old Style",Georgia,serif;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bl-tx .amt{font:15px ui-monospace,monospace;font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .tx-chip{display:inline-flex;align-items:center;gap:5px;margin-top:3px;
    font:11px ui-sans-serif,sans-serif;color:var(--dim)}
  .tx-chip i{width:7px;height:7px;border-radius:2px;flex:none}
  .bl-tx .body{padding:2px 12px 14px;display:flex;flex-direction:column;
    gap:10px;border-top:1px solid var(--line)}
  /* Il fade all'apertura: .bl-dove (le righe di "dove vanno i soldi") usa
     la stessa classe .bl-tx delle card di transazione, quindi questa
     regola sola copre entrambe -- niente da scrivere due volte.
     .bl-tx[open] .body{animation:...} SEMBRA la scelta ovvia (nessun JS),
     ma verificato dal vivo: Chrome non fa partire l'animazione solo dal
     cambio di attributo su un <details> nativo (getAnimations() torna
     vuoto). La classe .corpo-apre sotto la aggancia per davvero, dal
     listener "toggle" (vedi piu' in basso nello script) con lo stesso
     trucco remove+reflow+add gia' usato per #view.view-enter. */
  @keyframes corpoApre{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .bl-tx .body.corpo-apre{animation:corpoApre .18s ease}
  /* Data+Importo, Pagato da+Quota: valori corti che affiancati si leggono
     come una coppia, invece di due righe piene su otto scorrimenti. */
  .bl-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* auto-fit invece di 3 colonne fisse: quando "elimina" non c'e' (le righe
     di banca), i 2 bottoni restanti si allargano a riempire lo spazio vero,
     non lasciano una casella vuota che sembra un bottone mancante. */
  .bl-rowbtns{display:grid;
    grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin-top:2px}
  .bl-rowbtns button{min-height:40px}
  .bl-rowbtns .danger{color:var(--warn);
    border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}

  /* --- "dove vanno i soldi": card invece di riga a 6 colonne. Riusa
     .bl-tx/.bl-field/.bl-rowbtns di sopra; qui solo le differenze: niente
     checkbox (due colonne, non tre) e il rientro delle sottocategorie. --- */
  .bl-dove summary{grid-template-columns:1fr auto}
  .bl-dove .who .q{position:relative;display:block;height:2px;
    margin-top:7px;border-radius:2px;background:var(--soft)}
  .bl-dove .who .q i{position:absolute;left:0;top:0;bottom:auto;height:2px}
  .bl-dove.sub{margin-left:18px}
  .bl-dove.sub .who .m{font-size:13px;font-weight:400;color:var(--dim)}

  /* --- barra multi-selezione: STESSO .bulk di sempre (bulkBar(), un solo
     elemento, gli stessi id #bulk-cat/#bulk-conto/...), solo riposizionato.
     Comparire/sparire e' gia' gestito da render() (SELECTED.size in
     bulkBar()): duplicarla avrebbe voluto dire due elementi con lo stesso
     id, e il click sull'uno o sull'altro a seconda di quale il DOM trova
     per primo -- esattamente il tipo di problema da evitare. --- */
  .bulk{position:sticky;
    bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0) + 10px);
    background:var(--ink);border-radius:12px;padding:10px 12px;z-index:38}
  .bulk .mini,.bulk select,.bulk input,.bulk button{color:var(--bg);
    min-height:34px}
  .bulk select,.bulk input{background:color-mix(in srgb,var(--bg) 12%,transparent);
    border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
  .bulk button.link{background:var(--accent);color:#fff;border:none}

  /* --- filtri: chip in cima + STESSA .barra spostata a bottom sheet --- */
  .filter-chip{display:flex;align-items:center;gap:8px;width:100%;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin-bottom:12px;font:600 13px ui-sans-serif,sans-serif;
    color:var(--ink);cursor:pointer}
  .filter-chip svg{flex:none;color:var(--dim)}
  .filter-chip .chev{margin-left:auto;color:var(--dim)}
  .filter-chip.hide{display:none}
  .bl-backdrop{display:block;position:fixed;inset:0;background:rgba(10,12,10,.42);
    opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:44}
  .sheet-toggle:checked ~ .bl-backdrop{opacity:1;pointer-events:auto}
  .sheet-close{display:flex;align-items:center;justify-content:space-between;
    font:600 13px ui-sans-serif,sans-serif;margin-bottom:10px;cursor:pointer}
  .sheet-close span{font-weight:400;color:var(--dim)}
  .barra#barra{position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--card);border-radius:18px 18px 0 0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));
    /* 100% dell'altezza propria basterebbe in teoria, ma lascia zero
       margine: bastava un arrotondamento di un paio di pixel a far
       spuntare la punta del pannello anche da chiuso. calc() aggiunge
       un cuscinetto vero, non percentuale. */
    transform:translateY(calc(100% + 40px));
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -18px 30px -20px rgba(0,0,0,.35);max-height:80vh;
    overflow-y:auto;margin:0;border:none}
  .sheet-toggle:checked ~ .barra#barra{transform:translateY(0)}
  .barra#barra .bar{padding:0 0 12px}
  .barra#barra #filters{border-top:1px solid var(--line) !important;
    padding-top:12px}
  .barra#barra .bar select,.barra#barra .bar input[type=date],
  .barra#barra .bar input[type=search]{max-width:none;width:100%}
  .barra#barra .bar label{display:block;margin-top:8px}
}

/* --------------------------------------------------------------------------
   Rifinitura: le cose che si notano solo quando mancano.
   -------------------------------------------------------------------------- */

/* CIFRE ALLINEATE. In un'app di soldi i numeri cambiano di continuo, e con un
   font proporzionale le colonne ballano a ogni aggiornamento. Le cifre
   tabulari hanno tutte la stessa larghezza, quindi le colonne stanno ferme. */
.kpi b,.bar-val,td.num,.mini,#tip{font-variant-numeric:tabular-nums}

/* L'ANELLO DI FUOCO. Senza, chi naviga da tastiera non sa dove si trova: il
   contorno di sistema su fondo scuro e' quasi invisibile. */
button:focus-visible,select:focus-visible,input:focus-visible,
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;
border-radius:7px}

/* MOVIMENTO. Un cambio di stato istantaneo si legge come uno sfarfallio: due
   decimi di secondo bastano a farlo sembrare una risposta. */
button,select,input,.chip,.bar-track i,nav #tablist button{
transition:background-color .16s ease,border-color .16s ease,color .16s ease,
opacity .16s ease}
tbody tr{transition:background-color .12s ease}

/* PRESSIONE. Il pulsante si abbassa di un pelo: e' il segnale che il clic e'
   arrivato, prima ancora che succeda qualcosa. */
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.chip:active{transform:translateY(1px)}

/* Le righe di spiegazione non devono lasciare una parola sola in fondo. */
.note,#tip,.err{text-wrap:pretty}

/* Chi ha chiesto meno animazioni la deve avere. Il pulsare del pallino
   "elaboro" e' l'unica animazione continua, ed e' proprio quella che da'
   fastidio. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;
  animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="telaio">
  <!-- LA SPALLA. Sopra: dove sono. Sotto: cosa posso fare ai dati. In mezzo
       lo spazio, cosi' le due famiglie non si toccano mai. -->
  <aside class="spalla ui">
    <header>
      <h1>Bilancio</h1>
      <span class="status" id="status"></span>
    </header>

    <!-- Qui e' la casa di #tablist su desktop/tablet (sopra i 640px). Da
         smartphone lo sposta JS in fondo a .telaio, sotto .lato: vedi
         posizionaTablist() -- CSS da solo non puo' spostare un elemento
         da un genitore all'altro, e qui i due layout ne hanno davvero
         bisogno in due punti diversi (dentro la spalla, o ancorato in
         fondo allo schermo intero). -->
    <nav id="tablist"></nav>

    <div class="grow"></div>

    <div class="acts">
      <h3>Dati</h3>
      <button id="btn-load" class="hide">Carica dati</button>
      <button id="btn-run">Ricarica</button>
      <button id="btn-export">Esporta Excel</button>
      <button id="btn-log">Log</button>
      <div class="status ui" id="source"></div>
    </div>
  </aside>

  <div class="lato">
    <!-- Sotto i 640px .barra diventa un pannello a comparsa dal basso: e' lo
         STESSO elemento, non una copia. Una checkbox nascosta + due label lo
         aprono/chiudono senza una riga di JavaScript: niente da tenere in
         sincro con F, perche' i filtri veri restano quelli di sempre. Sopra
         i 640px questi tre elementi sono display:none da CSS. -->
    <input type="checkbox" id="mob-filtri" class="sheet-toggle">
    <label for="mob-filtri" class="bl-backdrop"></label>
    <label for="mob-filtri" class="filter-chip ui" id="filter-chip">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M8 12h8M11 18h2"/></svg>
      <span id="filter-chip-label"></span>
      <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </label>
    <!-- Due riquadri, non uno. Sopra si SCEGLIE cosa guardare, sotto si LEGGE
         quello che ne esce: sono due gesti diversi, e tenerli nella stessa
         cornice li faceva sembrare la stessa cosa. -->
    <div class="barra ui" id="barra">
      <label for="mob-filtri" class="sheet-close ui">Periodo e filtri <span>Chiudi</span></label>
      <div class="bar ui" id="periodo">
        <div class="quick" id="f-quick"></div>
        <label id="f-confronto-eti">confronta con</label>
        <div class="quick confronto" id="f-confronto"></div>
        <label id="f-lettura-eti">leggi</label>
        <div class="quick" id="f-lettura"></div>
      </div>
      <div class="bar ui" id="filters">
        <label>dal</label><input type="date" id="f-from">
        <label>al</label><input type="date" id="f-to">
        <label>conto</label><select id="f-account"></select>
        <label>natura</label><select id="f-nature"></select>
        <label>categoria</label><select id="f-category"></select>
        <label>sotto</label><select id="f-sub"></select>
        <input type="search" id="f-text" placeholder="cerca nella descrizione">
        <button class="link" id="f-reset">azzera</button>
      </div>
    </div>

    <div class="kpibar ui" id="kpibar"></div>
    <p class="note" id="periodo-nota"></p>

    <div id="error" class="err hide"></div>
    <div class="chips" id="crumbs"></div>

    <div id="view"></div>
  </div>
</div>

<div id="tip" class="ui hide"></div>

<!-- Overlay bloccante: creare/eliminare una transazione (anello che gira),
     o leggere uno scontrino (barra: puo' volerci fino a un minuto, l'anello
     da solo non direbbe "e' normale che duri", sembrerebbe piantato). Le
     altre azioni restano col solo pallino di stato -- non intrappolate,
     quelle sono scritture piu' leggere e gia' segnalate li'. -->
<div id="overlay-azione" class="ui hide" aria-live="polite">
  <div class="spinner" id="overlay-spinner"></div>
  <div class="overlay-barra hide" id="overlay-barra"><i></i></div>
  <span id="overlay-testo">un attimo…</span>
</div>

<dialog id="modale" class="ui">
  <form method="dialog">
    <p id="modale-testo"></p>
    <input id="modale-campo" class="hide">
    <select id="modale-scelta" class="hide"></select>
    <p id="modale-nota" class="note hide"></p>
    <div class="modale-azioni">
      <button type="button" id="modale-no">Annulla</button>
      <button type="submit" id="modale-si" class="primary">OK</button>
    </div>
  </form>
</dialog>

<!-- Revisione dello scontrino letto dalla fotocamera (vedi
     "scansiona scontrino" in Transazioni). Dialog A PARTE, non la stessa
     #modale di sopra: quella e' pensata per un valore solo (testo/scelta),
     qui servono tre campi insieme -- forzarli dentro alla stessa struttura
     avrebbe voluto dire cambiare una modale gia' in uso da chiedi()/
     avvisa()/domanda() per un bisogno diverso. -->
<dialog id="scontrino-revisione" class="ui">
  <form method="dialog">
    <p>Letto dallo scontrino. Controlla prima di salvare: un modello che
      legge un'immagine sbaglia, non e' un dato gia' vero.</p>
    <div class="bl-field"><label>Negozio</label>
      <input id="sr-negozio"></div>
    <div class="bl-field"><label>Merchant</label>
      <input id="sr-merchant"></div>
    <div class="bl-field"><label>Categoria</label>
      <select id="sr-categoria"></select></div>
    <div class="bl-field"><label>Data</label>
      <input type="date" id="sr-data"></div>
    <div class="bl-field"><label>Importo</label>
      <input id="sr-importo"></div>
    <p id="sr-avviso" class="note hide"></p>
    <div class="modale-azioni">
      <button type="button" id="sr-annulla">Annulla</button>
      <button type="button" id="sr-conferma" class="primary">Conferma e salva</button>
    </div>
  </form>
</dialog>

<aside id="log">
  <div class="top">
    <b>Log</b>
    <span id="log-state" class="mini"></span>
    <span class="grow"></span>
    <button class="link" id="log-follow" title="segui la coda">↓ segui</button>
    <button class="link" id="log-close">chiudi</button>
  </div>
  <pre id="log-body"></pre>
</aside>

<script>
"use strict";

// --------------------------------------------------------------------------
// stato
// --------------------------------------------------------------------------
let S = null;                     // ultimo payload dal server
let TAB = "dashboard";
let VERSION = -1;
// Selezione multipla, per applicare una categoria a piu' righe con un solo
// giro di pipeline invece di uno per riga. Vive per ID, non per riga
// disegnata: sopravvive a un ridisegno (ordinamento, "carica altre") ma si
// svuota cambiando scheda, perche' una spunta lasciata accesa e invisibile
// altrove confonderebbe piu' di quanto risparmi.
let SELECTED = new Set();
// Di default si parte sull'anno in corso: confrontoScelto() ricade gia' da
// solo su "anno prima" quando il periodo e' un anno intero, quindi basta il
// periodo per avere anche il confronto giusto acceso.
const ANNO_DEFAULT = new Date().getFullYear();
const F = {from:`${ANNO_DEFAULT}-01-01`, to:`${ANNO_DEFAULT}-12-31`,
           account:"", nature:"", category:"", sub:"",
           text:"", confronto:"", vista:"", lettura:"mia"};
// Ordinamento della tabella Transazioni: piu' recenti prima, cosi' non serve
// scorrere 1900 righe per vedere l'ultima spesa fatta.
const SORT = {col:"Data", dir:-1};
// Ordinamento a se' per "Con Michela": condividere SORT con Transazioni
// vorrebbe dire che cambiare colonna di la' ordina qui per una colonna che
// in questa tabella non esiste nemmeno, senza nessuna freccia a dirlo.
const SORT_MICHELA = {col:"Data", dir:-1};
// La finestra del grafico "uscite mese per mese" e' indipendente dal periodo
// scelto in alto: quel filtro sceglie COSA sommano gli indicatori, questo
// sceglie quanta storia disegnare. Di default l'anno in corso fino a oggi;
// "tutta la storia" la svuota per tornare a vedere tutti i mesi.
const OGGI = new Date();
const ANDAMENTO = {da:`${ANNO_DEFAULT}-01`,
                   a:`${ANNO_DEFAULT}-${String(OGGI.getMonth()+1).padStart(2,"0")}`};
// Quante righe mostrare nella tabella Transazioni, e con quale filtro/ordine
// era stata caricata l'ultima volta: cambiare filtro o colonna deve ripartire
// da 100, altrimenti "carica altre" sommerebbe pagine di ricerche diverse.
const PAGE_SIZE = 100;
let PAGE = {n:1, sig:""};
// Livello attuale della torta di "Dove vanno i soldi" (solo mobile, solo
// vista "area"): vuoto = torta delle categorie, altrimenti nome della
// categoria di cui si vedono le sottocategorie. Oggetto tutto suo, non su F:
// F pilota i filtri globali di ogni scheda, questo e' solo lo zoom di una
// card, stesso trattamento di ANDAMENTO qui sopra.
const DOVE_PIE = {categoria: ""};

// Le categorie hanno due livelli. Dentro al motore viaggiano unite
// ("Casa > Casalinghi"), qui arrivano gia' divise in Categoria e
// Sottocategoria; questa ricompone il nome intero, che resta la chiave con cui
// si parla col server.
const SEP = " > ";
const whole = t => t.Sottocategoria ? t.Categoria + SEP + t.Sottocategoria
                                    : (t.Categoria || "");

const TABS = [
  ["dashboard", "Dashboard"],
  ["revisione", "Da rivedere"],
  ["transazioni", "Transazioni"],
  ["partita", "Con Michela"],
  ["categorie", "Categorie"],
  ["regole", "Regole e merchant"],
  ["componi", "Componi"],
];

// Sotto i 640px la tab bar in basso ha 5 posti: le 4 schede piu' aperte
// restano a un tocco, le altre tre finiscono sotto "Altro" (vedi render()).
// Sopra i 640px questi due array non vengono nemmeno letti nel markup del
// loop principale: servono solo al secondo blocco (.tab-more), che il CSS
// nasconde del tutto su schermi larghi.
const TAB_CODA = TABS.filter(([id]) =>
  id === "categorie" || id === "regole" || id === "componi");
// Icone minime, SVG inline: niente libreria installata in questo file
// unico senza build step, e sono glifi semplici, non illustrazioni.

const pad = n => String(n).padStart(2, "0");

// Intervallo di un mese, spostato di `delta` mesi. Date in UTC per non farsi
// spostare il primo del mese dal fuso orario.
function monthRange(year, monthNumber, delta){
  const start = new Date(Date.UTC(year, monthNumber - 1 + delta, 1));
  const y = start.getUTCFullYear(), m = start.getUTCMonth() + 1;
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(last)}`];
}

// I periodi del calendario si contano dal calendario. Ancorarli all'ultima
// transazione rendeva "Mese in corso" una bugia: mostrava gennaio essendo
// agosto. Se il periodo e' vuoto la risposta giusta e' "non hai dati per
// agosto", non un mese diverso da quello chiesto.
function today(){
  const d = new Date();
  return {y:d.getFullYear(), m:d.getMonth()+1,
          iso:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
}

// L'ultimo mese che ha davvero movimenti. Ha un pulsante suo, con un nome che
// dice quello che fa.
function lastDataMonth(){
  const dates = (S ? S.transactions : []).map(t => t.Data).filter(Boolean);
  if(!dates.length) return null;
  const last = dates.reduce((a,b) => a > b ? a : b);
  return {y:+last.slice(0,4), m:+last.slice(5,7), iso:last};
}

const QUICK = [
  ["Mese in corso", () => { const a = today(); return monthRange(a.y, a.m, 0); }],
  ["Mese scorso",   () => { const a = today(); return monthRange(a.y, a.m, -1); }],
  ["Ultimi 3 mesi", () => { const a = today();
                            return [monthRange(a.y, a.m, -2)[0],
                                    monthRange(a.y, a.m, 0)[1]]; }],
  ["Anno in corso", () => { const a = today();
                            return [`${a.y}-01-01`, `${a.y}-12-31`]; }],
  ["Anno scorso",   () => { const a = today();
                            return [`${a.y-1}-01-01`, `${a.y-1}-12-31`]; }],
  ["Ultimo mese con dati", () => { const a = lastDataMonth();
                                   return a ? monthRange(a.y, a.m, 0)
                                            : ["", ""]; }],
];

function renderQuick(){
  const ultimo = lastDataMonth();
  const adesso = today();

  el("f-quick").innerHTML = QUICK.map(([label, range], i) => {
    const [from, to] = range();

    return `<button data-quick="${i}"${from ? "" : " disabled"} `
         + `class="${on ? "on" : ""}">${esc(label)}</button>`;
  }).join("")
    + (vecchi ? `<span class="anchor">oggi ${esc(adesso.iso)} · ultimo `
                + `movimento ${esc(ultimo.iso)}</span>` : "");
}


// Mesi contenuti nel periodo CHIESTO, estremi inclusi.
function monthsBetween(from, to){
  if(!from || !to) return 0;
  const a = +from.slice(0,4)*12 + +from.slice(5,7);
  const b = +to.slice(0,4)*12 + +to.slice(5,7);
  return b >= a ? b - a + 1 : 0;
}

const mesi = n => n === 1 ? "1 mese" : `${n} mesi`;

// Il periodo chiesto e quello effettivamente coperto dai dati sono due cose
// diverse, e vanno dette separatamente: "anno in corso" che mostra un solo
// mese sembra un filtro rotto, invece e' un anno appena cominciato. Serve
// anche a dire cosa sono i numeri sopra: su "anno in corso" con dati solo a
// gennaio, "uscite" e' il totale vero di gennaio, non una media proiettata.
function coverage(rows, months){
  if(!months.length){
    // Vuoto non e' un errore: e' l'informazione che per quel periodo non hai
    // ancora caricato niente. Dire dove sono gli ultimi dati evita di dover
    // andare a cercarli a mano.
    const ultimo = lastDataMonth();
    return "  ·  nessuna transazione nel periodo scelto"
      + (ultimo ? `. L'ultimo movimento che hai e' del ${ultimo.iso}: `
                  + `usa "Ultimo mese con dati", oppure copia nella cartella `
                  + `gli export piu' recenti.` : "");
  }
  const span = `da ${months[0]} a ${months[months.length-1]}`;
  const asked = monthsBetween(F.from, F.to);
  if(asked > months.length){
    return `  ·  ${rows.length} righe  ·  periodo chiesto ${mesi(asked)} `
      + `(${F.from} – ${F.to}), dati presenti per ${mesi(months.length)}: `
      + `${span}. I numeri sopra sono il totale reale fin qui, non una `
      + `stima sui ${mesi(asked)} chiesti.`;
  }
  return `  ·  ${rows.length} righe su ${mesi(months.length)}, ${span}`;
}

// Sostituiscono alert, confirm e prompt del browser. Tornano una promessa, e
// per questo ogni chiamata va attesa: e' l'unica differenza rispetto a prima.
function modale(opzioni){
  return new Promise(risolvi => {
    const dlg = el("modale"), campo = el("modale-campo"), no = el("modale-no");
    const scelta = el("modale-scelta"), nota = el("modale-nota");
    el("modale-testo").textContent = opzioni.testo;
    const chiede = opzioni.valore !== undefined;
    const sceglie = !!opzioni.scelte;
    campo.classList.toggle("hide", !chiede || sceglie);
    campo.value = chiede && !sceglie ? opzioni.valore : "";
    // Un menu invece di un campo libero quando le risposte sono un insieme
    // chiuso: cosi' non si puo' inventare una categoria che non esiste.
    scelta.classList.toggle("hide", !sceglie);
    if(sceglie){
      scelta.innerHTML = opzioni.scelte.map(s =>
        `<option ${s === opzioni.valore ? "selected" : ""}>${esc(s)}</option>`).join("");
    }
    // Una riga che si aggiorna mentre scegli: dice cosa succederebbe.
    nota.classList.toggle("hide", !opzioni.aggiorna);
    if(opzioni.aggiorna){
      const ridisegna = () => { nota.textContent = opzioni.aggiorna(scelta.value); };
      scelta.onchange = ridisegna;
      ridisegna();
    }
    no.classList.toggle("hide", !opzioni.annullabile);
    el("modale-si").textContent = opzioni.ok || "OK";
    // La risposta si prende dai tre modi in cui si puo' rispondere, non
    // dall'evento "close": su alcuni browser quell'evento non arriva, e la
    // promessa resterebbe appesa per sempre con la pagina bloccata dietro.
    // Sono proprieta' e non addEventListener, cosi' una chiamata sostituisce
    // la precedente invece di accumularsi.
    const chiudi = detto => {
      dlg.close();
      const dato = sceglie ? scelta.value : campo.value;
      risolvi(chiede ? (detto ? dato : null) : detto);
    };
    dlg.querySelector("form").onsubmit = ev => {   // OK, o Invio nel campo
      ev.preventDefault();
      chiudi(true);
    };
    no.onclick = () => chiudi(false);
    // Esc, per due strade: "cancel" e' quella prevista, ma su alcuni browser
    // non arriva, e allora la pagina resterebbe bloccata dietro a un riquadro
    // che non si chiude. Il tasto lo si ascolta anche direttamente.
    dlg.oncancel = ev => { ev.preventDefault(); chiudi(false); };
    dlg.onkeydown = ev => {
      if(ev.key === "Escape"){ ev.preventDefault(); chiudi(false); }
    };
    dlg.showModal();
    if(sceglie) scelta.focus();
    else if(chiede){ campo.focus(); campo.select(); }
  });
}
// Il valore sotto al mouse. Un solo ascolto sul documento invece di uno per
// fascia: le fasce si rifanno a ogni ridisegno del grafico, e agganciarle una
// per una vorrebbe dire riagganciarle ogni volta.
function seguiIlMouse(ev){
  const tip = el("tip");
  const banda = ev.target.closest && ev.target.closest("[data-tip]");
  // La guida si nasconde SEMPRE prima: uscendo dal grafico deve sparire, e
  // passando da un mese all'altro non deve restarne una accesa dietro.
  document.querySelectorAll("line.guida").forEach(g => g.classList.add("hide"));
  if(!banda){ tip.classList.add("hide"); return; }
  const guida = banda.ownerSVGElement
    && banda.ownerSVGElement.querySelector("line.guida");
  if(guida && banda.dataset.x){
    guida.setAttribute("x1", banda.dataset.x);
    guida.setAttribute("x2", banda.dataset.x);
    guida.classList.remove("hide");
  }
  tip.textContent = banda.dataset.tip;
  tip.classList.remove("hide");
  // Sopra e a destra del puntatore, ma senza uscire dalla finestra.
  const l = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY - h - 12;
  if(x + l > innerWidth - 8) x = ev.clientX - l - 14;
  if(y < 8) y = ev.clientY + 20;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = y + "px";
}
document.addEventListener("mousemove", seguiIlMouse);

// Foto -> JPEG piu' piccolo -> base64, prima di mandarla al server. Una
// foto da telefono a piena risoluzione (spesso 3-4000px di lato, qualche
// MB) e' inutile per leggere un totale stampato: piu' lenta da caricare E
// piu' lenta da processare per il modello, senza guadagnare niente in
// leggibilita' oltre una certa soglia.
function fotoScontrinoBase64(file){
  return new Promise((risolvi, rifiuta) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MASSIMO = 1600;
      let {width, height} = img;
      if(width > MASSIMO || height > MASSIMO){
        const scala = MASSIMO / Math.max(width, height);
        width = Math.round(width * scala);
        height = Math.round(height * scala);
      }
      const tela = document.createElement("canvas");
      tela.width = width; tela.height = height;
      tela.getContext("2d").drawImage(img, 0, 0, width, height);
      // toDataURL torna "data:image/jpeg;base64,XXXX": a Ollama serve solo
      // la parte dopo la virgola.
      risolvi(tela.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rifiuta(new Error("immagine illeggibile")); };
    img.src = url;
  });
}

// Trova e apre la card/riga di una transazione per ID, non per testo: due
// creazioni di fila con lo stesso segnaposto si confondevano fra loro
// (vedi d.nuova). Sotto i 640px la stessa riga esiste due volte nel DOM
// (tabella desktop nascosta + card mobile, vedi txCardsHTML): si apre ogni
// <details> che la contiene (nessun effetto sull'input della tabella, che
// non ne ha uno), poi si sceglie quello che il CSS mostra davvero ora.
function apriTransazione(id, campo){
  campo = campo || "Descrizione";
  const candidati = Array.from(document.querySelectorAll(
    `input[data-id="${id}"]`)).filter(c => c.dataset.fix === campo);
  candidati.forEach(c => { const dett = c.closest("details");
                            if(dett) dett.open = true; });
  const input = candidati.find(c => c.offsetParent !== null);
  if(input){
    input.focus(); input.select();
    input.scrollIntoView({block:"center"});
  }
}

// La revisione dello scontrino: apre #scontrino-revisione con i tre campi
// pre-riempiti. NIENTE si salva finche' non si preme "Conferma e salva" --
// e' la richiesta esplicita di Fabio, un modello che legge un'immagine
// sbaglia, e su un conto in comune un importo sbagliato non deve poter
// finire scritto senza che qualcuno l'abbia guardato prima. Stesso stile
// di modale() sopra (.onclick invece di addEventListener, cosi' una
// chiamata sostituisce la precedente invece di accumularsi; oncancel ED
// Esc a mano, perche' non tutti i browser sparano "cancel").
function apriRevisioneScontrino(letto){
  const dlg = el("scontrino-revisione");
  el("sr-negozio").value = letto.negozio || "";
  el("sr-merchant").value = letto.merchant || "";
  el("sr-categoria").innerHTML = '<option value="">— nessuna —</option>'
    + categoryOptions(letto.categoria || "");
  el("sr-data").value = letto.data || today().iso;
  el("sr-importo").value = letto.importo != null ? String(-Math.abs(letto.importo)) : "";
  const mancanti = [];
  if(!letto.negozio) mancanti.push("il negozio");
  if(!letto.data) mancanti.push("la data");
  if(letto.importo == null) mancanti.push("l'importo");
  const avviso = el("sr-avviso");
  avviso.classList.toggle("hide", !mancanti.length);
  avviso.textContent = mancanti.length
    ? `Non ho letto bene ${mancanti.join(", ")}: completa a mano prima di confermare.`
    : "";
  const chiudi = () => dlg.close();
  el("sr-annulla").onclick = chiudi;
  dlg.oncancel = ev => { ev.preventDefault(); chiudi(); };
  dlg.onkeydown = ev => {
    if(ev.key === "Escape"){ ev.preventDefault(); chiudi(); }
  };
  el("sr-conferma").onclick = async () => {
    const negozio = el("sr-negozio").value.trim();
    const data = el("sr-data").value;
    const importo = el("sr-importo").value.trim();
    const merchant = el("sr-merchant").value.trim();
    const categoria = el("sr-categoria").value;
    if(!negozio || !data){
      return avvisa("Servono almeno negozio e data prima di salvare.");
    }
    chiudi();
    mostraOverlay();
    let risposta;
    try {
      risposta = await post("/api/nuova", {data, descrizione: negozio,
                                importo: importo || "0", conto: "A mano"});
      // Merchant e categoria arrivano gia' proposti dalle stesse regole che
      // girerebbero comunque al salvataggio: si scrive una correzione/un
      // override SOLO se l'utente li ha davvero cambiati, altrimenti la riga
      // finirebbe con l'origine "override" invece di "regola"/"storico" pur
      // avendo lo stesso identico valore.
      if(risposta && risposta.id
         && (merchant !== (letto.merchant || "")
             || categoria !== (letto.categoria || ""))){
        const scarto = {id: risposta.id};
        if(merchant !== (letto.merchant || "")) scarto.merchant = merchant;
        if(categoria !== (letto.categoria || "")) scarto.categoria = categoria;
        await post("/api/transaction", scarto);
      }
      await reload();
    } finally { nascondiOverlay(); }
    if(risposta && risposta.id) apriTransazione(risposta.id);
  };
  dlg.showModal();
  el("sr-negozio").focus();
  if(!letto.negozio) el("sr-negozio").select();
}

function post(route, body){
  return fetch(route, {method:"POST", headers:{"Content-Type":"application/json"},
                       body:JSON.stringify(body)})
    .then(r => r.json())
    .then(r => { if(r.errore) avvisa(r.errore); return r; });
}

// Solo le uscite vere: i giroconti non impoveriscono, includerli falsa tutto.
// Un saldo e' lo stesso genere di cosa: e' un rimborso fra le due persone, non
// una spesa ne' un'entrata, e questo vale in entrambe le letture. E' l'unico
// caso in cui marcare una riga sposta un numero anche nella lettura tutto.
const spending = rows => rows.filter(t => t.Natura !== "Non spesa" && t.Quota !== "saldo");
// Il reddito vero e' quello di natura "Entrate": stipendio e affitti. Tutto
// il resto col segno positivo e' un rimborso o uno storno, e non e' guadagno:
// scala dalla spesa a cui appartiene, dove riduce quella voce.
//
// Dividere per segno diceva che guadagni 155.067 quando ne guadagni 143.671 e
// 11.396 ti tornano indietro. Il risparmio non cambia di un centesimo: le due
// funzioni continuano a spartirsi le stesse righe.
const inflow  = rows => spending(rows).filter(t => t.Natura === "Entrate");
const outflow = rows => spending(rows).filter(t => t.Natura !== "Entrate");
// La somma passa dal moltiplicatore: e' l'unico punto da cui passano tutti i
// riquadri, quindi cambiarlo qui li cambia tutti insieme e nessuno puo'
// dimenticarsene.
const sum = rows => rows.reduce((s,t) => s + t.Importo * quotaDi(t), 0);
// Non tutte le somme rispondono a "quanto e' mio". Questa risponde a "quanti
// soldi muovono queste righe", punto: quanto passa una regola non dipende da
// chi ne deve una fetta all'altro, e non deve muoversi col cambio di lettura.
const sommaPiena = rows => rows.reduce((s,t) => s + t.Importo, 0);
const monthsOf = rows => Math.max(uniq(rows.map(month)).length, 1);

// I mesi CONTATI COME SONO DAVVERO: l'ultimo vale per la parte trascorsa.
//
// monthsOf() conta i mesi distinti, quindi un agosto fermo al 25 pesa come un
// mese intero e tutte le medie "al mese" scendono. Sul mutuo faceva 733 euro
// invece dei 786 veri, e per capire perche' bisognava aprire il consolidato.
// E' lo stesso errore che gli indicatori avevano gia' imparato a evitare col
// ritaglio: qui arriva anche alle tabelle.
//
// Solo l'ULTIMO mese si ritaglia. Un mese vuoto in mezzo e' un mese in cui non
// hai speso, e vale uno: toglierlo alzerebbe la media di un dato che non c'e'.
function mesiEffettivi(rows){
  const mesi = uniq(rows.map(month)).sort();
  if(!mesi.length) return 1;
  const ultimo = mesi[mesi.length - 1];
  const fino = rows.map(t => t.Data || "").filter(d => d.slice(0, 7) === ultimo)
    .reduce((a, b) => a > b ? a : b, "");
  if(!fino) return mesi.length;
  const giorniDelMese = new Date(Date.UTC(+ultimo.slice(0, 4),
                                          +ultimo.slice(5, 7), 0)).getUTCDate();
  const trascorsi = +fino.slice(8, 10);
  return mesi.length - 1 + trascorsi / giorniDelMese;
}

// Il denominatore di OGNI "al mese": barra degli indicatori e tabelle sotto
// devono dividere per lo stesso numero, altrimenti raccontano due storie
// sulle stesse righe (la barra diceva "1 mese", la tabella "0.806" - 24% di
// scarto, tutto a favore di un falso miglioramento). Un solo punto di
// passaggio e chi lo cambia lo cambia per tutti insieme.
const mesiPeriodo = rows => mesiEffettivi(spending(rows));

// Il periodo si puo' escludere. Serve all'andamento, che vive sullo storico:
// ritagliato al mese scelto si riduceva a un punto solo, cioe' a niente. Gli
// altri filtri restano, perche' quelli dicono DI COSA si sta parlando.
function filtered(conPeriodo){
  if(!S) return [];
  const periodo = conPeriodo !== false;
  return S.transactions.filter(t => {
    if(periodo && F.from && (t.Data||"") < F.from) return false;
    if(periodo && F.to && (t.Data||"") > F.to) return false;
    if(F.account && t.Conto !== F.account) return false;
    if(F.nature && t.Natura !== F.nature) return false;
    if(F.category && t.Categoria !== F.category) return false;
    if(F.sub && t.Sottocategoria !== F.sub) return false;
    if(F.text){
      const hay = ((t.Descrizione||"")+" "+(t.Merchant||"")).toLowerCase();
      if(!hay.includes(F.text.toLowerCase())) return false;
    }
    return true;
  });
}

// Stessa regola di sum: ogni chiamante raggruppa spese o entrate per dire
// "quanto ho speso in questa categoria/natura", quindi passa dal
// moltiplicatore. Se un domani un chiamante volesse i soldi mossi e basta,
// gli serve una funzione a parte come sommaPiena, non un flag qui dentro.
function groupSum(rows, key){
  const map = new Map();
  for(const t of rows){
    const k = t[key] || "Senza categoria";
    const cur = map.get(k) || {total:0, n:0};
    cur.total += (t.Importo || 0) * quotaDi(t); cur.n++;
    map.set(k, cur);
  }
  return [...map.entries()].map(([name,v]) => ({name, ...v}))
                           .sort((a,b) => a.total - b.total);
}

// grafici (stessa logica di dashboard.py, ma reagiscono ai filtri)
// --------------------------------------------------------------------------
// Barre in HTML, non in SVG. Un SVG con viewBox fisso scala TUTTO quando il
// riquadro si stringe, testo compreso: dentro una colonna da 440px le
// etichette scendevano a sette pixel. Qui l'etichetta e l'importo restano
// alla loro dimensione e si adatta solo la barra, che e' l'unica cosa che
// deve adattarsi.
function barChart(items, opts){
  opts = opts || {};
  if(!items.length) return '<p class="note">nessun dato</p>';
  const top = Math.max(...items.map(i => Math.abs(i.value))) || 1;
  return '<div class="bars">' + items.map(it => {
    const w = Math.abs(it.value) / top * 100;
    const click = opts.drill ? ` class="bar-row hit" data-drill="${esc(opts.drill)}"`
                             + ` data-value="${esc(it.name)}"` : ' class="bar-row"';
    return `<div${click}>`
      + `<span class="bar-lbl" title="${esc(String(it.name))}">`
      + `${esc(String(it.name))}</span>`
      + `<span class="bar-track"><i style="width:${w.toFixed(1)}%;`
      + `background:${esc(it.color||"#4a7fb5")}"></i></span>`
      + `<span class="bar-val">${euro(it.value)}</span></div>`;
  }).join("") + "</div>";
}

// "2026-08" -> "agosto 2026". Sull'asse ci sta solo "26-08", ma nel
// tooltip, che si legge, il mese per esteso costa niente.
const NOMI_MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno",
  "luglio","agosto","settembre","ottobre","novembre","dicembre"];
function meseLeggibile(etichetta){
  const m = /^(\d{4})-(\d{2})$/.exec(String(etichetta || ""));
  return m ? `${NOMI_MESI[+m[2]-1]} ${m[1]}` : String(etichetta || "");
}

function lineChart(labels, series, dentro){
  if(!labels.length) return '<p class="note">nessun dato</p>';
  const W = 760, H = 340, LEFT = 56, BASE = H - 26;
  const flat = series.flatMap(s => s.values).concat([0]);
  const top = Math.max(...flat) || 1, bottom = Math.min(...flat);
  const span = (top - bottom) || 1;
  // Con un punto solo si centra: lasciarlo a sinistra con mezzo riquadro
  // vuoto sembra un grafico troncato invece di un mese solo.
  const px = (i,v) => [labels.length === 1 ? (LEFT + W - 12)/2
                         : LEFT + i*(W-LEFT-12)/Math.max(labels.length-1,1),
                       12 + (top-v)/span*(BASE-12)];
  const passo = (W-LEFT-12)/Math.max(labels.length-1,1);
  let out = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  // La fascia del periodo scelto. La linea resta intera: si vede dove cade il
  // periodo di cui parlano gli indicatori, e insieme da dove viene.
  if(dentro && dentro.length && dentro.length < labels.length){
    const a = labels.indexOf(dentro[0]);
    const b = labels.indexOf(dentro[dentro.length-1]);
    if(a >= 0 && b >= a){
      const x1 = px(a, top)[0] - passo/2, x2 = px(b, top)[0] + passo/2;
      out += `<rect class="fascia" x="${Math.max(x1, LEFT).toFixed(1)}" y="6"`
          + ` width="${(Math.min(x2, W-12) - Math.max(x1, LEFT)).toFixed(1)}"`
          + ` height="${(BASE-6).toFixed(0)}"/>`;
    }
  }
  [0,0.5,1].forEach(f => {
    const y = 12 + f*(BASE-12), v = top - f*span;
    out += `<line x1="${LEFT}" y1="${y.toFixed(0)}" x2="${W-12}" y2="${y.toFixed(0)}" class="grid"/>`
        + `<text x="0" y="${(y+4).toFixed(0)}" class="axis">${(v/1000).toFixed(1)}k</text>`;
  });
  // Con pochi punti si segnano anche i pallini. Serve soprattutto quando il
  // punto e' UNO: una polilinea di un punto solo non disegna niente, e il
  // riquadro sembrava vuoto pur avendo i dati sotto.
  const pallini = labels.length <= 12;
  for(const s of series){
    const pts = s.values.map((v,i) => px(i,v).map(n => n.toFixed(1)).join(",")).join(" ");
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}"`
        + ` stroke-width="2.5" stroke-linejoin="round"/>`;
    if(pallini) out += s.values.map((v,i) => {
      const [x,y] = px(i,v);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"`
        + ` fill="${s.color}"/>`;
    }).join("");
  }
  out += `<line class="guida hide" x1="0" y1="10" x2="0" y2="${BASE}"/>`;
  // Una fascia invisibile per mese: e' lei a rispondere al mouse. Larga
  // quanto il passo, cosi' basta AVVICINARSI al punto invece di centrarlo, e
  // funziona anche a cinquantasei mesi dove i pallini non ci sono.
  labels.forEach((etichetta,i) => {
    const [x] = px(i, top);
    const testo = [meseLeggibile(etichetta)].concat(series.map(s =>
      `${s.name}: ${euro(s.values[i])}`)).join("\n");
    out += `<rect x="${(x-passo/2).toFixed(1)}" y="0" width="${passo.toFixed(1)}"`
        + ` height="${H}" fill="transparent" data-tip="${esc(testo)}"`
        + ` data-x="${x.toFixed(1)}"/>`;
  });
  const step = Math.max(1, Math.floor(labels.length/12));
  for(let i=0;i<labels.length;i+=step){
    const [x] = px(i, top);
    out += `<text x="${x.toFixed(0)}" y="${H-6}" class="axis" text-anchor="middle">`
        + `${esc(labels[i].slice(2))}</text>`;
  }
  return out + "</svg>";
}

const legend = series => '<div class="legend">' + series.map(s =>

// Torta scritta a mano come lineChart qui sopra: stesso stile, nessuna
// libreria di charting nel progetto. opts.clickable aggiunge data-dove-pie a
// ogni fetta (e classe "hit"): usato solo al primo livello, le sottocategorie
// non hanno un terzo livello sotto, solo il bottone indietro le richiude.
const PIE_COLORI = ["#4a7fb5","#b5654a","#3f9e8c","#d99442","#8a63a8",
  "#c9598c","#5a9e5a","#a68a3f","#5a8ea6","#a65a5a","#7a9e3f","#6a5aa6"];

function pieChart(data, opts){
  opts = opts || {};
  if(!data.length) return '<p class="note">nessun dato</p>';
  const totale = data.reduce((s,d) => s + Math.abs(d.total), 0) || 1;
  const R = 90, C = 100;
  const punto = a => [C + R*Math.cos(a), C + R*Math.sin(a)];
  let angolo = -Math.PI/2, fette = "";
  data.forEach((d,i) => {
    const colore = PIE_COLORI[i % PIE_COLORI.length];
    const attr = opts.clickable ? ` class="hit" data-dove-pie="${esc(d.name)}"` : "";
    const quota = Math.abs(d.total) / totale;
    // Una fetta sola (100%) degenera con un arco SVG: l'arco tornerebbe sullo
    // stesso punto di partenza e non disegnerebbe niente. Un cerchio pieno e'
    // l'unico modo corretto di disegnare "tutto qui".
    if(quota > 0.999){
      fette += `<circle cx="${C}" cy="${C}" r="${R}" fill="${colore}"${attr}/>`;
      return;
    }
    const fine = angolo + quota*2*Math.PI;
    const [x1,y1] = punto(angolo), [x2,y2] = punto(fine);
    const arcoGrande = (fine-angolo) > Math.PI ? 1 : 0;
    fette += `<path d="M${C},${C} L${x1.toFixed(1)},${y1.toFixed(1)} `
      + `A${R},${R} 0 ${arcoGrande} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" `
      + `fill="${colore}"${attr}/>`;
    angolo = fine;
  });
  return `<svg viewBox="0 0 200 200" class="dove-pie-svg">${fette}</svg>`;
}

// Stessa forma di legend() qui sopra, ma cliccabile: le fette sono piccole su
// un telefono, la voce scritta deve poter scegliere la categoria anche da
// sola. Importo al mese e quota%, la stessa lettura che la card <details>
// dava gia' aperta prima che la torta la sostituisse.
function pieLegend(data, mesi, opts){
  opts = opts || {};
  const totale = data.reduce((s,d) => s + Math.abs(d.total), 0) || 1;
  return '<div class="legend dove-pie-legend">' + data.map((d,i) => {
    const colore = PIE_COLORI[i % PIE_COLORI.length];
    const quota = Math.round(Math.abs(d.total) / totale * 100);
    const attr = opts.clickable
      ? ` class="hit" data-dove-pie="${esc(d.name)}"` : "";
    const testo = `${d.name}${d.nota ? " · " + d.nota : ""} `
      + `— ${spesa(d.total/mesi)} (${quota}%)`;
    return `<span${attr} title="${esc(testo)}"><i style="background:${colore}"></i>`
      + `${esc(testo)}</span>`;
  }).join("") + "</div>";
}

function tableHTML(headers, rows, right, rawHeaders){
  right = right || [];
  return '<div class="scroll"><table><thead><tr>'
    + headers.map(h => `<th>${rawHeaders ? h : esc(h)}</th>`).join("")
    + "</tr></thead><tbody>"
    + rows.map(r => "<tr>" + r.map((c,i) =>
        `<td${right.includes(i)?' class="num"':""}>${c}</td>`).join("") + "</tr>").join("")
    + "</tbody></table></div>";
}

    // Data+Importo e Pagato da+Quota sono valori corti che affiancati si

        + `value="${t.Importo}" data-fix="Importo" data-id="${esc(t.ID)}"></div>`
        + `</div>`
        + `<div class="bl-field"><label>Descrizione</label>`
        + `<input value="${esc(t.Descrizione||"")}" data-fix="Descrizione" `
        + `data-id="${esc(t.ID)}"></div>`
        + `<div class="bl-field"><label>Merchant</label>`
        + `<input value="${esc(t.Merchant||"")}" data-fix="Merchant" `
        + `data-id="${esc(t.ID)}"></div>`
        + `<div class="bl-field"><label>Conto</label>${accountSelect(t.Conto, t.ID)}</div>`
        + `<div class="bl-field"><label>Categoria</label>${categorySelect(whole(t), t.ID)}</div>`
        + `<div class="bl-field-row">`

            + `${v ? (v==="io"?"Fabio":esc((S.partita&&S.partita.controparte)||"lei")) : "—"}</option>`

        + `<div class="bl-field"><label>Quota</label>`
        + `<select data-quota="${esc(t.ID)}">` + ["", "meta", "tutto", "saldo"].map(v =>

    return `<details class="bl-tx">${sommario}<div class="body">${campi}`
