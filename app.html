// --------------------------------------------------------------------------
// riquadri della dashboard
// --------------------------------------------------------------------------
const CARDS = {};

// Gli indicatori vivono nella barra, accanto ai pulsanti del periodo:
// "in questo periodo, questi numeri" e' una frase sola, e spezzarla in un
// riquadro sotto ai filtri la faceva leggere due volte. Torna solo le celle;
// e' render() a metterle in #kpibar.
function indicatori(rows){
  const out = outflow(rows), inc = inflow(rows), m = mesiPeriodo(rows);
  const spent = sum(out), earned = sum(inc), saved = earned + spent;
  const ordinary = sum(out.filter(t => t.Natura !== "Straordinarie"));

  // Risparmio e tasso hanno senso solo sul bilancio intero. Su un
  // sottoinsieme di sole uscite darebbero "tasso di risparmio -760%": un
  // numero che sembra una conclusione e non vuol dire niente. Quando un
  // filtro esclude le entrate si mostra il peso di quella fetta.
  const partial = !!(F.nature || F.category || F.text);
  if(partial){
    const whole = sum(outflow(S.transactions));
    return kpi("uscite / mese", spesa(spent/m))
      + kpi("totale nel periodo", spesa(spent))
      + kpi("quota sulle uscite",
            whole ? Math.round(spent/whole*100) + "%" : "—")
      + kpi("transazioni", String(out.length))
      // m e' passato a mesiEffettivi (frazionario) col resto della barra:
      // senza arrotondare qui si rivedeva a schermo lo stesso raw float
      // gia' trovato in CARDS.dove ("14/55.806451612903224 mesi").
      + kpi("mesi coperti", String(Math.round(m)));
  }

  const rate = earned ? saved/earned : 0;

  // Gli stessi numeri sul periodo precedente, per dare un metro.
  const p = finestraConfronto();
  const prima = p ? S.transactions.filter(t =>
    dentroFinestra(p, t.Data || "")) : [];
  // Stesso metro dei due lati: la finestra di confronto e' gia' ritagliata
  // al giorno in cui si fermano i dati, quindi anche il suo ultimo mese e'
  // parziale e va contato per la parte trascorsa.
  const mp = mesiEffettivi(spending(prima)) || 1;
  const spesoP = sum(outflow(prima)), presoP = sum(inflow(prima));
  const ordinarioP = sum(outflow(prima).filter(t => t.Natura !== "Straordinarie"));
  const tassoP = presoP ? (presoP + spesoP)/presoP : 0;

  // Un periodo in corso non ha ancora un mese intero da mediare: "ora" e
  // "prima" restano i totali veri (la finestra di confronto e' gia'
  // ritagliata allo stesso punto, quindi il paragone resta corretto), e
  // l'etichetta lo dice smettendo di promettere una media al mese.
  const inCorso = periodoInCorso();
  const eti = base => inCorso ? base : `${base} / mese`;
  const ora = tot => inCorso ? tot : tot/m;
  const primaDi = tot => inCorso ? tot : tot/mp;

  return kpi(eti("entrate"), euro(ora(earned)), "",
          confronta(ora(earned), primaDi(presoP), false, p && p.etichetta))
    + kpi(eti("uscite"), spesa(ora(spent)), "",
          confronta(-ora(spent), -primaDi(spesoP), true, p && p.etichetta))
    + kpi(eti("risparmio"), euro(ora(saved)), saved>0?"good":"bad",
          confronta(ora(saved), primaDi(presoP+spesoP), false, p && p.etichetta))
    + kpi("tasso di risparmio", Math.round(rate*100) + "%", "",
          confronta(rate, tassoP, false, p && p.etichetta))
    + kpi(eti("spesa ordinaria"), spesa(ora(ordinary)), "",
          confronta(-ora(ordinary), -primaDi(ordinarioP), true, p && p.etichetta));
}
const kpi = (label, value, cls, confronto) =>
  `<div class="kpi ${cls||""}"><span>${esc(label)}</span><b>${esc(value)}</b>`
  + (confronto ? `<i class="delta ${confronto.verso}">${esc(confronto.testo)}</i>` : "")
  + "</div>";

// --------------------------------------------------------------------------
// il metro del confronto
// --------------------------------------------------------------------------
// Un numero senza paragone non decide niente, ma il paragone sbagliato decide
// male. Il periodo precedente non e' sempre il metro giusto, e soprattutto va
// RITAGLIATO: agosto con i dati fino al 25 confrontato con luglio intero
// diceva "-80% di entrate", che non e' un crollo, e' un mese a meta'.

const MESI_BREVI = ["","gen","feb","mar","apr","mag","giu","lug","ago","set",
                    "ott","nov","dic"];

// Che forma ha il periodo scelto: un mese di calendario, un anno, o altro.
function formaDelPeriodo(){
  if(!F.from || !F.to) return null;
  const y = +F.from.slice(0,4), m = +F.from.slice(5,7);
  const [ma, mb] = monthRange(y, m, 0);
  if(F.from === ma && F.to === mb) return {tipo:"mese", y, m};
  if(F.from === `${y}-01-01` && F.to === `${y}-12-31`) return {tipo:"anno", y};
  return {tipo:"intervallo"};
}

// Le opzioni di confronto disponibili, che dipendono dalla forma del periodo.
// Senza un periodo scelto non ce n'e' nessuna: il riquadro mostra la media su
// tutto lo storico, e prima di tutto lo storico non c'e' niente.
function confronti(){
  const f = formaDelPeriodo();
  if(!f) return [];
  if(f.tipo === "mese") return [
    {chiave:"precedente", etichetta:"mese prima"},
    {chiave:"annoPrima",  etichetta:`${MESI_BREVI[f.m]} ${f.y-1}`},
    {chiave:"media12",    etichetta:"media 12 mesi"},
  ];
  if(f.tipo === "anno") return [
    {chiave:"annoPrima", etichetta:`${f.y-1}`},
    {chiave:"media3",    etichetta:"media 3 anni"},
  ];
  return [{chiave:"precedente", etichetta:"periodo prima"}];
}

// Quale opzione e' attiva. Cambiando periodo le opzioni cambiano, e una
// scelta non piu' valida ricade sulla prima invece di restare appesa.
function confrontoScelto(){
  const opzioni = confronti();
  if(!opzioni.length) return null;
  return opzioni.find(o => o.chiave === F.confronto) || opzioni[0];
}

// Le date si costruiscono in UTC perche' isoData() le rilegge con
// toISOString(), che e' UTC: mescolando i due fusi si perde un giorno
// intero, e il ritaglio diceva "1-24" dove i dati arrivano al 25.
const giorno = s => new Date(s + "T00:00:00Z");
const isoData = d => d.toISOString().slice(0, 10);
const piuGiorni = (s, n) => isoData(new Date(giorno(s).getTime() + n*86400000));

// Fin dove arrivano i DATI dentro al periodo scelto. Non la fine del periodo:
// agosto finisce il 31, ma i movimenti si fermano al 25.
//
// Il confine e' l'ultimo movimento IN ASSOLUTO, non l'ultimo dentro al
// periodo: se in dicembre 2025 l'ultima spesa e' del 28, l'anno e' comunque
// finito e non va ritagliato. Ritagliare li' vorrebbe dire chiamare "parziale"
// un periodo chiuso solo perche' gli ultimi giorni sono stati tranquilli.
function ultimoGiornoUtile(){
  const tutte = S.transactions.map(t => t.Data || "").filter(Boolean);
  if(!tutte.length) return F.to;
  const ultimo = tutte.reduce((a, b) => a > b ? a : b);
  return ultimo < F.to ? ultimo : F.to;
}

function giorniConDati(){
  const fino = ultimoGiornoUtile();
  if(fino < F.from) return 0;
  return Math.round((giorno(fino) - giorno(F.from)) / 86400000) + 1;
}

// Il periodo scelto e' "in corso" quando i dati non arrivano fino alla sua
// fine: un mese o un anno non ancora finiti, o anche uno gia' passato ma non
// ancora importato del tutto. In quel caso "tot/m" non e' piu' una media che
// normalizza, e' una stima sopra un totale che e' gia' vero cosi' com'e'.
function periodoInCorso(){
  return !!(F.from && F.to) && ultimoGiornoUtile() < F.to;
}

// La finestra con cui confrontare, gia' ritagliata, e come si chiama.
function finestraConfronto(){
  const scelto = confrontoScelto();
  if(!scelto) return null;
  const f = formaDelPeriodo();
  const durata = giorniConDati();
  if(!durata) return null;

  // Il ritaglio: la finestra si ferma allo stesso punto del calendario a cui
  // si fermano i dati. Per un mese o un anno il punto sono lo stesso mese e lo
  // stesso giorno del mese, non un numero di giorni: contando i giorni, il
  // 2025 intero (365) misurato sul 2024 bisestile (366) finiva il 30 dicembre
  // e si dichiarava parziale. Per un intervallo qualsiasi, dove non c'e' un
  // calendario a cui agganciarsi, i giorni restano l'unica misura.
  const fino = ultimoGiornoUtile();
  const ritaglia = (inizio, fineIntera) => {
    let fine;
    if(f && f.tipo !== "intervallo"){
      const salto = (+fino.slice(0,4)*12 + +fino.slice(5,7))
                  - (+F.from.slice(0,4)*12 + +F.from.slice(5,7));
      const [primo, ultimo] = monthRange(+inizio.slice(0,4),
                                         +inizio.slice(5,7), salto);
      const stessoGiorno = primo.slice(0, 8) + fino.slice(8, 10);
      fine = stessoGiorno < ultimo ? stessoGiorno : ultimo;  // febbraio non ha il 30
    } else {
      fine = piuGiorni(inizio, durata - 1);
    }
    return {da: inizio, a: fine < fineIntera ? fine : fineIntera,
            parziale: fine < fineIntera};
  };

  if(scelto.chiave === "precedente"){
    const fineIntera = piuGiorni(F.from, -1);
    const inizio = f && f.tipo === "mese"
      ? monthRange(f.y, f.m, -1)[0]                 // il mese prima, intero
      : piuGiorni(fineIntera, -(Math.round(
          (giorno(F.to) - giorno(F.from)) / 86400000)));
    const w = ritaglia(inizio, fineIntera);
    return {...w, etichetta: nomeFinestra(w, f, "precedente", scelto)};
  }
  if(scelto.chiave === "annoPrima"){
    const inizio = f.tipo === "mese" ? monthRange(f.y-1, f.m, 0)[0]
                                     : `${f.y-1}-01-01`;
    const fineIntera = f.tipo === "mese" ? monthRange(f.y-1, f.m, 0)[1]
                                         : `${f.y-1}-12-31`;
    const w = ritaglia(inizio, fineIntera);
    return {...w, etichetta: nomeFinestra(w, f, "annoPrima", scelto)};
  }
  // Anche le medie si ritagliano, ma in un altro modo: la finestra resta
  // lunga, e di OGNI mese (o di ogni anno) si tiene solo la parte gia'
  // trascorsa. Accorciarla non servirebbe: 25 giorni di agosto misurati su
  // dodici mesi interi dicevano "-81% di entrate", ma nessuno dei dodici mesi
  // e' il colpevole, lo sono i sei giorni che ad agosto mancano.
  const quanti = scelto.chiave === "media12" ? 12 : 36;
  // I mesi si contano con monthRange, non a mano: sottraendo mesi da una data
  // veniva fuori una finestra di undici mesi chiamata "media 12 mesi".
  const fine = piuGiorni(F.from, -1);
  const inizio = monthRange(+fine.slice(0,4), +fine.slice(5,7), -(quanti-1))[0];
  if(fino >= F.to)
    return {da: inizio, a: fine, parziale: false, etichetta: scelto.etichetta};
  // Il taglio confronta la CODA della data: per un mese il giorno ("25"), per
  // un anno il mese e il giorno ("08-25").
  const taglio = f.tipo === "mese" ? {da: 8, fino: fino.slice(8)}
                                   : {da: 5, fino: fino.slice(5)};
  return {da: inizio, a: fine, parziale: true, taglio,
          etichetta: nomeFinestra({parziale: true, a: fino}, f, scelto.chiave,
                                  scelto)};
}

// Le righe dentro a una finestra, taglio compreso.
function dentroFinestra(p, data){
  if(data < p.da || data > p.a) return false;
  return !p.taglio || data.slice(p.taglio.da) <= p.taglio.fino;
}

// Come si chiama la finestra, col ritaglio dichiarato: un numero di cui non si
// sa la provenienza non serve a niente.
function nomeFinestra(w, f, chiave, scelto){
  if(!w.parziale) return scelto.etichetta;
  const meseFine = +w.a.slice(5,7);
  if(f && f.tipo === "anno")
    return `${scelto.etichetta} (gen\u2013${MESI_BREVI[meseFine]})`;
  return `${scelto.etichetta} (1\u2013${+w.a.slice(8,10)})`;
}

function confronta(ora, prima, spesaMeglioSeScende, metro){
  if(!prima || Math.abs(prima) < 0.01) return null;
  const scarto = (ora - prima) / Math.abs(prima);
  if(Math.abs(scarto) < 0.005)
    return {verso:"pari", testo:`come ${metro}`};
  const meglio = spesaMeglioSeScende ? ora < prima : ora > prima;
  const segno = scarto > 0 ? "+" : "";
  return {verso: meglio ? "meglio" : "peggio",
          testo: `${segno}${Math.round(scarto*100)}% contro ${metro}`};
}

// --------------------------------------------------------------------------
// dove vanno i soldi: un riquadro solo, tre modi di guardarlo
// --------------------------------------------------------------------------
// Prima erano cinque: per natura, per merchant ricorrente, per categoria, per
// categoria anno su anno, per merchant. Le stesse righe misurate in modi
// diversi, senza niente che dicesse quale leggere per prima -- "Costi
// ricorrenti" e "Dove finiscono i soldi" condividevano meta' delle voci con
// numeri diversi, e "Voci per costo annuo" e "Aree anno su anno" avevano le
// righe identiche. Adesso la domanda e' una e la risposta pure; a cambiare e'
// solo da quale lato la si guarda.

const VISTE = [["area", "area"], ["negozio", "negozio"],
               ["ricorrenti", "solo i ricorrenti"]];

// Una spesa si scrive senza il meno: la colonna dice gia' che sono uscite, e
// il segno su ogni riga non aggiunge niente da leggere. Resta dove un valore
// puo' davvero essere positivo -- risparmio, rimborsi, differenze.
const spesa = v => euro(Math.abs(v));

// Quanto di una riga e' tuo. Nella lettura predefinita tutto: e' il costo
// pieno, ed e' quello che l'app ha sempre mostrato. Nella seconda lettura
// dipende da chi ha pagato e da quanto ne deve l'altro.
//
//   ho pagato io + meta' a lei    -> meta' e' mia
//   ho pagato io + tutto a lei    -> niente e' mio, l'ho solo anticipato
//   ha pagato lei + meta' a me    -> meta' e' mia
//   ha pagato lei + tutto a me    -> e' tutta mia
//   un saldo                      -> non e' una spesa, non pesa
function quotaDi(t){
  if(F.lettura !== "mia") return 1;
  const quota = t.Quota || "";
  if(!quota) return 1;
  if(quota === "saldo") return 0;
  const mia = t["Pagato da"] === "io"
    ? (quota === "tutto" ? 0 : 0.5)
    : (quota === "tutto" ? 1 : 0.5);
  return mia;
}

// Il confronto fra due periodi, a parole. Il segno da solo mentiva: in
// "differenza -3.996" il meno voleva dire "hai speso di PIU'", l'opposto di
// quello che chiunque legge, tanto che serviva una nota a pie' di pagina per
// spiegarlo. E una percentuale come -943% non e' informazione: quando lo
// scarto e' fuori scala si dice da dove a dove.
function scarto(prima, dopo){
  const a = Math.abs(prima), b = Math.abs(dopo);
  if(a < 1 && b < 1) return null;
  const d = b - a;
  if(Math.abs(d) < 1) return {testo:"uguale", verso:"pari"};
  const verso = d > 0 ? "peggio" : "meglio";
  if(a < 1) return {testo:`nuova: ${spesa(b)}`, verso};
  if(Math.abs(d / a) > 2)
    return {testo:`da ${spesa(a)} a ${spesa(b)}`, verso};
  return {testo:`${spesa(d)} in ${d > 0 ? "piu'" : "meno"}`, verso};
}

// Gli stessi mesi dei due anni. L'anno in corso e' quasi sempre incompleto:
// confrontarlo intero contro un anno pieno direbbe "hai speso il 97% in
// meno", che e' falso -- mancano undici mesi.
function anniAConfronto(out){
  const anni = uniq(out.map(t => (t.Data||"").slice(0,4))).sort().slice(-2);
  if(anni.length < 2) return null;
  const ultimo = out.filter(t => (t.Data||"").startsWith(anni[1]))
    .reduce((m,t) => Math.max(m, +(t.Data||"").slice(5,7) || 0), 0);
  const dentro = (t, y) => (t.Data||"").startsWith(y)
    && +(t.Data||"").slice(5,7) <= ultimo;
  return {anni, ultimo, dentro, parziale: ultimo < 12};
}

CARDS.dove = rows => {
  const vista = VISTE.some(v => v[0] === F.vista) ? F.vista : "area";
  const m = mesiPeriodo(rows);
  // Quando il periodo scelto e' gia' un anno (in corso o passato), "all'anno"
  // deve essere il totale vero di quell'anno, non una proiezione: su "Anno in
  // corso" con 8 mesi veri, media*12 inventava gli altri 4 che non sono
  // ancora successi. Sugli altri periodi (un mese, tre mesi...) la proiezione
  // resta quello che "all'anno" ha sempre voluto dire: a questo ritmo, un anno.
  const annoIntero = (formaDelPeriodo() || {}).tipo === "anno";
  const out = outflow(rows);
  // Il confronto anno su anno guarda sempre tutto lo storico (rispetto agli
  // altri filtri, non al periodo): filtrato a "Anno in corso" out ha un anno
  // solo dentro, e "gli ultimi due anni presenti in out" ne trovava uno --
  // la colonna restava vuota proprio quando il periodo la rendeva piu' utile.
  const fuoriPeriodo = outflow(filtered(false));
  const conf = anniAConfronto(fuoriPeriodo);
  const totale = Math.abs(sum(out)) || 1;

  const scelta = '<div class="viste">' + VISTE.map(([k, eti]) =>
    `<button data-vista="${k}" class="${k === vista ? "on" : ""}">`
    + `${esc(eti)}</button>`).join("") + "</div>";

  // Ogni riga sa dire il suo scarto d'anno: e' la colonna che prima viveva
  // in un riquadro tutto suo con le stesse identiche voci.
  const scartoDi = filtro => {
    if(!conf) return null;
    const a = sum(fuoriPeriodo.filter(t => filtro(t) && conf.dentro(t, conf.anni[0])));
    const b = sum(fuoriPeriodo.filter(t => filtro(t) && conf.dentro(t, conf.anni[1])));
    return scarto(a, b);
  };

  const riga = (nome, tot, n, opzioni) => {
    const o = opzioni || {};
    const s = o.scarto;
    const quota = Math.round(Math.abs(tot) / totale * 100);
    return `<tr class="${o.sub ? "sub" : "area"}">`
      + `<td class="q" style="--w:${Math.min(quota, 100)}%"><i></i>`
      + `<button class="link" data-drill="${o.drill}" `
      + `data-value="${esc(nome)}">${esc(nome)}</button>`
      + (o.nota ? ` <span class="dove">${esc(o.nota)}</span>` : "")
      + `</td>`
      + `<td>${spesa(tot/m)}</td><td>${spesa(annoIntero ? tot : tot/m*12)}</td>`
      + `<td class="dove">${quota}%</td>`
      + `<td class="${s ? "delta " + s.verso : "dove"}">`
      + `${s ? esc(s.testo) : "—"}</td>`
      + `<td class="dove">${n}</td></tr>`;
  };

  let corpo = "", dovePieHTML = "", intestazioni;
  if(vista === "area"){
    intestazioni = ["voce", "al mese", "all'anno", "quota",
                    conf ? `su ${conf.anni[0]}` : "su un anno fa", "tx"];
    // Due livelli in una tabella sola: l'area, e sotto le sue voci. Prima
    // "dentro Casa, cosa?" era un altro riquadro; qui e' la riga seguente.
    const aree = groupSum(out, "Categoria");
    for(const a of aree.slice(0, 12)){
      corpo += riga(a.name, a.total, a.n, {
        drill:"category", scarto:scartoDi(t => (t.Categoria||"") === a.name)});
      const figlie = groupSum(out.filter(t => (t.Categoria||"") === a.name),
                              "Sottocategoria")
        .filter(g => g.name && g.name !== "Senza categoria").slice(0, 5);
      for(const f of figlie)
        corpo += riga(f.name, f.total, f.n, {sub:true, drill:"sub",
          scarto: scartoDi(t => (t.Categoria||"") === a.name
                              && (t.Sottocategoria||"") === f.name)});
    }
    // La torta e' solo per mobile (vedi .bl-tx-wrap piu' sotto, gia' nascosto
    // sopra i 640px): stessi due livelli della tabella qui sopra, un giro
    // alla volta. Se la categoria scelta e' sparita (cambio di periodo) si
    // ricade sul primo livello invece di mostrare una torta vuota.
    const scelto = DOVE_PIE.categoria
      && aree.some(a => a.name === DOVE_PIE.categoria) ? DOVE_PIE.categoria : "";
    const datiTorta = scelto
      ? groupSum(out.filter(t => (t.Categoria||"") === scelto), "Sottocategoria")
          .filter(g => g.name && g.name !== "Senza categoria")
      : aree.slice(0, 12);
    // La voce scelta porta con se' lo stesso importo/quota che aveva come
    // fetta di primo livello: senza, il titolo dice solo IL NOME e per
    // sapere quanto pesa bisognerebbe tornare indietro e rileggerlo li'.
    const voceScelta = scelto && aree.find(a => a.name === scelto);
    const testa = scelto
      ? `<div class="dove-pie-head"><button class="link" data-dove-back="1">`
        + `&larr; categorie</button><b>${esc(scelto)}</b>`
        + (voceScelta ? `<span class="dove-pie-tot">${spesa(voceScelta.total/m)} `
          + `(${Math.round(Math.abs(voceScelta.total)/totale*100)}%)</span>` : "")
        + `</div>`
      : "";
    dovePieHTML = testa + pieChart(datiTorta, {clickable: !scelto})
      + pieLegend(datiTorta, m, {clickable: !scelto});
  } else {
    intestazioni = ["negozio", "al mese", "all'anno", "quota",
                    conf ? `su ${conf.anni[0]}` : "su un anno fa", "tx"];
    const mappa = new Map();
    for(const r of out){
      const k = r.Merchant; if(!k) continue;
      const cur = mappa.get(k) || {total:0, n:0, mesi:new Set()};
      // Stessa vista per negozio della tabella per area sopra: quanto ho
      // speso li', non quanto e' passato di li'. Stesso moltiplicatore.
      cur.total += r.Importo * quotaDi(r); cur.n++; cur.mesi.add(month(r));
      mappa.set(k, cur);
    }
    let elenco = [...mappa.entries()]
      .map(([name, v]) => ({name, ...v, mesi:v.mesi.size}));
    if(vista === "ricorrenti"){
      // Presenti in almeno sei mesi distinti: e' la lista da cui si parte per
      // disdette e cambi fornitore, non un negozio visto una volta sola.
      elenco = elenco.filter(v => v.mesi >= 6)
        .sort((a,b) => a.total/a.mesi - b.total/b.mesi);
    } else {
      elenco.sort((a,b) => a.total - b.total);
    }
    // m e' frazionario (l'ultimo mese si ritaglia ai giorni trascorsi):
    // senza arrotondare si leggeva "14/55.806451612903224 mesi" a schermo.
    const notaDi = v => vista === "ricorrenti"
      ? `${v.mesi}/${Math.round(m)} mesi` : "";
    for(const v of elenco.slice(0, 22))
      corpo += riga(v.name, v.total, v.n, {
        drill:"text", nota: notaDi(v),
        scarto: scartoDi(r => r.Merchant === v.name)});
    if(!elenco.length){
      corpo = `<tr><td colspan="6" class="dove">nessuna voce nel periodo `
            + `scelto</td></tr>`;
      dovePieHTML = `<p class="note">nessuna voce nel periodo scelto</p>`;
    } else {
      // Negozio/ricorrenti sono gia' piatti, un livello solo: la torta qui
      // non ha un secondo giro ne' un bottone indietro, e' la stessa lista
      // di sopra ridotta alle prime 12 (oltre, le fette non si leggono piu' e
      // la tavolozza colori ricomincerebbe a ripetersi).
      const datiTorta = elenco.slice(0, 12)
        .map(v => ({name: v.name, total: v.total, nota: notaDi(v)}));
      dovePieHTML = pieChart(datiTorta, {clickable:false})
        + pieLegend(datiTorta, m, {clickable:false});
    }
  }

  return scelta + '<div class="desktop-rows"><div class="scroll tab-dove">'
    + '<table><thead><tr>'
    + intestazioni.map((h, i) =>
        `<th class="${i ? "num" : ""}">${esc(h)}</th>`).join("")
    + "</tr></thead><tbody>" + corpo + "</tbody></table></div></div>"
    // tab-dove anche qui: e' la classe da cui .q i prende il filetto sotto
    // al nome, stesso disegno della tabella qui sopra.
    + `<div class="tab-dove bl-tx-wrap"><div class="bl-txlist">${dovePieHTML}</div></div>`;
};

// Le leve: cosa si puo' fare per abbassare ogni natura, e in quanto tempo.
// La leva e' il motivo per cui la natura esiste; senza, restano sei parole e
// il lettore indovina cosa farne.
CARDS.leve = rows => {
  const m = mesiPeriodo(rows);
  const items = groupSum(outflow(rows), "Natura")
    .filter(g => Math.abs(g.total/m) >= 1);
  return '<div class="leve">' + items.map(g => {
    const info = NATURA[g.name] || {};
    return `<div class="leva hit" data-drill="nature" data-value="${esc(g.name)}">`
      + `<i style="background:${NATURE_COLOR[g.name]||"#8a8a8a"}"></i>`
      // Nome e leva stanno in un figlio solo: erano due, e con tre colonne
      // il quarto figlio -- la cifra -- finiva su una riga tutta sua.
      + `<div><b>${esc(g.name)}</b>`
      // Leva e tempo sono la stessa frase: su tre righe la pila di destra
      // superava di quattrocento pixel la tabella accanto.
      + `<span>${esc(info.leva || "")}`
      + (info.quando && info.quando !== "—"
         ? ` &middot; ${esc(info.quando)}` : "") + `</span></div>`
      + `<u>${spesa(g.total/m)}</u></div>`;
  }).join("") + "</div>";
};

// Il confronto d'anno, ridotto alle voci che si sono davvero mosse. La
// tabella intera non serve piu': ogni riga di "Dove vanno i soldi" porta gia'
// il suo scarto. Qui restano solo i primi cinque, che sono la notizia.
CARDS.anno = rows => {
  // Vedi CARDS.dove: il confronto anno su anno ignora il periodo scelto per
  // lo stesso motivo, o "Anno in corso" gli lascerebbe un anno solo da
  // confrontare con se stesso.
  const fuoriPeriodo = outflow(filtered(false));
  const conf = anniAConfronto(fuoriPeriodo);
  if(!conf) return '<p class="note">serve piu\' di un anno di dati</p>';
  const MESI = ["","gen","feb","mar","apr","mag","giu","lug","ago","set","ott",
                "nov","dic"];
  const aree = uniq(fuoriPeriodo.map(t => t.Categoria || "Senza categoria"));
  const mosse = aree.map(n => {
    const filtro = t => (t.Categoria || "Senza categoria") === n;
    const a = sum(fuoriPeriodo.filter(t => filtro(t) && conf.dentro(t, conf.anni[0])));
    const b = sum(fuoriPeriodo.filter(t => filtro(t) && conf.dentro(t, conf.anni[1])));
    return {n, d: Math.abs(b) - Math.abs(a), s: scarto(a, b)};
  }).filter(r => r.s && r.s.verso !== "pari")
    .sort((x,y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 5);
  const totale = mosse.reduce((s,r) => s + r.d, 0);
  const finestra = conf.parziale ? `gen–${MESI[conf.ultimo]}` : "anno intero";
  return `<p class="note">${esc(finestra)}, ${esc(conf.anni[1])} contro `
    + `${esc(conf.anni[0])}: <b class="${totale > 0 ? "peggio" : "meglio"}">`
    + `${spesa(totale)} in ${totale > 0 ? "piu'" : "meno"}</b>.</p>`
    + '<div class="scarti">' + mosse.map(r =>
      `<div><button class="link" data-drill="category" `
      + `data-value="${esc(r.n)}">${esc(r.n)}</button>`
      + `<em class="delta ${r.s.verso}">${esc(r.s.testo)}</em></div>`).join("")
    + "</div>";
};

CARDS.andamento = () => {

  const tutti = uniq(spending(rows).map(month));

                                && (!ANDAMENTO.a || l <= ANDAMENTO.a));

    ? labels.filter(l => (!F.from || l >= F.from.slice(0,7))

    + `<label>al</label><input type="month" data-andamento="a" `
    + `value="${esc(ANDAMENTO.a)}" min="${esc(tutti[0]||"")}" max="${esc(tutti[tutti.length-1]||"")}">`
    + (ANDAMENTO.da || ANDAMENTO.a
       ? `<button class="link" data-andamento-reset="1">tutta la storia</button>` : "")
    + `</div>`;
  return range + lineChart(labels, series, dentro) + legend(series)
    + (dentro.length
       ? '<p class="note">La linea copre tutto lo storico: il periodo scelto e' + "'"
         + ' la parte in chiaro. Un mese da solo non fa un andamento.</p>'

const VIEWS = {};

// Il conto fra due persone. Positivo vuol dire che la controparte deve a te.
//
//   effetto = segno x quota x |importo|      segno = +1 se hai pagato tu
//
// Un "saldo" non e' una divisione: e' il rimborso stesso, e muove il conto per
// tutto l'importo nel verso opposto a chi lo manda.
function registro(rows, partita){
  const dal = (partita && partita.dal) || "";
  const dentro = rows.filter(t => t.Quota && (!dal || (t.Data||"") >= dal))
    .sort((a,b) => (a.Data||"").localeCompare(b.Data||""));
  let saldo = (partita && partita.saldo) || 0;
  const righe = dentro.map(t => {
    const segno = t["Pagato da"] === "io" ? 1 : -1;
    // Un "saldo" non e' una quota di spesa: e' il rimborso stesso. Chi lo
    // manda non conta (se arrivano 500 sul tuo conto lei ti deve 500 in
    // meno, li mandi tu o li giri lei), quindi qui non si guarda "Pagato
    // da" ne' quotaDi() (Task 5): quotaDi risponde "quanto e' mio" per il
    // cruscotto, il registro e' sempre in euro interi -- quel che deve la
    // controparte e' quel che deve, a prescindere da come si legge il
    // cruscotto.
    const effetto = t.Quota === "saldo"
      ? -t.Importo
      : segno * (t.Quota === "tutto" ? 1 : 0.5) * Math.abs(t.Importo);
    saldo = Math.round((saldo + effetto) * 100) / 100;
    return {...t, effetto, saldo};
  });
  return {righe, saldo, dal,
          controparte: (partita && partita.controparte) || "la controparte"};
}

// Il pattern per una regola sul negozio di questa riga.
//
// Le parole si uniscono con .* perche' il nome del negozio salta le parole
// vuote: "Zoom Progress" non compare da nessuna parte dentro "ZOOM IN
// PROGRESS SRL". E se il nome viene da merchant.csv puo' non somigliare
// affatto alla descrizione - "NordVPN" nasce da "Paypal Nordsec" - quindi
// quando non aggancia niente si ripiega sulle parole della descrizione.
const VUOTE = new Set(["del","della","di","da","il","la","le","lo","per","con",
  "pagamento","carta","contactless","mastercard","visa","addebito","srl","spa",
  "sas","snc","the","and"]);

function patternNegozio(merchant, descrizione){
  const fuggi = w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const unisci = parole => parole.map(fuggi).join(".*");
  // La prova e' contro QUESTA descrizione, non contro tutte: un pattern che
  // aggancia qualche altra riga ma non quella su cui hai premuto produce una
  // regola che sembra buona e non fa niente. Capitava con "Iper Rossetto",
  // che su una riga scritta solo "Rossetto" non combacia.
  const regge = p => {
    try { return p && new RegExp(p, "i").test(descrizione || ""); }
    catch (e) { return false; }
  };

  const daMerchant = unisci((merchant || "").trim().split(/\s+/).filter(Boolean));
  if(regge(daMerchant)) return daMerchant;

  const parole = String(descrizione || "").split(/[^\p{L}\p{N}]+/u)
    .filter(w => w.length > 2 && !VUOTE.has(w.toLowerCase()) && !/^\d+$/.test(w));
  const daDescrizione = unisci(parole.slice(0, 2));
  return regge(daDescrizione) ? daDescrizione : daMerchant;
}

function categoryOptions(current){
  const aree = uniq(S.categories.map(c => c.categoria));

      + `${esc(c.sottocategoria || c.categoria)}</option>`).join("");
    return `<optgroup label="${esc(a)}">${voci}</optgroup>`;
  }).join("");
}

// La barra sopra la tabella, viva solo quando c'e' qualcosa di selezionato.
// Ogni campo e' per conto suo: lasciato vuoto (o su "non cambiare") non
// tocca quella colonna, cosi' si puo' applicare solo la categoria, solo il
// conto, solo un campo di testo, o una combinazione. opts.conto/opts.quota/
// opts.testo mostrano i controlli in piu' che ha senso offrire solo dove
// quei campi si vedono anche riga per riga (in Da rivedere la tabella non
// ha conto/quota/data/descrizione/merchant/importo). opts.extra sono i
// pulsanti in piu' di questa scheda (Da rivedere ha "confermo selezionate").
//
// I campi di testo (data, descrizione, merchant, importo) scrivono lo
// STESSO valore su ogni riga selezionata: utili per correggere un errore
// identico ripetuto (una data di importazione sbagliata su un lotto, un

// che invece dovrebbero restare diverse fra loro -- da qui la conferma
// prima di applicarli (vedi d.bulkApply).
function bulkBar(opts){
  if(!SELECTED.size) return "";
  opts = opts || {};
  const contoSel = opts.conto
    ? `<select id="bulk-conto"><option value="">non cambiare conto</option>`
      + uniq(S.accounts).sort().map(a => `<option>${esc(a)}</option>`).join("")
      + "</select>"
    : "";
  const quotaSel = opts.quota
    ? `<select id="bulk-chi"><option value="">non cambiare pagato da</option>`
      + ["io","lei"].map(v => `<option value="${v}">`
          + `${v==="io"?"Fabio":esc((S.partita&&S.partita.controparte)||"lei")}</option>`).join("")
      + `</select><select id="bulk-quota"><option value="">non cambiare quota</option>`
      + ["meta","tutto","saldo"].map(v => `<option value="${v}">${v}</option>`).join("")
      + "</select>"
    : "";
  const testoSel = opts.testo
    ? `<input type="date" id="bulk-data" title="data: lascia vuoto per non cambiarla">`
      + `<input id="bulk-descrizione" placeholder="non cambiare descrizione" style="width:150px">`
      + `<input id="bulk-merchant" placeholder="non cambiare merchant" style="width:120px">`
      + `<input id="bulk-importo" placeholder="non cambiare importo" style="width:90px">`
    : "";
  const catSel = `<select id="bulk-cat"><option value="">non cambiare categoria</option>`
    + categoryOptions("") + "</select>";
  // Stesso ordine delle colonne in tabella (data, descrizione, merchant,
  // importo, conto, categoria, pagato da/quota): trovare il campo giusto
  // nella barra non deve richiedere di indovinare un ordine diverso.
  return `<div class="bulk"><span class="mini">${SELECTED.size} selezionate</span>`
    + testoSel + contoSel + catSel + quotaSel
    + `<button class="link" data-bulk-apply="1">applica</button>`
    + (opts.extra || "")
    + `<button class="link" data-bulk-clear="1">annulla selezione</button></div>`;
}

// Chiave di ordinamento per colonna: la categoria ordina su area+sottocategoria
// unite, cosi' "Casa > Arredamento" e "Casa > Condominio" restano vicine.
const SORT_KEYS = {
  Data: t => t.Data || "", Descrizione: t => t.Descrizione || "",
  Merchant: t => t.Merchant || "", Importo: t => t.Importo || 0,
  Conto: t => t.Conto || "", Natura: t => t.Natura || "",
  Categoria: t => whole(t), "Pagato da": t => t["Pagato da"] || "",
  Quota: t => t.Quota || "", Origine: t => t.Origine || "",
  // Solo per "Con Michela": effetto e saldo non sono campi di una
  // transazione, li calcola registro() riga per riga.
  effetto: t => t.effetto || 0, saldo: t => t.saldo || 0};

function sortedRowsBy(stato, rows){
  const key = SORT_KEYS[stato.col];
  if(!key) return rows;
  return [...rows].sort((a,b) => {
    const x = key(a), y = key(b);
    return (x < y ? -1 : x > y ? 1 : 0) * stato.dir;
  });
}
const sortedRows = rows => sortedRowsBy(SORT, rows);

function sortHeaderBy(stato, attr, label, col){
  const attivo = stato.col === col;
  return `<button class="link" data-${attr}="${col}">${esc(label)}`
    + (attivo ? (stato.dir === 1 ? " ↑" : " ↓") : "") + "</button>";
}
const sortHeader = (label, col) => sortHeaderBy(SORT, "sort", label, col);
const sortHeaderMichela = (label, col) =>
  sortHeaderBy(SORT_MICHELA, "sort-michela", label, col);

// disegno
// --------------------------------------------------------------------------
// #tablist vive dentro la spalla su desktop/tablet, in fondo a .telaio da
// smartphone (sotto .lato, cosi' un layout a colonna flessibile lo tiene
// ancorato al vero fondo dello schermo -- niente position:fixed, che su
// Safari iOS si sfasa rispetto alla barra degli indirizzi che si apre e si
// chiude da sola, lasciando intravedere righe della tabella sotto la tab
// bar). CSS da solo non puo' spostare un elemento fra due genitori diversi:
// serve JS. typeof window (non window.matchMedia diretto) non lancia mai,
// nemmeno quando window non esiste affatto -- sotto Node, test_app.js gira
// senza window, e questa funzione deve restare innocua li', non solo qui.
function posizionaTablist(){
  if(typeof window === "undefined" || !window.matchMedia) return;
  const tablist = el("tablist");
  const telaio = document.querySelector(".telaio");
  const spalla = document.querySelector(".spalla");
  if(!tablist || !telaio || !spalla) return;
  const mobile = window.matchMedia("(max-width:640px)").matches;
  const inSpalla = tablist.parentElement === spalla;
  if(mobile && inSpalla){
    telaio.appendChild(tablist);
  } else if(!mobile && !inSpalla){
    spalla.insertBefore(tablist, spalla.querySelector(".grow"));
  }
}

function render(){
  if(!S) return;
  posizionaTablist();
  // Le sezioni, con il lavoro arretrato scritto sopra a "Da rivedere": una
  // scheda che nasconde il proprio arretrato non viene mai aperta.
  const arretrato = ((S && S.transactions) || [])
    .filter(x => (x.Confidenza ?? 1) < 1).length;
  el("tablist").innerHTML = TABS.map(([id,label]) =>
    `<button data-tab="${id}" class="${TAB===id?"on":""}">${TAB_ICON[id]||""}${esc(label)}`
    + (id === "revisione" && arretrato
       ? `<span class="conta">${arretrato}</span>` : "")
    + "</button>").join("");
  // La tab bar in basso da smartphone ha 5 posti, TABS ne ha 7: le tre meno
  // aperte finiscono in un <details> a parte invece che nel loop sopra, cosi'
  // il loop principale (e i suoi 7 bottoni desktop) non cambia di una virgola.
  // Sopra i 640px .tab-more resta display:none da CSS e questo blocco e' morto
  // peso invisibile, non un secondo comportamento da mantenere allineato.
  el("tablist").innerHTML += `<details class="tab-more"><summary>`
    + `${TAB_ICON.altro}Altro</summary><div class="tab-more-list">`
    + TAB_CODA.map(([id,label]) => `<button data-tab="${id}" `
      + `class="${TAB===id?"on":""}">${esc(label)}</button>`).join("")
    + "</div></details>";

  const senzaFiltri = TAB==="categorie" || TAB==="regole" || TAB==="componi";
  el("filters").classList.toggle("hide", senzaFiltri);
  el("periodo").classList.toggle("hide", senzaFiltri);
  el("barra").classList.toggle("hide", senzaFiltri);
  el("filter-chip").classList.toggle("hide", senzaFiltri);

  renderQuick();
  renderConfronti();
  // Due letture degli stessi euro: quanto e' costato, e quanto e' tuo.
  el("f-lettura").innerHTML = [["", "tutto"], ["mia", "la mia quota"]]
    .map(([k, eti]) => `<button data-lettura="${k}" `
      + `class="${(F.lettura||"") === k ? "on" : ""}">${esc(eti)}</button>`)
    .join("");
  fillSelect("f-account", S.accounts, F.account, "tutti");
  fillSelect("f-nature", S.nature, F.nature, "tutte");
  const aree = uniq(S.categories.map(c => c.categoria)).filter(Boolean).sort();
  fillSelect("f-category", aree, F.category, "tutte");
  const sotto = uniq(S.categories
    .filter(c => !F.category || c.categoria === F.category)
    .map(c => c.sottocategoria)).filter(Boolean).sort();
  fillSelect("f-sub", sotto, F.sub, "tutte");
  el("f-from").value = F.from; el("f-to").value = F.to; el("f-text").value = F.text;
  // Il chip riassuntivo che apre il pannello filtri da smartphone (vedi CSS
  // sotto i 640px): stesso F che la barra vera legge, nessuna copia.
  const chipPeriodo = F.from && F.to ? `${F.from} → ${F.to}`
    : F.from ? `dal ${F.from}` : F.to ? `al ${F.to}` : "tutto il periodo";
  el("filter-chip-label").textContent =
    `${chipPeriodo} · ${F.lettura === "mia" ? "la mia quota" : "tutto"}`;

  const ETICHETTE = {from:"dal", to:"al", account:"conto", nature:"natura",
                     category:"categoria", sub:"sotto", text:"cerca"};
  // I crumbs rispondono a "quali righe sto guardando": confronto, vista e
  // lettura non tolgono ne' aggiungono righe, cambiano solo come le leggo, e
  // hanno gia' il loro pulsante acceso altrove. Mescolarli coi filtri veri
  // farebbe sembrare il toggle un filtro sui dati, che non e'.
  el("crumbs").innerHTML = Object.entries(F)
    .filter(([k,v]) => v && k !== "confronto" && k !== "vista" && k !== "lettura")
    .map(([k,v]) => `<span class="chip" data-clear="${k}">`
                    + `${esc(ETICHETTE[k]||k)}: ${esc(v)} ×</span>`)
    .join("");

  el("error").classList.toggle("hide", !S.error);
  if(S.error) el("error").textContent = S.error + "\n\n" + (S.log||[]).slice(-12).join("\n");

  const rows = filtered();
  const attesa = S.pending || [];
  // Il sorvegliante avvisa e basta: se non lo dicesse qui, un export
  // depositato e mai caricato resterebbe invisibile. La frase su
  // sorgente/copertura periodo (coverage()) non si mostra piu' qui.
  el("source").textContent = attesa.length
    ? `${attesa.length} export in attesa: ${attesa.slice(0,3).join(", ")}`
    : "";

  // Gli indicatori stanno nella barra, e solo sulla dashboard: sulle altre
  // schede parlerebbero di numeri che non si stanno guardando.
  const mostraKpi = TAB === "dashboard" && !senzaFiltri;
  el("kpibar").classList.toggle("hide", !mostraKpi);
  el("kpibar").innerHTML = mostraKpi ? indicatori(rows) : "";
  // Senza un periodo scelto i numeri sono la media su tutta la storia, e
  // niente lo diceva: si apriva l'app e non era chiaro a cosa si riferissero.
  const senzaPeriodo = mostraKpi && !F.from && !F.to;
  el("periodo-nota").classList.toggle("hide", !senzaPeriodo);
  el("periodo-nota").textContent = "";
  if(senzaPeriodo){
    const mesi_ = uniq(spending(S.transactions).map(month)).sort();
    el("periodo-nota").textContent = mesi_.length
      ? `Nessun periodo scelto: qui sotto e' la media su tutta la storia, `
        + `${mesi_.length} mesi da ${mesi_[0]} a ${mesi_[mesi_.length-1]}.`
      : "Nessun periodo scelto, e nessuna transazione in archivio.";
  }

  el("view").innerHTML = VIEWS[TAB](rows);
}

function fillSelect(id, values, current, blank){
  el(id).innerHTML = `<option value="">${blank}</option>`
    + values.map(v => `<option ${v===current?"selected":""}>${esc(v)}</option>`).join("");
}

// Quante azioni scatenate da un click sono in volo (post()+reload()): un
// contatore, non un booleano, perche' un'applicazione in blocco puo' fare
// piu' post() di fila prima di un solo reload() finale, e non deve
// spegnere il "sto facendo qualcosa" a meta' strada. Vedi gestisciClick().
let azioniInCorso = 0;

function setStatus(){
  // S.running e' il giro pesante (Ricarica/Carica dati, la pipeline intera
  // da capo); azioniInCorso e' una singola azione (elimina, conferma,
  // nuova...). Stesso pallino per entrambi -- e' la stessa cosa vista da
  // chi guarda: "non toccare niente, sto ancora scrivendo" -- solo il
  // testo distingue quale dei due sta succedendo.
  const running = !!(S && S.running);
  const inAzione = azioniInCorso > 0;
  const busy = running || inAzione;
  el("btn-run").disabled = busy;
  // "Carica dati" compare solo quando c'e' davvero qualcosa da caricare, col
  // numero dentro: un pulsante sempre acceso non direbbe niente.
  const attesa = (S && S.pending) || [];
  const load = el("btn-load");
  load.classList.toggle("hide", !attesa.length);
  load.disabled = busy;
  load.className = attesa.length ? "primary" : "hide";
  load.textContent = attesa.length === 1
    ? "Carica 1 export" : `Carica ${attesa.length} export`;
  load.title = attesa.join("\n");
  const dot = busy ? "busy" : (S && S.error ? "err" : "");
  el("status").innerHTML = `<span class="dot ${dot}"></span>`
    + (running ? "elaboro…" : inAzione ? "un attimo…"
       : S && S.error ? "errore"
       : S ? `${S.transactions.length} transazioni` : "…");
}

// --------------------------------------------------------------------------
// eventi
// --------------------------------------------------------------------------
// Solo per creare/eliminare una transazione (vedi d.nuova/d.elimina): le
// altre azioni restano col pallino soltanto, non bloccante. Un try/finally
// dentro al singolo ramo basta qui perche' li' non c'e' nessun "return
// promiseAsincrona()" prima -- e' tutto await in fila, non la trappola
// vista sopra per handleRule().
// opts.barra: mostra la barra indeterminata invece dell'anello, per un
// giro che sappiamo lungo (leggere uno scontrino) invece che un attimo.
// opts.testo: sostituisce "un attimo…", per dire cosa sta succedendo.
function mostraOverlay(opts){
  opts = opts || {};
  el("overlay-testo").textContent = opts.testo || "un attimo…";
  el("overlay-spinner").classList.toggle("hide", !!opts.barra);
  el("overlay-barra").classList.toggle("hide", !opts.barra);
  el("overlay-azione").classList.remove("hide");
}
function nascondiOverlay(){ el("overlay-azione").classList.add("hide"); }

// Il fade di .bl-field/.bl-rowbtns all'apertura di una card (transazione o
// riga di "dove vanno i soldi", vedi .bl-tx .body.corpo-apre in CSS).
// "toggle" su <details> non risale (bubbles:false per specifica): un
// document.addEventListener normale non lo vedrebbe mai. In fase di
// cattura (il terzo argomento "true") l'evento si intercetta comunque,
// scendendo da document verso l'elemento -- non serve che risalga.
document.addEventListener("toggle", ev => {
  const details = ev.target;
  if(!details.open || !details.classList || !details.classList.contains("bl-tx")) return;
  const body = details.querySelector(".body");
  if(!body) return;
  body.classList.remove("corpo-apre");
  void body.offsetWidth;
  body.classList.add("corpo-apre");
}, true);

// Spacchettato dal listener sotto per poter avvolgere l'INTERA chiamata
// (comprese le sue chiamate innestate, es. handleRule) in un contatore di
// "sto facendo qualcosa" -- vedi il listener per il perche' e' un
// .finally() sulla promise e non un try/finally qui dentro.
async function gestisciClick(t){
  const d = t.dataset;

  if(d.andamentoReset){ ANDAMENTO.da = ""; ANDAMENTO.a = ""; render(); return; }
  if(d.more){ PAGE.n++; render(); return; }
  if(d.sort){
    // Ripremere la stessa colonna inverte il verso, come un foglio di calcolo.
    SORT.dir = SORT.col === d.sort ? -SORT.dir : -1;
    SORT.col = d.sort;
    render(); return;
  }
  if(d.sortMichela){
    SORT_MICHELA.dir = SORT_MICHELA.col === d.sortMichela ? -SORT_MICHELA.dir : -1;
    SORT_MICHELA.col = d.sortMichela;
    render(); return;
  }
  // Una spunta lasciata accesa su una scheda diversa da quella in cui e'
  // nata confonderebbe piu' di quanto risparmi: cambiare scheda la svuota.
  if(d.tab){
    TAB = d.tab; SELECTED.clear(); render();
    // Un fade leggero SOLO qui, al cambio scheda vero: render() lo chiamano
    // anche il poll silenzioso e ogni azione, e riaccenderlo li' sarebbe un
    // tremolio, non un movimento voluto. classList.remove+add da soli non
    // rigiocano un'animazione gia' assegnata: l'offsetWidth in mezzo forza
    // il browser a "dimenticare" lo stato prima di riattaccarla.
    const v = el("view");
    v.classList.remove("view-enter");
    void v.offsetWidth;
    v.classList.add("view-enter");
    return;
  }
  if(d.clear){ F[d.clear] = ""; render(); return; }
  if(d.confronto !== undefined){ F.confronto = d.confronto; render(); return; }
  if(d.vista !== undefined){ F.vista = d.vista; render(); return; }
  if(d.dovePie !== undefined){ DOVE_PIE.categoria = d.dovePie; render(); return; }
  if(d.doveBack){ DOVE_PIE.categoria = ""; render(); return; }
  if(d.lettura !== undefined){ F.lettura = d.lettura; render(); return; }
  if(d.quick !== undefined){
    const [from, to] = QUICK[+d.quick][1]();
    if(!from) return;
    // Ripremere lo stesso periodo lo toglie, cosi' il pulsante fa da
    // interruttore e non serve andare ad "azzera" per tornare a tutto.
    const on = F.from === from && F.to === to;
    F.from = on ? "" : from;
    F.to = on ? "" : to;
    render(); return;
  }
  if(d.drill){
    const map = {nature:"nature", category:"category", sub:"sub", text:"text"};
    F[map[d.drill]] = d.value;
    // Cambiare area azzera la sottocategoria: quella di prima appartiene a
    // un'altra area e lascerebbe la tabella vuota.
    if(d.drill === "category") F.sub = "";
    render(); return;
  }
  if(d.up){ F.category = ""; F.sub = ""; render(); return; }
  if(d.move !== undefined){
    const i = +d.move, j = i + (+d.dir);
    if(j<0 || j>=S.layout.length) return;
    [S.layout[i], S.layout[j]] = [S.layout[j], S.layout[i]];
    await post("/api/layout", {layout:S.layout}); render(); return;
  }
  if(d.catRename || d.catMerge){
    const name = d.catRename || d.catMerge;
    const target = await domanda(d.catRename ? `Nuovo nome per "${name}":`
                                      : `Unisci "${name}" dentro:`, name);
    if(!target || target === name) return;
    await post("/api/categories", {azione:d.catRename?"rinomina":"unisci",
                                   nome:name, destinazione:target});
    return reload();
  }
  if(d.catDrop){
    if(!await chiedi(`Non imparare piu' dalla categoria "${d.catDrop}"?`)) return;
    await post("/api/categories", {azione:"elimina", nome:d.catDrop});
    return reload();
  }
  if(d.nuova){
    // Prima erano quattro domande in fila, una alla volta: lente, e non si
    // torna indietro a correggere la precedente senza ricominciare da capo.
    // Ora la riga nasce subito con dei segnaposto e si corregge sul posto,
    // in tabella, con lo stesso salvataggio-poi-ridisegno-in-pausa di ogni
    // altra riga: e' la stessa modifica per campo di sempre, solo senza il
    // giro dei modali prima di vederla.
    mostraOverlay();
    let risposta;
    try {
      risposta = await post("/api/nuova", {data: today().iso,
        descrizione: "nuova transazione", importo: "0", conto: "A mano"});
      await reload();
    } finally { nascondiOverlay(); }
    // L'id vero (risposta.id) invece di cercare il segnaposto per testo:
    // due creazioni di fila, prima di aver corretto la prima, si
    // confondevano fra loro (vedi apriTransazione()).
    if(risposta && risposta.id) apriTransazione(risposta.id);
    return;
  }
  if(d.escludi){
    const motivo = (await domanda("Perche' questa riga non deve comparire?", "") || "").trim();
    // Le sole spaziature passavano di qui e venivano scartate dal server: la
    // riga restava, ma la pagina si ricaricava come se l'esclusione fosse
    // andata a buon fine. Meglio non chiedere niente che mentire.
    if(!motivo) return;
    await post("/api/transaction", {id:d.escludi, escludi:motivo});
    return reload();
  }
  if(d.resetTx){
    await post("/api/transaction", {id:d.resetTx, azzera:true});
    return reload();
  }
  if(d.elimina){
    // L'overlay parte DOPO la conferma, non da subito: prima e' l'utente
    // che sta ancora decidendo, non l'app che sta lavorando -- bloccare lo
    // schermo mentre si aspetta un si'/no sarebbe scambiare una domanda
    // per un caricamento.
    const ok = await chiedi("Eliminare questa transazione? Scritta a mano, "
      + "non si puo' recuperare da nessun estratto conto.");
    if(!ok) return;
    mostraOverlay();
    try {
      await post("/api/transaction", {id:d.elimina, elimina:true});
      await reload();
    } finally { nascondiOverlay(); }
    return;
  }
  if(d.conferma){
    // "Va bene cosi'": fissa la categoria che c'e' gia'. La riga esce
    // dalla coda perche' la confidenza sale a 1, e nei totali non cambia
    // niente: quella categoria era gia' in vigore.
    if(!d.cat) return avvisa('Questa riga non ha ancora una categoria: scegline una nel menu, oppure usa \"regola\".');
    await post("/api/transaction", {id:d.conferma, categoria:d.cat});
    return reload();
  }
  if(d.bulkApply){
    // Ogni campo lasciato vuoto (o su "non cambiare") non partecipa: si puo'
    // applicare solo la categoria, solo il conto, solo chi ha pagato, solo
    // un campo di testo, o una combinazione.
    const cat = (el("bulk-cat") || {}).value || "";
    const conto = (el("bulk-conto") || {}).value || "";
    const chi = (el("bulk-chi") || {}).value || "";
    const quota = (el("bulk-quota") || {}).value || "";
    const data = (el("bulk-data") || {}).value || "";
    const descrizione = (el("bulk-descrizione") || {}).value.trim();
    const merchant = (el("bulk-merchant") || {}).value.trim();
    const importo = (el("bulk-importo") || {}).value.trim();
    const campi = {};
    if(cat) campi.categoria = cat;
    if(conto) campi.conto = conto;
    if(data) campi.data = data;
    if(descrizione) campi.descrizione = descrizione;
    if(merchant) campi.merchant = merchant;
    if(importo) campi.importo = importo;
    // "Pagato da" e "quota" vanno per forza in una richiesta a parte: il
    // server tratta quel payload come un'altra cosa e non guarda categoria/
    // conto/testo quando li vede (set_transaction, ramo quota/pagato_da).
    // Servono entrambi insieme, come nel menu per riga: meta' di una coppia
    // non dice da che parte va il debito.
    const conQuota = !!(chi && quota);
    if(!Object.keys(campi).length && !conQuota)
      return avvisa("Scegli almeno un campo da applicare.");
    // Data/descrizione/merchant/importo scrivono lo STESSO valore su tutte
    // le selezionate: utile per un errore identico ripetuto, pericoloso se
    // e' un errore di selezione. Una conferma in piu' solo per questi campi
    // e solo con piu' di una riga, dove uno sbaglio pesa di piu'.
    const testoInGioco = ["data","descrizione","merchant","importo"]
      .some(k => campi[k] !== undefined);
    if(testoInGioco && SELECTED.size > 1){
      const ok = await chiedi(`Stai per scrivere lo stesso `
        + `${["data","descrizione","merchant","importo"].filter(k => campi[k]!==undefined).join("/")} `
        + `su ${SELECTED.size} transazioni diverse. Continuare?`);
      if(!ok) return;
    }
    // Una riga alla volta: due scritture insieme sullo stesso file
    // rischierebbero di perdersi a vicenda. Un solo reload() alla fine, non
    // uno per riga.
    t.disabled = true; t.textContent = "applico…";
    for(const id of SELECTED){
      if(Object.keys(campi).length) await post("/api/transaction", {id, ...campi});
      if(conQuota) await post("/api/transaction", {id, pagato_da:chi, quota});
    }
    SELECTED.clear();
    return reload();
  }
  if(d.bulkConfirm){
    // Come "confermo" singolo, ma su tutte le selezionate: fissa la
    // categoria gia' proposta per ciascuna, non ne sceglie una comune.
    const senzaCategoria = [...SELECTED].filter(id => {
      const riga = (S.transactions || []).find(x => x.ID === id);
      return riga && !whole(riga);
    });
    if(senzaCategoria.length)
      return avvisa(`${senzaCategoria.length} delle selezionate non hanno `
        + 'ancora una categoria: scegline una nel menu per quelle, oppure '
        + 'togli la spunta.');
    t.disabled = true; t.textContent = "confermo…";
    for(const id of SELECTED){
      const riga = (S.transactions || []).find(x => x.ID === id);
      await post("/api/transaction", {id, categoria:whole(riga)});
    }
    SELECTED.clear();
    return reload();
  }
  if(d.bulkClear){ SELECTED.clear(); render(); return; }
  if(d.rule){
    // Il pulsante si basta da solo: la categoria la chiede qui dentro. Prima
    // la leggeva dal menu accanto, ma scegliere li' salva subito e la riga
    // esce dalla coda portandosi via il pulsante: le due cose non si potevano
    // fare tutte e due.
    //
    // Il nome del negozio finisce dentro un'espressione regolare, dove punti e
    // parentesi hanno un significato: vanno neutralizzati.
    const proposta = (S.transactions.find(t => t.ID === d.id) || {});
    const nudo = patternNegozio(d.rule, proposta.Descrizione);
    const cerca = new RegExp(nudo, "i");
    // Il conto si fa qui, sui dati che il browser ha gia': cosi' il numero si
    // aggiorna mentre scegli, senza un giro al server per ogni tentativo.
    const colpite = S.transactions.filter(t => cerca.test(t.Descrizione || ""));
    // La voce senza nome e' il mucchio delle righe non categorizzate: e'
    // giusto vederla nell'elenco delle categorie, non e' una destinazione.
    const categorie = S.categories.map(c => c.nome).filter(Boolean);
    // Senza una proposta non si preseleziona niente: la prima in ordine
    // alfabetico e' "Affitti incassati", e un OK distratto archivierebbe una
    // spesa come un incasso.
    const SCEGLI = "— scegli una categoria —";
    const gia = whole(proposta);
    const scelte = gia ? categorie : [SCEGLI].concat(categorie);
    const valore = await modale({
      testo: `Ogni descrizione che contiene "${d.rule}" andra' in:`,
      valore: gia || SCEGLI, scelte, annullabile: true,
      ok: "Crea la regola",
      aggiorna: v => `${colpite.length} transazioni combaciano`
        + (v === SCEGLI ? "" : `, di cui `
           + `${colpite.filter(t => whole(t) !== v).length} cambierebbero categoria`)
        + `. In totale ${euro(sommaPiena(colpite))}. `
        + `La regola va sopra tutte le altre, quindi vince su di loro.`,
    });
    if(!valore || valore === SCEGLI) return;
    await post("/api/rules", {tipo:"regola", pattern: "(?i)" + nudo,
                              valore, posizione:0});
    return reload();
  }
  if(d.ruleSave || d.ruleDel || d.ruleTest || d.newSave){
    return handleRule(d);
  }
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-drill],[data-clear],[data-move],[data-quick],"
    + "[data-cat-rename],[data-cat-merge],[data-cat-drop],[data-rule-save],"
    + "[data-rule-del],[data-rule-test],[data-new-save],[data-reset-tx],[data-escludi],[data-rule],"
    + "[data-up],[data-conferma],[data-confronto],[data-vista],[data-nuova],[data-lettura],[data-sort],"
    + "[data-sort-michela],"
    + "[data-more],[data-andamento-reset],[data-bulk-apply],[data-bulk-confirm],"
    + "[data-bulk-clear],[data-elimina],[data-dove-pie],[data-dove-back]");
  if(!t) return;
  // .finally() sulla promise, non try/finally dentro gestisciClick: un
  // "return handleRule(d)" dentro un try fa scattare il finally non appena
  // handleRule() e' CHIAMATA, non quando la sua promise si risolve. Qui
  // invece si aspetta la fine vera, comprese le chiamate innestate.
  azioniInCorso++; setStatus();
  gestisciClick(t).finally(() => { azioniInCorso--; setStatus(); });
});

async function handleRule(d){
  const kind = d.ruleSave || d.ruleDel || d.ruleTest || d.newSave;
  const isMerchant = kind === "merchant";
  const type = isMerchant ? "merchant" : "regola";
  if(d.newSave){
    const p = document.querySelector(`[data-new-pattern="${kind}"]`).value.trim();
    const v = document.querySelector(`[data-new-value="${kind}"]`).value.trim();
    if(!p || !v) return avvisa("servono pattern e valore");
    await post("/api/rules", {tipo:type, pattern:p, valore:v});
    return reload();
  }
  const i = d.i;
  const p = document.querySelector(`[data-rule-pattern="${kind}"][data-i="${i}"]`).value.trim();
  const v = document.querySelector(`[data-rule-value="${kind}"][data-i="${i}"]`).value.trim();
  const list = isMerchant ? S.merchants : S.rules;
  const before = (list[i]||{}).pattern || p;

  if(d.ruleTest){
    const r = await post("/api/rules/preview", {pattern:p, valore:v});
    const box = el("preview-"+kind);
    box.innerHTML = r.errore ? `<p class="err">${esc(r.errore)}</p>`
      : `<p class="note">${r.n} transazioni combaciano, ${r.cambierebbero} `
        + `cambierebbero categoria, ${euro(r.totale)} in totale.</p>`
        + tableHTML(["data","descrizione","importo","categoria attuale"],
            (r.esempi||[]).map(e => [esc(e.Data), esc((e.Descrizione||"").slice(0,60)),
              euro(e.Importo),
              esc(e["Categoria intera"] || e.Categoria || "—")]), [2]);
    return;
  }
  await post("/api/rules", {tipo:type, pattern:p, valore:v,
                            pattern_precedente:before,
                            elimina: !!d.ruleDel});
  reload();
}

// Meta' quota non e' uno stato che l'app sostiene: "meta'" senza sapere chi
// ha pagato non dice da che parte va il debito, e il server la rifiuta a
// ragione (vedi set_transaction in server.py). Percio' svuotare UN SOLO
// menu deve svuotare la coppia: e' l'unico modo per cui la lapide "niente"
// diventi raggiungibile dai due menu invece che solo dall'API diretta --
// altrimenti il POST porta una meta' che il server scarta in silenzio, e la
// quota vecchia (dal derivato, quando l'export e' sparito) resta li'.
function quotaPayload(chi, q, aveva){
  if(chi && q) return {pagato_da: chi, quota: q};
  // Mezza quota non e' uno stato: svuotare un menu vuol dire cancellare la
  // coppia. Ma se la riga non aveva niente da cancellare, non c'e' niente da
  // decidere e non si scrive la lapide: quote.csv si legge a occhio, e una
  // riga per una decisione che nessuno ha preso e' solo rumore.
  return aveva ? {pagato_da: "", quota: ""} : null;
}

// Ogni campo si salva da solo appena lo lasci, ma un `reload()` e' un
// ridisegno intero della tabella: farlo dopo OGNI campo strappa via di sotto
// alle dita l'input successivo che si sta per toccare sulla stessa riga
// (categoria, poi merchant, poi descrizione...). Il salvataggio resta
// immediato -- e' gia' sul server quando la funzione torna -- solo il
// ridisegno aspetta una pausa, cosi' una raffica di campi sulla stessa riga
// (o su righe vicine) ha tempo di finire prima che tutto si ridisegni.
let reloadTimer = null;
function reloadSoon(){
  clearTimeout(reloadTimer);
  // Azzerato PRIMA di reload(): se restasse valorizzato dopo lo scatto,
  // sembrerebbe per sempre "un reload gia' in coda" e poll() (sotto) non
  // aggiornerebbe mai piu' da solo.
  reloadTimer = setTimeout(() => { reloadTimer = null; reload(); }, 900);
}

document.addEventListener("change", async ev => {
  const d = ev.target.dataset;
  if(d.scontrinoFile !== undefined){
    const file = ev.target.files[0];
    ev.target.value = "";           // permette di rifotografare la stessa
    if(!file) return;
    let base64;
    try { base64 = await fotoScontrinoBase64(file); }
    catch(e) { return avvisa("Non sono riuscito a leggere la foto: " + e.message); }
    // Barra, non l'anello: qui il giro puo' durare fino a un minuto (il
    // modello si carica in memoria la prima volta), l'anello da solo
    // sembrerebbe piantato molto prima che finisca davvero.
    mostraOverlay({barra:true,
      testo:"Leggo lo scontrino… la prima volta puo' volerci fino a un minuto"});
    let letto;
    try { letto = await post("/api/scontrino", {immagine: base64}); }
    finally { nascondiOverlay(); }
    // post() ha gia' avvisato con avvisa() se letto.errore: qui basta
    // fermarsi, non c'e' niente da revisionare.
    if(!letto || letto.errore) return;
    return apriRevisioneScontrino(letto);
  }
  if(d.setcat){
    await post("/api/transaction", {id:d.setcat, categoria:ev.target.value});
    return reloadSoon();
  }
  if(d.natura){
    await post("/api/categories", {azione:"natura", nome:d.natura,
                                   natura:ev.target.value});
    return reload();
  }
  if(d.quota !== undefined || d.quotaChi !== undefined){
    const id = d.quota || d.quotaChi;
    const chi = document.querySelector(`[data-quota-chi="${id}"]`).value;
    const q = document.querySelector(`[data-quota="${id}"]`).value;
    const riga = (S.transactions || []).find(t => t.ID === id) || {};
    const corpo = quotaPayload(chi, q, !!(riga.Quota || riga["Pagato da"]));
    if(!corpo) return;
    await post("/api/transaction", {id, ...corpo});
    return reloadSoon();
  }
  if(d.fix){
    await post("/api/transaction", {id:d.id, [d.fix.toLowerCase()]:ev.target.value});
    return reloadSoon();
  }
  if(d.select){
    if(ev.target.checked) SELECTED.add(d.select); else SELECTED.delete(d.select);
    return render();
  }
  if(d.selectAll !== undefined){
    // Solo le righe disegnate ORA: su Transazioni "carica altre" ne mostra
    // un sottoinsieme, e spuntare "tutte" non deve raggiungere quelle non
    // ancora arrivate in pagina.
    document.querySelectorAll("[data-select]").forEach(box => {
      if(ev.target.checked) SELECTED.add(box.dataset.select);
      else SELECTED.delete(box.dataset.select);
    });
    return render();
  }
  if(d.card){
    const card = S.layout.find(c => c.id === d.card);
    card.visibile = ev.target.checked;
    await post("/api/layout", {layout:S.layout});
    return render();
  }
  if(d.andamento){
    ANDAMENTO[d.andamento] = ev.target.value;
    return render();
  }
});

["f-from","f-to","f-account","f-nature","f-category","f-sub"].forEach(id =>
  el(id).addEventListener("change", () => {
    F.from = el("f-from").value; F.to = el("f-to").value;
    F.account = el("f-account").value; F.nature = el("f-nature").value;
    F.sub = el("f-sub").value;
    // Cambiare area rende la sottocategoria di prima senza senso: appartiene
    // a un'altra area, e tenerla lascerebbe la tabella vuota.
    if(el("f-category").value !== F.category){
      F.category = el("f-category").value;
      F.sub = "";
    }
    render();
  }));
let typing;
el("f-text").addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(() => { F.text = el("f-text").value; render(); }, 250);
});
el("f-reset").addEventListener("click", () => {
  Object.keys(F).forEach(k => F[k] = "");
  // "Azzera" pulisce tutto, ma "la mia quota" e' il default dell'app, non un
  // filtro da azzerare: senza questa riga il pulsante lo riportava a "tutto".
  F.lettura = "mia";
  render();
});
// --------------------------------------------------------------------------
// log
// --------------------------------------------------------------------------
let LOG_AT = 0;          // segnalibro: da quale riga chiedere la prossima volta
let LOG_TIMER = null;
let LOG_FOLLOW = true;

const openLog = () => { document.body.classList.add("log-on"); pullLog(); };
const closeLog = () => {
  document.body.classList.remove("log-on");
  clearTimeout(LOG_TIMER); LOG_TIMER = null;
};

function logLine(text){
  // Le righe del modello si distinguono a colpo d'occhio: quando ne scorrono
  // centinaia, l'esito e' l'unica cosa che si cerca davvero.
  let cls = "";
  if(text.startsWith("LLM")){
    cls = "llm";
    if(text.includes("ragiona:")) cls = "think";
    else if(text.includes("accettata")) cls = "ok";
    else if(text.includes("SCARTATA")) cls = "ko";
  }
  return cls ? `<span class="${cls}">${esc(text)}</span>` : esc(text);
}

async function pullLog(){
  clearTimeout(LOG_TIMER); LOG_TIMER = null;
  if(!document.body.classList.contains("log-on")) return;
  let data;
  try{
    data = await (await fetch("/api/log?from=" + LOG_AT)).json();
  }catch(e){ LOG_TIMER = setTimeout(pullLog, 2000); return; }

  if(data.next < LOG_AT){ LOG_AT = 0; el("log-body").innerHTML = ""; }
  if(data.lines.length){
    const body = el("log-body");
    body.insertAdjacentHTML("beforeend",
      data.lines.map(logLine).join("\n") + "\n");
    LOG_AT = data.next;
    if(LOG_FOLLOW) body.scrollTop = body.scrollHeight;
  }
  el("log-state").textContent = data.running
    ? `elaboro… ${data.next} righe` : `${data.next} righe`;
  // Mentre gira si guarda spesso, a riposo quasi mai.
  LOG_TIMER = setTimeout(pullLog, data.running ? 600 : 3000);
}

el("btn-log").addEventListener("click", () =>
  document.body.classList.contains("log-on") ? closeLog() : openLog());
el("log-close").addEventListener("click", closeLog);
el("log-follow").addEventListener("click", () => {
  LOG_FOLLOW = !LOG_FOLLOW;
  el("log-follow").textContent = LOG_FOLLOW ? "↓ segui" : "↓ fermo";
  if(LOG_FOLLOW) el("log-body").scrollTop = el("log-body").scrollHeight;
});
// Scorrere a mano verso l'alto significa "voglio leggere qui": non trascinare.
el("log-body").addEventListener("scroll", () => {
  const b = el("log-body");
  const inCoda = b.scrollHeight - b.scrollTop - b.clientHeight < 30;
  if(LOG_FOLLOW !== inCoda){
    LOG_FOLLOW = inCoda;
    el("log-follow").textContent = LOG_FOLLOW ? "↓ segui" : "↓ fermo";
  }
});

// "Carica" e "Ricarica" girano senza modello: durano secondi e a parita' di
// file danno sempre lo stesso consolidato.
//
// Il log si apre da solo in entrambi i casi: e' il momento in cui serve. Il
// server AVVIA e basta, la fine la scopre poll(), che riabilita i pulsanti
// quando running torna falso.
async function start(button, route){
  el(button).disabled = true;
  LOG_AT = 0;
  el("log-body").innerHTML = "";
  openLog();
  await post(route, {llm: false});
  pullLog();
}

el("btn-load").addEventListener("click", () => {
  if(!((S && S.pending) || []).length) return;
  start("btn-load", "/api/carica");
});
el("btn-run").addEventListener("click", () => start("btn-run", "/api/run"));
el("btn-export").addEventListener("click", () => {
  // Non fetch+JSON: una navigazione vera, cosi' e' il browser a gestire il
  // download (Content-Disposition: attachment nella risposta) -- funziona
  // identico dal telefono sulla rete di casa, non solo dal PC dove gira il
  // server. Niente scritto sul disco del server: il file esiste solo nella
  // risposta.
  //
  // target="_blank" non e' decorativo: in modalita' "aggiunta a Home"
  // (standalone, senza barra Safari) iOS non ha il gestore download di
  // Safari, e senza aprire una scheda vera il file finiva dritto nella
  // preview/condivisione invece di poter scegliere dove salvarlo.
  const a = document.createElement("a");
  a.href = "/api/export.xlsx";
  a.download = "bilancio.xlsx";
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
});

// --------------------------------------------------------------------------
// caricamento
// --------------------------------------------------------------------------
async function reload(){
  const r = await fetch("/api/state");
  S = await r.json();
  VERSION = S.version;
  setStatus();
  render();
}

async function poll(){
  try{
    const r = await fetch("/api/state?light=1");
    const light = await r.json();
    const attesaOra = (S && S.pending) ? S.pending.length : 0;
    if(light.version !== VERSION || light.running !== (S && S.running)
       || light.pending !== attesaOra){
      if(light.running){ S.running = true; setStatus(); }
      // Un reload di un campo e' gia' in coda (reloadSoon()): e' lui a
      // ridisegnare quando l'utente si ferma, il poll non deve anticiparlo
      // ogni 4 secondi mentre sta ancora scrivendo.
      else if(!reloadTimer) await reload();
    }
  }catch(e){ /* server fermo, riprova al giro dopo */ }
}

// Disegnati subito, prima dei dati: altrimenti la barra dei filtri si sposta
// in giu' quando arrivano, e un clic partito prima colpisce la riga sbagliata.
renderQuick();
reload().then(() => setInterval(poll, 4000));

// Ruotare il telefono (o ridimensionare la finestra oltre i 640px) deve
// spostare subito #tablist nel suo posto giusto, non aspettare fino a 4
// secondi il prossimo giro di poll(). typeof window: vedi il commento su
// posizionaTablist(), stesso motivo.
if(typeof window !== "undefined"){
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(posizionaTablist, 120);
  });
}
